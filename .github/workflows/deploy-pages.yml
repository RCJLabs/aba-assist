name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight: a half-published Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Quality gate. This must always pass — it is the real signal about whether the code and
  # content are sound.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      channel: pr

  # Publication gate, kept separate and deliberately non-failing.
  #
  # Content that has not been through clinical review is an expected state, not a broken
  # build. The site still publishes so it can be reviewed on a real device — reviewing
  # content is hard to do any other way — but it publishes as a clearly-marked preview:
  # the app shows a persistent banner and robots.txt disallows indexing. Both of those are
  # driven by the content itself, not by this workflow.
  #
  # A release build no longer needs every entry approved. It ships the approved ones and
  # withholds the rest, so the public app grows with each review session instead of waiting
  # for the last entry. What it does need is the spine complete — the task outlines, both
  # ethics codes, the renewal facts and every escalation card — and enough of the glossary
  # to be worth indexing. Until then this check fails and the preview goes out instead,
  # which is a statement about readiness rather than a fault.
  gate:
    name: Release readiness
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: check
        run: |
          if npx tsx packages/content-build/src/cli.ts check --channel=release; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ready — publishing a release build of the approved content. Anything still unapproved is withheld from it."
          else
            echo "channel=pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing a PREVIEW build: the release gate is not met yet (see the check output above for which required content is unapproved, or whether the glossary is still below the minimum). The app shows a review banner and robots.txt disallows indexing. This is the review gate, not a build failure."
          fi

  deploy:
    name: Build and deploy
    needs: [ci, gate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The base path and the custom domain are one decision, so they are derived from one
      # file rather than set in two places.
      #
      # Without `static/CNAME` this is a Pages *project* site: the app is served from a
      # subdirectory and every URL needs that prefix, derived from the repo name rather
      # than hardcoded because the repo has been renamed once already and a stale literal
      # here 404s every asset while CI stays green.
      #
      # With `static/CNAME` the app owns an origin, so the prefix is empty. That is also
      # the requirement for the Play Store build: Android verifies a Trusted Web Activity
      # against `/.well-known/assetlinks.json` at the ORIGIN ROOT, which a project site
      # cannot serve at all.
      #
      # Getting these two out of step does not fail the build — it silently breaks the
      # service worker scope and every cached URL. Hence one source of truth.
      - name: Resolve the base path
        run: |
          set -e
          if [ -f static/CNAME ]; then
            domain="$(tr -d '[:space:]' < static/CNAME)"
            test -n "$domain" || { echo "::error::static/CNAME is empty"; exit 1; }
            echo "ABA_BASE_PATH=" >> "$GITHUB_ENV"
            echo "::notice::Custom domain $domain — serving from the origin root."
          else
            echo "ABA_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "::notice::Project site — serving from /${{ github.event.repository.name }}."
          fi
      # Built here rather than reusing the CI artifact: that one is built without the base
      # path, so every asset URL in it would 404 on a project site.
      - run: npm run build
        env:
          ABA_CONTENT_CHANNEL: ${{ needs.gate.outputs.channel }}
      # The most common way to ship a broken PWA is an install-blocking manifest, which is
      # invisible until someone tries to install it on a phone.
      - name: Check the build is installable
        run: |
          set -e
          test -f build/manifest.webmanifest || { echo "::error::no web manifest"; exit 1; }
          test -f build/sw.js || { echo "::error::no service worker"; exit 1; }
          test -f build/200.html || { echo "::error::no SPA fallback — offline deep links will break"; exit 1; }
          for icon in icon-192 icon-512 maskable-512; do
            test -f "build/icons/$icon.png" || { echo "::error::missing icons/$icon.png"; exit 1; }
          done
          grep -q "\"${ABA_BASE_PATH}/200.html\"" build/sw.js \
            || { echo "::error::navigation fallback is not the SPA shell"; exit 1; }
          grep -q '{url:"200.html"' build/sw.js \
            || { echo "::error::SPA fallback is missing from the precache — offline deep links will break"; exit 1; }
          # Read and parse, not require(): Node treats a .webmanifest extension as
          # JavaScript and throws on the first colon.
          node -e "
            const m = JSON.parse(require('fs').readFileSync('./build/manifest.webmanifest', 'utf8'));
            if (m.start_url !== '${ABA_BASE_PATH}/') throw new Error('start_url is ' + m.start_url);
            if (m.scope !== '${ABA_BASE_PATH}/') throw new Error('scope is ' + m.scope);
            if (!m.icons.some(i => i.purpose === 'maskable')) throw new Error('no maskable icon');
            console.log('manifest OK', m.start_url, m.scope, m.icons.length + ' icons');
          "
      # A custom domain is what makes a Trusted Web Activity possible, and an unfilled
      # asset-links file is how a TWA ships with the browser URL bar visible. Not an error
      # — the web app is fine without it — but it should never be a surprise.
      - name: Check the asset links
        run: |
          set -e
          if [ -f build/CNAME ]; then
            test -f build/.well-known/assetlinks.json \
              || { echo "::error::custom domain but no .well-known/assetlinks.json"; exit 1; }
            test -f build/.nojekyll \
              || { echo "::error::no .nojekyll — Pages will hide .well-known/ and asset links will 404"; exit 1; }
            if [ "$(tr -d '[:space:]' < build/.well-known/assetlinks.json)" = "[]" ]; then
              echo "::warning::assetlinks.json is still empty. Fill it with the SHA-256 fingerprint of the key that signs the AAB before shipping the TWA, or the app installs with a URL bar."
            fi
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
