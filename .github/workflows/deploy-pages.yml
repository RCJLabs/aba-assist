name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight: a half-published Pages site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # This repo publishes to a GitHub Pages *project* site, so the app is served from a
  # subdirectory and every URL needs that prefix.
  #
  # Derived from the repo name rather than hardcoded: the repo was renamed once already,
  # and a stale literal here 404s every asset on the deployed site while CI stays green.
  #
  # When a custom domain is added: set this to an empty string and add `static/CNAME`.
  # It must be empty for the Play Store build — Android verifies a Trusted Web Activity
  # via `/.well-known/assetlinks.json` at the ORIGIN ROOT, which a project site cannot
  # serve. See the README.
  ABA_BASE_PATH: /${{ github.event.repository.name }}

jobs:
  # Quality gate. This must always pass — it is the real signal about whether the code and
  # content are sound.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      channel: pr

  # Publication gate, kept separate and deliberately non-failing.
  #
  # Content that has not been through clinical review is an expected state, not a broken
  # build. The site still publishes so it can be reviewed on a real device — reviewing
  # content is hard to do any other way — but it publishes as a clearly-marked preview:
  # the app shows a persistent banner and robots.txt disallows indexing until every entry
  # is approved. Both of those are driven by the content itself, not by this workflow.
  gate:
    name: Release readiness
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: check
        run: |
          if npx tsx packages/content-build/src/cli.ts check --channel=release; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "::notice::All content is approved — publishing a release build."
          else
            echo "channel=pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing a PREVIEW build: some entries have not completed clinical review. The app shows a review banner and robots.txt disallows indexing until they are approved. This is the review gate, not a build failure."
          fi

  deploy:
    name: Build and deploy
    needs: [ci, gate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Built here rather than reusing the CI artifact: that one is built without the base
      # path, so every asset URL in it would 404 on a project site.
      - run: npm run build
        env:
          ABA_CONTENT_CHANNEL: ${{ needs.gate.outputs.channel }}
      # The most common way to ship a broken PWA is an install-blocking manifest, which is
      # invisible until someone tries to install it on a phone.
      - name: Check the build is installable
        run: |
          set -e
          test -f build/manifest.webmanifest || { echo "::error::no web manifest"; exit 1; }
          test -f build/sw.js || { echo "::error::no service worker"; exit 1; }
          test -f build/200.html || { echo "::error::no SPA fallback — offline deep links will break"; exit 1; }
          for icon in icon-192 icon-512 maskable-512; do
            test -f "build/icons/$icon.png" || { echo "::error::missing icons/$icon.png"; exit 1; }
          done
          grep -q "\"${ABA_BASE_PATH}/200.html\"" build/sw.js \
            || { echo "::error::navigation fallback is not the SPA shell"; exit 1; }
          grep -q '{url:"200.html"' build/sw.js \
            || { echo "::error::SPA fallback is missing from the precache — offline deep links will break"; exit 1; }
          # Read and parse, not require(): Node treats a .webmanifest extension as
          # JavaScript and throws on the first colon.
          node -e "
            const m = JSON.parse(require('fs').readFileSync('./build/manifest.webmanifest', 'utf8'));
            if (m.start_url !== '${ABA_BASE_PATH}/') throw new Error('start_url is ' + m.start_url);
            if (m.scope !== '${ABA_BASE_PATH}/') throw new Error('scope is ' + m.scope);
            if (!m.icons.some(i => i.purpose === 'maskable')) throw new Error('no maskable icon');
            console.log('manifest OK', m.start_url, m.scope, m.icons.length + ' icons');
          "
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
