# RBT Test Content Outline (3rd edition) — structural facts only.
#
# Domain names and exam weights are FACTS and are corroborated across multiple
# independent sources. They are modelled here freely; the certifying board's wording for
# what each task says is not reproduced anywhere in this repo (see OfficialTextGuard).
#
# `tasks` is deliberately EMPTY and `countsVerified` is false.
#
# Why: bacb.com was unreachable from the environment this content was drafted in, so the
# per-domain task counts and the individual task codes could not be confirmed against the
# primary document. Inventing plausible-looking task codes would be exactly the failure
# mode that makes the existing apps in this space untrustworthy. They get filled in — with
# our own summaries — once someone reads the source PDF. Until then the build will not
# enforce a total it knows nobody has checked, and taskRefs are simply not validated.
#
# VERIFY BEFORE M1 SIGN-OFF: https://www.bacb.com/test-content-outlines-for-bacb-certifications/

