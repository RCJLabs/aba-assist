# RBT Test Content Outline (3rd edition) — structural facts only.
#
# Domain names and exam weights are FACTS and are corroborated across multiple
# independent sources. They are modelled here freely; the certifying board's wording for
# what each task says is not reproduced anywhere in this repo (see OfficialTextGuard).
#
# `tasks` is deliberately EMPTY and `countsVerified` is false.
#
# What IS verified, from the RBT Handbook (06/2026) read on 2026-09-14: 43 tasks in six
# content areas; 75 scored plus 10 unscored questions; 90 minutes; and the per-area
# question counts and weights below. What is NOT verified is the individual task codes,
# because the outline document itself has not been read. Inventing plausible-looking task
# codes would be exactly the failure mode that makes the existing apps in this space
# untrustworthy. Until the outline is read, content is tagged to these areas at the
# domain level (taskRefs with a bare letter), which the build validates.
#
# TO FILL IN: read the RBT Test Content Outline (3rd ed.) PDF, then add each task with an
# original summary and flip countsVerified to true.

id: rbt-tco-3
credential: RBT
edition: '3rd'
effectiveDate: '2026-01-01'
issuer: BACB
sourceId: bacb-rbt-tco-3
subsetOf: null
countsVerified: false
totalTasks: 43

exam:
  scoredItems: 75
  unscoredItems: 10
  minutes: 90

domains:
  - letter: A
    name: Data Collection and Graphing
    examWeightPercent: 17
    examItems: 13
    ourDescription: >-
      Recording what actually happened during a session and turning it into something a
      supervisor can read. Covers continuous and discontinuous measurement, recording
      accuracy, and putting data on a graph so change over time is visible.
    tasks: []

  - letter: B
    name: Behavior Assessment
    examWeightPercent: 11
    examItems: 8
    ourDescription: >-
      The technician's part in finding out why a behaviour happens and what a learner
      prefers — assisting with preference assessments and functional assessment
      procedures that a supervisor designs and interprets.
    tasks: []

  - letter: C
    name: Behavior Acquisition
    examWeightPercent: 25
    examItems: 19
    ourDescription: >-
      Teaching new skills. The largest domain on the exam: teaching procedures, prompting
      and prompt fading, chaining, generalisation and maintenance, and running programmes
      the way they are written.
    tasks: []

  - letter: D
    name: Behavior Reduction
    examWeightPercent: 19
    examItems: 14
    ourDescription: >-
      Implementing the reduction side of a behaviour plan as written — antecedent
      strategies, differential reinforcement, and the technician's role in following a
      plan they did not design and may not modify.
    tasks: []

  - letter: E
    name: Documentation and Reporting
    examWeightPercent: 13
    examItems: 10
    ourDescription: >-
      Session notes, incident reporting, and communicating with the supervisor. Covers
      what belongs in a note, objective versus subjective language, and the legal and
      billing consequences of vague documentation.
    tasks: []

  - letter: F
    name: Ethics
    examWeightPercent: 15
    examItems: 11
    ourDescription: >-
      Scope of practice, supervision requirements, confidentiality, dual relationships,
      professional boundaries, and dignity. The number of ethics tasks doubled in this
      edition relative to the 2nd.
    tasks: []

