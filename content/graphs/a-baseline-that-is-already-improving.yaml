readings:
  - id: baseline-trend
    feature: trend
    phaseId: baseline
    text: >-
      Baseline climbs from one step to seven across nine sessions, in the same direction
      the teaching is meant to produce. Nothing about that is a bad thing for the learner;
      it is only a problem for the reader trying to credit the teaching.
  - id: teaching-trend
    feature: trend
    phaseId: teaching
    text: >-
      Teaching continues the same climb at roughly the same slope. If you covered the
      phase-change line, nothing in the data would tell you where it belonged.
  - id: what-it-shows
    feature: design
    phaseId: null
    text: >-
      The honest reading is that the learner improved and this graph cannot say why. That
      is a real finding, not a failure to find one.
longDescription: >-
  A line graph of steps completed independently across eighteen sessions. During
  Baseline, sessions one to nine, the count rises steadily from one to seven. A
  phase-change line follows session nine. During Teaching, sessions ten to eighteen, the
  count continues rising from seven to eleven at about the same rate. The slope either
  side of the phase-change line is similar, and there is no step up at the change.
teaching: >-
  A baseline is not a formality before the interesting part; it is the comparison the
  whole graph rests on. When baseline is already moving in the direction the programme
  intends, improvement afterwards is exactly what would have happened anyway, and the
  graph cannot separate the two. This is why a baseline is usually extended until it is
  flat or heading the wrong way — not to delay teaching, but because starting on a rising
  baseline spends the same weeks and buys no information. Notice what is not being said:
  this does not mean the teaching failed, and it certainly does not mean somebody should
  withhold teaching to protect a graph. Decisions about when a baseline has run long
  enough belong to the supervising analyst.
plainSummary: >-
  The dots were already going up before the plan changed. They kept going up at the same
  rate after. So the graph cannot show what the change did. The learner improved. The
  reason is not visible here.
