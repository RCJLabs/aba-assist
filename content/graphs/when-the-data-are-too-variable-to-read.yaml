readings:
  - id: baseline-variability
    feature: variability
    phaseId: baseline
    text: >-
      Baseline swings between three and twenty-five minutes from one session to the next.
      An average of thirteen describes almost none of the actual sessions.
  - id: intervention-variability
    feature: variability
    phaseId: intervention
    text: >-
      Intervention still swings, between nine and twenty-eight. The average has moved up,
      but the low sessions are barely different from the low baseline sessions.
  - id: overlap
    feature: overlap
    phaseId: intervention
    text: >-
      Most intervention sessions fall inside the baseline range. With overlap that heavy,
      a single session tells you nothing about which condition it came from.
  - id: what-next
    feature: design
    phaseId: null
    text: >-
      Data this variable usually mean something else is moving that nobody is measuring —
      who was present, what time of day, how the day before went. Finding it is the
      analyst's job, and the useful thing a technician can do is record the conditions
      accurately enough that the pattern can be found.
longDescription: >-
  A line graph of minutes of engagement across eighteen sessions. During Baseline,
  sessions one to eight, the values alternate sharply between three and twenty-five
  minutes with no settled level. A phase-change line follows session eight. During
  Intervention, sessions nine to eighteen, the values still alternate sharply, between
  nine and twenty-eight minutes. The Intervention average is higher than the Baseline
  average, but most Intervention sessions fall within the range covered by Baseline.
teaching: >-
  Variability is how much the data bounce around within a condition, and it decides how
  much any average is worth. Here the mean went up by about six minutes, which would look
  like a clear result in a table and looks like almost nothing on the graph. That gap
  between the table and the graph is the reason behavior analysis reads graphs at all.
  Heavy variability is also information rather than noise: something is systematically
  different between the high sessions and the low ones, and the pattern in this graph —
  alternating almost session by session — is the shape that usually points at a variable
  nobody has written down yet.
plainSummary: >-
  The dots jump up and down a lot in both parts of this graph. The average went up. But
  the low sessions look the same as before. So you cannot tell from one session which
  part of the graph it came from. Something else is going on.
