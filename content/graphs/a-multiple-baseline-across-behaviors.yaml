callouts: []
readings:
  - id: stagger
    feature: design
    phaseId: null
    text: >-
      Each tier stays flat until its own teaching starts, and only then climbs. Three
      times, at three different points, the behavior changed when and only when the
      teaching reached it.
  - id: untouched
    feature: level
    phaseId: naming-baseline
    text: >-
      Naming stays near zero for twelve sessions while the other two are already climbing.
      If something general were causing the improvement — maturation, a better term at
      school, more sleep — this tier would have moved too.
  - id: why-no-reversal
    feature: design
    phaseId: null
    text: >-
      Nothing is ever withdrawn here. That is the point: you cannot take a learned skill
      back to check, and you would not want to.
longDescription: >-
  Three stacked line graphs sharing a horizontal axis of eighteen sessions, showing
  correct responses out of ten. The top tier, greeting a peer, is in Baseline near one
  for sessions one to four, then in Teaching rises from three to ten. The middle tier,
  requesting a break, stays in Baseline near one for sessions one to eight, then in
  Teaching rises from two to ten. The bottom tier, naming an object, stays in Baseline
  near one for sessions one to twelve, then in Teaching rises from three to nine. Each
  tier has its own phase-change line, at sessions four, eight and twelve respectively,
  and each tier only begins to climb after its own line.
teaching: >-
  A multiple baseline gets its evidence from timing rather than from withdrawal. The
  argument runs: if teaching is what causes the change, then each behavior should change
  when its own teaching starts and not before. Staggering the starts is what makes that
  testable, and it is also what rules out the boring explanations — a child who is simply
  getting older, or a family who changed something at home, would improve on all three
  targets at once rather than in the order the teaching happened to reach them. The
  untouched tiers are doing real work while they sit flat, which is why a baseline that
  runs for twelve sessions is not wasted time. This design suits skills, where a reversal
  is impossible, and behavior where withdrawing a working procedure would not be
  acceptable.
plainSummary: >-
  Three skills are shown, one above the other. Teaching starts on each one at a different
  time. Each skill only goes up after its own teaching starts. The ones not yet taught
  stay flat. That timing is what shows the teaching did it.
