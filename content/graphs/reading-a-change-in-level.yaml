callouts: []
readings:
  - id: baseline-level
    feature: level
    phaseId: baseline
    text: >-
      Baseline sits around nineteen, varying by a couple either way. There is no trend:
      the last baseline session is no different from the first.
  - id: intervention-level
    feature: level
    phaseId: intervention
    text: >-
      Intervention sits around five or six. No intervention session is as high as the
      lowest baseline session, which is what makes the change hard to argue with.
  - id: immediacy
    feature: immediacy
    phaseId: intervention
    text: >-
      The drop is there in the first session after the change rather than drifting down
      over a week. A change that takes six sessions to appear is much weaker evidence,
      because six sessions is enough time for something else to explain it.
  - id: overlap
    feature: overlap
    phaseId: intervention
    text: >-
      No point in one condition falls inside the range of the other. That zero overlap is
      the property a reader is really checking when they say the effect looks clear.
longDescription: >-
  A line graph of talk-outs per thirty minutes across sixteen sessions. During Baseline,
  sessions one to seven, the count stays between seventeen and twenty-one. A phase-change
  line follows session seven. During Intervention, sessions eight to sixteen, the count
  drops immediately to eight and then settles between four and seven for the rest of the
  graph. No Intervention session overlaps the Baseline range.
teaching: >-
  Level is where the data sit, and a change in level is the easiest effect to see and the
  easiest to overstate. Three things turn a visible drop into a convincing one: the
  distance between the two levels, whether the change happens immediately after the
  condition changed, and how much the two conditions overlap. Overlap does most of the
  work. If the best baseline sessions look like the worst intervention sessions, then on
  any given day you could not tell which condition you were in — and a change you cannot
  detect session to session is not a change you can rely on. What a graph cannot tell you
  is whether the intervention caused the drop; an AB comparison shows that something
  changed when the condition changed, not what.
plainSummary: >-
  Level means where the dots sit. Here they sit high, then low. The drop happens in the
  first session after the change. No low session is as high as any high session. That
  is a clear change in level.
