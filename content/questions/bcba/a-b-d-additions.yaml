# BCBA practice questions — further items for areas A, B and D. All original; nothing drawn from any examination. Task codes are the verified 6th-edition codes.

questions:
  - id: bcba-a1-prediction
    credential: BCBA
    taskRef: { credential: BCBA, code: A.1 }
    type: single-best-answer
    stem: >-
      A study reports that classroom noise and off-task behaviour rise and fall together,
      with nothing manipulated. This supports:
    options:
      - id: a
        text: Description only
        isCorrect: false
        rationale: >-
          The relation between two variables goes beyond describing either one.
      - id: b
        text: Replication
        isCorrect: false
        rationale: >-
          Replication is a method for confirming findings rather than a level of
          understanding.
      - id: c
        text: Prediction, but not control
        isCorrect: true
        rationale: >-
          A correlation lets you anticipate one from the other without showing that changing
          one changes the other.
      - id: d
        text: Control, because the relation is consistent
        isCorrect: false
        rationale: >-
          Control requires manipulation; consistency of a correlation does not supply it.
    explanation: >-
      Science aims at description, prediction and control, and they are ordered by what
      they license. Correlational work supports prediction; only manipulation supports the
      claim that one variable produced the change in the other.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [functional-relation, experimental-control, confounding-variable, dependent-variable]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-15'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
      version: 1
      updated: '2026-09-15'
  - id: bcba-a2-determinism
    credential: BCBA
    taskRef: { credential: BCBA, code: A.2 }
    type: single-best-answer
    stem: >-
      The assumption of determinism in behaviour analysis commits the analyst to:
    options:
      - id: a
        text: Believing behaviour cannot be changed
        isCorrect: false
        rationale: >-
          Lawfulness is what makes deliberate change possible rather than impossible.
      - id: b
        text: Rejecting the existence of private events
        isCorrect: false
        rationale: >-
          Radical behaviourism includes private events rather than denying them.
      - id: c
        text: Explaining behaviour by inner states
        isCorrect: false
        rationale: >-
          That is mentalism, which determinism as used here works against.
      - id: d
        text: Treating behaviour as lawful and its causes as discoverable in the environment
        isCorrect: true
        rationale: >-
          Determinism is the working assumption that behaviour has orderly causes that can be
          found.
    explanation: >-
      The philosophical assumptions do practical work. Determinism is why an unexplained
      behaviour is treated as a gap in the analysis rather than as evidence of something
      uncaused, and it is what makes assessment worth doing.
    cognitiveLevel: recall
    difficulty: 2
    termRefs: [determinism, radical-behaviorism, empiricism, mentalism]
    citations:
      - sourceId: skinner-1953
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-a3-radical-vs-methodological
    credential: BCBA
    taskRef: { credential: BCBA, code: A.3 }
    type: single-best-answer
    stem: >-
      Radical behaviourism differs from methodological behaviourism principally in that
      it:
    options:
      - id: a
        text: Includes private events as behaviour to be explained by the same principles
        isCorrect: true
        rationale: >-
          Radical behaviourism treats thinking and feeling as behaviour, subject to the same
          analysis.
      - id: b
        text: Rejects the study of observable behaviour
        isCorrect: false
        rationale: >-
          Observable behaviour remains central to both positions.
      - id: c
        text: Requires physiological measurement
        isCorrect: false
        rationale: >-
          Neither position requires it.
      - id: d
        text: Denies that private events exist
        isCorrect: false
        rationale: >-
          That is closer to the methodological position, which excludes them from analysis.
    explanation: >-
      The distinction matters in practice. Treating a private event as behaviour means
      asking what controls it, rather than either ignoring it or promoting it to an
      explanation of the behaviour you can see.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [radical-behaviorism, methodological-behaviorism, private-event, mentalism]
    citations:
      - sourceId: skinner-1974
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-a4-eab-vs-aba
    credential: BCBA
    taskRef: { credential: BCBA, code: A.4 }
    type: single-best-answer
    stem: >-
      The experimental analysis of behaviour differs from applied behaviour analysis
      mainly in its:
    options:
      - id: a
        text: Purpose — understanding basic processes rather than improving socially important behaviour
        isCorrect: true
        rationale: >-
          The branches are distinguished by aim, with applied work committed to social
          importance.
      - id: b
        text: Use of single-case designs
        isCorrect: false
        rationale: >-
          Both branches use single-case designs extensively.
      - id: c
        text: Rejection of reinforcement as a principle
        isCorrect: false
        rationale: >-
          Both are built on the same principles.
      - id: d
        text: Requirement for human participants
        isCorrect: false
        rationale: >-
          Applied work uses humans; basic work often does not, but that follows from purpose.
    explanation: >-
      The four branches — behaviourism, the experimental analysis, applied behaviour
      analysis and practice — differ by aim rather than by method. The applied branch is
      defined by social importance, which is why social validity belongs to it
      specifically.
    cognitiveLevel: recall
    difficulty: 2
    termRefs:
      [
        experimental-analysis-of-behavior,
        applied-behavior-analysis,
        seven-dimensions-of-aba,
        social-validity
      ]
    citations:
      - sourceId: baer-wolf-risley-1968
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-a5-conceptually-systematic
    credential: BCBA
    taskRef: { credential: BCBA, code: A.5 }
    type: single-best-answer
    stem: >-
      Describing a procedure in terms of the basic principles it rests on satisfies which
      dimension?
    options:
      - id: a
        text: Technological
        isCorrect: false
        rationale: >-
          Technological means the description is complete enough to replicate, which is a
          different requirement.
      - id: b
        text: Effective
        isCorrect: false
        rationale: >-
          Effectiveness concerns whether the change is large enough to matter.
      - id: c
        text: Generality
        isCorrect: false
        rationale: >-
          Generality concerns whether change lasts, spreads and transfers.
      - id: d
        text: Conceptually systematic
        isCorrect: true
        rationale: >-
          Relating procedures to the underlying principles is what this dimension requires.
    explanation: >-
      The seven dimensions are separable criteria, and two are easily conflated.
      Technological asks whether somebody else could run it from the description;
      conceptually systematic asks whether it is tied to known principles rather than
      being an unexplained trick.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [seven-dimensions-of-aba, applied-behavior-analysis, evidence-based-practice]
    citations:
      - sourceId: baer-wolf-risley-1968
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-a5-effective-dimension
    credential: BCBA
    taskRef: { credential: BCBA, code: A.5 }
    type: single-best-answer
    stem: >-
      A procedure produces a statistically detectable but very small change that makes no
      practical difference. It fails which dimension?
    options:
      - id: a
        text: Behavioural
        isCorrect: false
        rationale: >-
          Behavioural concerns measuring behaviour itself rather than a proxy.
      - id: b
        text: Effective
        isCorrect: true
        rationale: >-
          The dimension requires change large enough to be of practical value, not merely
          detectable.
      - id: c
        text: Applied
        isCorrect: false
        rationale: >-
          Applied concerns whether the behaviour is socially important, which it may well be.
      - id: d
        text: Analytic
        isCorrect: false
        rationale: >-
          Analytic concerns whether control was demonstrated.
    explanation: >-
      Effectiveness in this framework is a practical criterion rather than a statistical
      one. A change too small to matter to the people involved fails, which is the
      dimension's point and its connection to social validity.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [seven-dimensions-of-aba, social-validity, applied-behavior-analysis]
    citations:
      - sourceId: baer-wolf-risley-1968
        useType: fact-reference
      - sourceId: wolf-1978
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-a2-parsimony-use
    credential: BCBA
    taskRef: { credential: BCBA, code: A.2 }
    type: single-best-answer
    stem: >-
      Parsimony requires that, before invoking a complex account of a behaviour, the
      analyst:
    options:
      - id: a
        text: Choose whichever account is most testable
        isCorrect: false
        rationale: >-
          Testability matters and is a different criterion from simplicity.
      - id: b
        text: Prefer the account that fits the most cases
        isCorrect: false
        rationale: >-
          Scope is not what parsimony concerns.
      - id: c
        text: Defer to the published literature
        isCorrect: false
        rationale: >-
          The literature informs the analysis rather than replacing the reasoning.
      - id: d
        text: Rule out the simpler explanations already available
        isCorrect: true
        rationale: >-
          Simple and established accounts are considered first, and complexity is added only
          when they fail.
    explanation: >-
      Parsimony is a working rule, not a claim that the world is simple. In practice it
      means checking whether an ordinary contingency accounts for the behaviour before
      reaching for anything more elaborate.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [parsimony, philosophic-doubt, empiricism, explanatory-fiction]
    citations:
      - sourceId: skinner-1953
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b3-elicited-vs-emitted
    credential: BCBA
    taskRef: { credential: BCBA, code: B.3 }
    type: single-best-answer
    stem: >-
      The clearest practical marker distinguishing respondent from operant behaviour is
      that respondent behaviour is:
    options:
      - id: a
        text: Elicited by an antecedent stimulus rather than selected by its consequences
        isCorrect: true
        rationale: >-
          Respondents are drawn out by a preceding stimulus; operants are strengthened or
          weakened by what follows.
      - id: b
        text: Always involuntary and never learned
        isCorrect: false
        rationale: >-
          Respondents can be conditioned, so they are certainly learned.
      - id: c
        text: Only observable in reflexes of the autonomic system
        isCorrect: false
        rationale: >-
          Respondent conditioning is not restricted to the autonomic system.
      - id: d
        text: Impossible to measure directly
        isCorrect: false
        rationale: >-
          Respondent behaviour is measured directly all the time.
    explanation: >-
      The two kinds of behaviour call for different analyses and different interventions.
      Asking whether the behaviour is drawn out by something before it or selected by
      something after it is the question that separates them.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [respondent-conditioning, operant-conditioning, three-term-contingency, stimulus]
    citations:
      - sourceId: skinner-1953
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b8-fi-scallop
    credential: BCBA
    taskRef: { credential: BCBA, code: B.8 }
    type: single-best-answer
    stem: >-
      A fixed-interval schedule characteristically produces:
    options:
      - id: a
        text: A high steady rate with a post-reinforcement pause
        isCorrect: false
        rationale: >-
          That describes fixed ratio.
      - id: b
        text: A very high rate with no pausing
        isCorrect: false
        rationale: >-
          That describes variable ratio.
      - id: c
        text: A pause after reinforcement followed by accelerating responding towards the end of the interval
        isCorrect: true
        rationale: >-
          That pattern, seen as a scallop on a cumulative record, is the signature of fixed
          interval.
      - id: d
        text: A steady moderate rate throughout
        isCorrect: false
        rationale: >-
          That is the variable-interval pattern.
    explanation: >-
      The four basic schedules produce four recognisable patterns, and the patterns follow
      from what the schedule makes relevant: time or responses, fixed or variable. Being
      able to read the pattern back to the schedule is the skill being tested.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        fixed-interval-schedule,
        variable-interval-schedule,
        fixed-ratio-schedule,
        variable-ratio-schedule,
        cumulative-record
      ]
    citations:
      - sourceId: ferster-skinner-1957
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b16-sd-availability
    credential: BCBA
    taskRef: { credential: BCBA, code: B.16 }
    type: single-best-answer
    stem: >-
      The practical difference between a discriminative stimulus and a motivating
      operation is that the discriminative stimulus signals:
    options:
      - id: a
        text: Availability of the consequence, while the motivating operation changes its value
        isCorrect: true
        rationale: >-
          One says the consequence is obtainable now; the other changes how much it is worth.
      - id: b
        text: Value, while the motivating operation signals availability
        isCorrect: false
        rationale: >-
          That reverses the two.
      - id: c
        text: Punishment, while the motivating operation signals reinforcement
        isCorrect: false
        rationale: >-
          Both can relate to either kind of consequence.
      - id: d
        text: Nothing, since they are the same thing
        isCorrect: false
        rationale: >-
          They are distinct antecedent functions with different effects.
    explanation: >-
      Confusing the two leads to the wrong intervention. If the learner does not want the
      consequence, signalling availability more loudly will not help; if they want it but
      do not know it is available, changing deprivation will not help either.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [discriminative-stimulus, motivating-operation, establishing-operation, stimulus-control]
    citations:
      - sourceId: michael-1982
        useType: fact-reference
      - sourceId: laraway-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b20-symmetry
    credential: BCBA
    taskRef: { credential: BCBA, code: B.20 }
    type: single-best-answer
    stem: >-
      After being taught to select B given A, a learner selects A given B without
      training. This demonstrates:
    options:
      - id: a
        text: Transitivity
        isCorrect: false
        rationale: >-
          Transitivity derives a relation between two stimuli through a shared third.
      - id: b
        text: Stimulus generalization
        isCorrect: false
        rationale: >-
          Generalization depends on physical similarity, while equivalence relations are
          arbitrary.
      - id: c
        text: Symmetry
        isCorrect: true
        rationale: >-
          Reversal of a trained conditional relation without training is symmetry.
      - id: d
        text: Reflexivity
        isCorrect: false
        rationale: >-
          Reflexivity is matching a stimulus to itself.
    explanation: >-
      The three defining relations are tested separately, and each is a different untaught
      outcome. A class is only demonstrated when reflexivity, symmetry and transitivity
      all hold among its members.
    cognitiveLevel: recall
    difficulty: 3
    termRefs: [stimulus-equivalence, matching-to-sample, discrimination-training]
    citations:
      - sourceId: sidman-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b22-matching-law-application
    credential: BCBA
    taskRef: { credential: BCBA, code: B.22 }
    type: single-best-answer
    stem: >-
      Two response options produce reinforcement at different rates. The matching law
      predicts that responding will be allocated:
    options:
      - id: a
        text: In proportion to the relative rate of reinforcement from each
        isCorrect: true
        rationale: >-
          Allocation matches the relative rate of reinforcement obtained from the
          alternatives.
      - id: b
        text: Entirely to whichever produces more
        isCorrect: false
        rationale: >-
          Exclusive choice is not what matching describes under concurrent schedules.
      - id: c
        text: Equally, regardless of the rates
        isCorrect: false
        rationale: >-
          Equal allocation would occur only where the rates were equal.
      - id: d
        text: According to the effort required only
        isCorrect: false
        rationale: >-
          Effort matters and is not the whole account; relative reinforcement rate is the core
          relation.
    explanation: >-
      The matching law is the reason a replacement behaviour has to compete rather than
      merely exist. It also explains why thinning the alternative too far returns the
      problem behaviour: the relative rates shift back.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        matching-law,
        concurrent-schedule,
        replacement-behavior,
        differential-reinforcement-of-alternative-behavior
      ]
    citations:
      - sourceId: herrnstein-1961
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b6-automatic-punishment
    credential: BCBA
    taskRef: { credential: BCBA, code: B.6 }
    type: single-best-answer
    stem: >-
      A behaviour decreases because it directly produces an uncomfortable consequence,
      with nobody else involved. This is:
    options:
      - id: a
        text: Automatic reinforcement
        isCorrect: false
        rationale: >-
          Reinforcement would increase the behaviour, and this decreased.
      - id: b
        text: Extinction
        isCorrect: false
        rationale: >-
          Extinction withholds a maintaining consequence rather than adding an aversive one.
      - id: c
        text: Automatic punishment
        isCorrect: true
        rationale: >-
          The punishing consequence is produced by the behaviour itself rather than delivered
          by another person.
      - id: d
        text: Socially mediated punishment
        isCorrect: false
        rationale: >-
          Social mediation requires another person to deliver the consequence.
    explanation: >-
      The automatic and socially mediated distinction applies to punishment as well as
      reinforcement. It matters because automatic consequences cannot be manipulated by
      changing what other people do, which constrains the available interventions.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        automatic-reinforcement,
        punishment,
        socially-mediated-reinforcement,
        sensory-extinction
      ]
    citations:
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b13-stimulus-generalization-gradient
    credential: BCBA
    taskRef: { credential: BCBA, code: B.13 }
    type: single-best-answer
    stem: >-
      A response trained to one tone occurs less and less as tones become less similar to
      the trained one. This pattern is:
    options:
      - id: a
        text: Response generalization
        isCorrect: false
        rationale: >-
          Response generalization varies the form of the response, not the stimulus.
      - id: b
        text: Stimulus equivalence
        isCorrect: false
        rationale: >-
          Equivalence relations are arbitrary rather than based on physical similarity.
      - id: c
        text: A generalization gradient
        isCorrect: true
        rationale: >-
          Responding graded by similarity to the trained stimulus is what a generalization
          gradient describes.
      - id: d
        text: A discrimination gradient reversal
        isCorrect: false
        rationale: >-
          Not a standard term for this pattern.
    explanation: >-
      A gradient shows how tightly stimulus control has been established. A steep gradient
      means narrow control and a flat one means broad control, and which is wanted depends
      entirely on the teaching goal.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [stimulus-generalization, stimulus-control, discrimination-training, generalization]
    citations:
      - sourceId: terrace-1963
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b10-extinction-variability
    credential: BCBA
    taskRef: { credential: BCBA, code: B.10 }
    type: single-best-answer
    stem: >-
      Alongside a temporary increase in rate, operant extinction commonly produces:
    options:
      - id: a
        text: Improved stimulus control
        isCorrect: false
        rationale: >-
          Extinction does not sharpen stimulus control as a side effect.
      - id: b
        text: Increased variability in the form of the response
        isCorrect: true
        rationale: >-
          Novel and previously reinforced forms appear when the usual response stops working,
          which is what makes extinction useful in shaping.
      - id: c
        text: Immediate and permanent cessation
        isCorrect: false
        rationale: >-
          Extinction produces gradual decline with characteristic disruption, not immediate
          cessation.
      - id: d
        text: A permanent reduction with no recovery
        isCorrect: false
        rationale: >-
          Spontaneous recovery after a break is well documented.
    explanation: >-
      The disruption extinction produces is not only a nuisance. Increased variability is
      what shaping exploits, and resurgence of older forms is what makes relapse
      predictable when a newer response stops paying.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [extinction, extinction-burst, variability, resurgence, shaping]
    citations:
      - sourceId: lerman-iwata-1996
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b21-momentum-application
    credential: BCBA
    taskRef: { credential: BCBA, code: B.21 }
    type: single-best-answer
    stem: >-
      Presenting several easy requests immediately before a difficult one exploits:
    options:
      - id: a
        text: Response generalization
        isCorrect: false
        rationale: >-
          The responses are different demands rather than untaught forms of one response.
      - id: b
        text: Negative reinforcement
        isCorrect: false
        rationale: >-
          Nothing is removed contingent on the behaviour.
      - id: c
        text: Behavioural momentum, by building responding that persists into the harder request
        isCorrect: true
        rationale: >-
          A run of reinforced compliance increases the persistence of responding when the
          harder demand arrives.
      - id: d
        text: Stimulus equivalence
        isCorrect: false
        rationale: >-
          No derived relations are involved.
    explanation: >-
      The high-probability request sequence is momentum applied. Its effect depends on the
      easy requests being genuinely high probability and reinforced, and on the difficult
      request following quickly, which is where implementations usually go wrong.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        behavioral-momentum,
        high-probability-request-sequence,
        antecedent-intervention,
        differential-reinforcement-of-alternative-behavior
      ]
    citations:
      - sourceId: mace-1988
        useType: fact-reference
      - sourceId: nevin-1992
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b18-mand-control
    credential: BCBA
    taskRef: { credential: BCBA, code: B.18 }
    type: single-best-answer
    stem: >-
      A learner says "water" while thirsty and is given water. The verbal operant is a
      mand because it is:
    options:
      - id: a
        text: Evoked by another person's verbal behaviour
        isCorrect: false
        rationale: >-
          Verbal antecedent control without point-to-point correspondence is an intraverbal.
      - id: b
        text: Under the control of a motivating operation and specifies its reinforcer
        isCorrect: true
        rationale: >-
          Mands are evoked by motivation and produce the specific consequence named.
      - id: c
        text: Under the control of a nonverbal stimulus
        isCorrect: false
        rationale: >-
          That would make it a tact.
      - id: d
        text: A repetition of what somebody else said
        isCorrect: false
        rationale: >-
          That would make it an echoic.
    explanation: >-
      The mand is the only verbal operant whose reinforcer is specified by the response
      itself, which is why it is usually taught first: it puts the learner in control of
      getting what they want, by a route other than problem behaviour.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [mand, motivating-operation, tact, echoic, functional-communication-training]
    citations:
      - sourceId: skinner-1957
        useType: fact-reference
      - sourceId: carr-durand-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d3-maturation
    credential: BCBA
    taskRef: { credential: BCBA, code: D.3 }
    type: single-best-answer
    stem: >-
      A student improves over a school year during an intervention. The threat that most
      directly competes with the intervention as an explanation is:
    options:
      - id: a
        text: Maturation
        isCorrect: true
        rationale: >-
          Development and ordinary improvement over time can produce the same change without
          any intervention.
      - id: b
        text: Instrumentation
        isCorrect: false
        rationale: >-
          Instrumentation concerns the measure changing, which is not described here.
      - id: c
        text: Reactivity
        isCorrect: false
        rationale: >-
          Reactivity is behaviour changing because of observation.
      - id: d
        text: Observer drift
        isCorrect: false
        rationale: >-
          Drift is a measurement threat rather than an alternative explanation of the change.
    explanation: >-
      Threats to internal validity are the alternative explanations a design has to rule
      out. Over long periods maturation is the most persistent, which is why extended
      baselines and staggered introductions carry so much weight.
    cognitiveLevel: application
    difficulty: 3
