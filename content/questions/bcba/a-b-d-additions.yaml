  - id: bcba-d4-steady-state
    credential: BCBA
    taskRef: { credential: BCBA, code: D.4 }
    type: single-best-answer
    stem: >-
      The logic of baseline requires that data be stable before the condition changes
      because:
    options:
      - id: a
        text: A stable baseline supports a prediction of what would have happened without the intervention
        isCorrect: true
        rationale: >-
          The prediction is what the intervention data are compared against, and an unstable
          baseline predicts nothing.
      - id: b
        text: Stability proves the measure is accurate
        isCorrect: false
        rationale: >-
          Stability and accuracy are different properties.
      - id: c
        text: Funders require a minimum number of sessions
        isCorrect: false
        rationale: >-
          Administrative requirements are not the logic.
      - id: d
        text: It reduces the number of sessions needed overall
        isCorrect: false
        rationale: >-
          Waiting for stability usually lengthens baseline rather than shortening the study.
    explanation: >-
      Single-case designs work by prediction, verification and replication. Baseline
      supplies the prediction, and its stability is what makes the prediction worth
      anything when the next condition departs from it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [baseline, visual-analysis, variability, experimental-control]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d7-reversal-unsuitable
    credential: BCBA
    taskRef: { credential: BCBA, code: D.7 }
    type: single-best-answer
    stem: >-
      A reversal design is least appropriate when:
    options:
      - id: a
        text: The behaviour occurs at a low rate
        isCorrect: false
        rationale: >-
          Low rates complicate measurement rather than ruling out the design.
      - id: b
        text: Only one participant is available
        isCorrect: false
        rationale: >-
          Reversal designs are built for single participants.
      - id: c
        text: The intervention is expensive
        isCorrect: false
        rationale: >-
          Cost is a practical constraint rather than a design one.
      - id: d
        text: The behaviour change is irreversible, such as an acquired academic skill
        isCorrect: true
        rationale: >-
          Withdrawal cannot return the behaviour to baseline if the change does not reverse,
          so the design cannot demonstrate control.
    explanation: >-
      Design selection follows from the behaviour and the ethics of withdrawal.
      Irreversible changes and cases where withdrawal would be harmful both point away
      from reversal and towards multiple baseline.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [reversal-design, multiple-baseline-design, experimental-control, single-case-design]
    citations:
      - sourceId: barlow-hayes-1979
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d8-mb-staggering
    credential: BCBA
    taskRef: { credential: BCBA, code: D.8 }
    type: single-best-answer
    stem: >-
      Staggering the introduction of the intervention across baselines in a multiple
      baseline design demonstrates control by showing that:
    options:
      - id: a
        text: Each behaviour changes only when the intervention reaches it, and not before
        isCorrect: true
        rationale: >-
          Change coinciding with introduction in each leg, and untreated legs staying stable,
          is the demonstration.
      - id: b
        text: All behaviours change at the same time
        isCorrect: false
        rationale: >-
          Simultaneous change would suggest a common external cause rather than the
          intervention.
      - id: c
        text: The intervention can be withdrawn safely
        isCorrect: false
        rationale: >-
          Withdrawal is the reversal design's mechanism, not this one's.
      - id: d
        text: Baselines are of equal length
        isCorrect: false
        rationale: >-
          Equal lengths would defeat the staggering that carries the logic.
    explanation: >-
      Multiple baseline replaces withdrawal with staggered introduction. The untreated
      baselines serve as the ongoing prediction, which is why change in an untreated leg
      is the result that undermines the demonstration.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [multiple-baseline-design, experimental-control, baseline, replication]
    citations:
      - sourceId: barlow-hayes-1979
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d9-atd-carryover
    credential: BCBA
    taskRef: { credential: BCBA, code: D.9 }
    type: single-best-answer
    stem: >-
      The principal threat in an alternating treatments design is:
    options:
      - id: a
        text: Maturation over a long baseline
        isCorrect: false
        rationale: >-
          Rapid alternation makes maturation a weak competitor.
      - id: b
        text: Irreversibility of the behaviour change
        isCorrect: false
        rationale: >-
          That is the reversal design's problem.
      - id: c
        text: Inability to compare two interventions
        isCorrect: false
        rationale: >-
          Comparing interventions is precisely what the design is for.
      - id: d
        text: Carryover between rapidly alternating conditions
        isCorrect: true
        rationale: >-
          Conditions alternating quickly can influence one another, obscuring the difference
          between them.
    explanation: >-
      Each design has a characteristic weakness. Alternating treatments compares
      conditions quickly and efficiently, at the cost of multiple-treatment interference,
      which is managed by signalling conditions clearly and counterbalancing their order.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [multielement-design, experimental-control, single-case-design, confounding-variable]
    citations:
      - sourceId: barlow-hayes-1979
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d5-replication-role
    credential: BCBA
    taskRef: { credential: BCBA, code: D.5 }
    type: single-best-answer
    stem: >-
      In single-case research, generality across people and settings is established
      principally through:
    options:
      - id: a
        text: Systematic replication across participants, settings and conditions
        isCorrect: true
        rationale: >-
          Repeating the demonstration under varied conditions is how single-case findings
          acquire reach.
      - id: b
        text: Random sampling from a population
        isCorrect: false
        rationale: >-
          Single-case work does not rest on sampling for its inferences.
      - id: c
        text: Statistical tests of significance
        isCorrect: false
        rationale: >-
          Significance testing does not establish generality in this framework.
      - id: d
        text: Increasing the number of sessions per participant
        isCorrect: false
        rationale: >-
          More sessions strengthen the individual demonstration rather than its generality.
    explanation: >-
      The two validities are pursued by different routes. Internal validity comes from the
      design within a case; external validity accumulates through direct and systematic
      replication, which is why the literature is built from many small demonstrations.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [replication, external-validity, single-case-design, internal-validity]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
      - sourceId: baer-wolf-risley-1968
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d6-verification
    credential: BCBA
    taskRef: { credential: BCBA, code: D.6 }
    type: single-best-answer
    stem: >-
      In the prediction, verification and replication logic, verification is achieved
      when:
    options:
      - id: a
        text: A second participant shows the same effect
        isCorrect: false
        rationale: >-
          That is replication across participants.
      - id: b
        text: Two observers agree on the data
        isCorrect: false
        rationale: >-
          That is measurement agreement rather than experimental logic.
      - id: c
        text: Returning to the prior condition returns the data towards the predicted pattern
        isCorrect: true
        rationale: >-
          Verification shows that the baseline prediction would have held, had the
          intervention not been introduced.
      - id: d
        text: The intervention is introduced and the data change
        isCorrect: false
        rationale: >-
          That is the departure from prediction rather than its verification.
    explanation: >-
      The three-step logic is what a reversal design enacts: baseline predicts,
      intervention departs from the prediction, and return to baseline verifies that the
      prediction would otherwise have held. Replication then repeats the departure.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [reversal-design, experimental-control, baseline, replication]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d2-internal-first
    credential: BCBA
    taskRef: { credential: BCBA, code: D.2 }
    type: single-best-answer
    stem: >-
      A demonstration with weak internal validity but conducted in many ordinary settings:
    options:
      - id: a
        text: Establishes a functional relation through breadth
        isCorrect: false
        rationale: >-
          Breadth does not substitute for control.
      - id: b
        text: Cannot support a claim that the intervention caused the change anywhere
        isCorrect: true
        rationale: >-
          Without internal validity there is no established effect to generalize, however many
          settings were involved.
      - id: c
        text: Has strong external validity that compensates
        isCorrect: false
        rationale: >-
          Generality of an unestablished effect is not worth anything.
      - id: d
        text: Is adequate for applied purposes
        isCorrect: false
        rationale: >-
          Applied work needs to know what produced the change in order to reproduce it.
    explanation: >-
      Internal validity is prior. A finding that is not established in one place cannot be
      generalized to many, which is why single-case work invests heavily in control before
      it invests in reach.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [internal-validity, external-validity, functional-relation, experimental-control]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d1-confound
    credential: BCBA
    taskRef: { credential: BCBA, code: D.1 }
    type: single-best-answer
    stem: >-
      During an intervention a teaching assistant is also added to the classroom. The most
      serious design consequence is that:
    options:
      - id: a
        text: The baseline must be extended
        isCorrect: false
        rationale: >-
          Extending baseline does not undo a confound introduced with the intervention.
      - id: b
        text: The independent variable is now two changes, so the effect cannot be attributed to either
        isCorrect: true
        rationale: >-
          Two variables changing together is a confound, and the design cannot separate their
          contributions.
      - id: c
        text: The dependent variable becomes unreliable
        isCorrect: false
        rationale: >-
          Measurement of the behaviour is unaffected by the confound.
      - id: d
        text: External validity is reduced
        isCorrect: false
        rationale: >-
          The problem is internal rather than about generalizing.
    explanation: >-
      A confound is another variable changing alongside the independent one. It is the
      commonest reason an applied demonstration cannot support the claim made for it, and
      it is prevented by naming precisely what will change and holding everything else
      constant.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [confounding-variable, independent-variable, internal-validity, experimental-control]
    citations:
      - sourceId: sidman-1960
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-d4-baseline-ethics
    credential: BCBA
    taskRef: { credential: BCBA, code: D.4 }
    type: single-best-answer
    stem: >-
      Extending a baseline while a harmful behaviour continues raises a conflict between:
    options:
      - id: a
        text: Internal and external validity
        isCorrect: false
        rationale: >-
          Both concern the evidence rather than the obligation to act.
      - id: b
        text: Measurement accuracy and practicality
        isCorrect: false
        rationale: >-
          That is a different trade-off entirely.
      - id: c
        text: Reliability and validity
        isCorrect: false
        rationale: >-
          Also a measurement question rather than an ethical one.
      - id: d
        text: Experimental rigour and the obligation to intervene promptly
        isCorrect: true
        rationale: >-
          A longer baseline strengthens the demonstration while leaving the behaviour
          untreated, which is the tension.
    explanation: >-
      Design decisions in applied work are constrained by obligations to the client. Where
      harm is occurring, the usual resolution is a design that does not require
      withholding treatment — multiple baseline rather than an extended baseline or a
      reversal.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [baseline, multiple-baseline-design, ethics-code, experimental-control]
    citations:
      - sourceId: barlow-hayes-1979
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
