  - id: bcba-e2-self-report
    credential: BCBA
    taskRef: { credential: BCBA, code: E.2 }
    type: single-best-answer
    stem: >-
      A certificant becomes aware they have violated a standard. The expected action is
      to:
    options:
      - id: a
        text: Resolve it privately with the affected party only
        isCorrect: false
        rationale: >-
          Making it right with the client is necessary and may not be sufficient.
      - id: b
        text: Consult a lawyer before taking any action
        isCorrect: false
        rationale: >-
          Legal advice may be prudent and does not replace addressing harm.
      - id: c
        text: Address the harm and use the reporting route the code requires
        isCorrect: true
        rationale: >-
          Accountability mechanisms depend on self-report as well as third-party report, and
          addressing harm comes first.
      - id: d
        text: Wait to see whether anybody raises it
        isCorrect: false
        rationale: >-
          Waiting is not an accountability mechanism.
    explanation: >-
      The system relies on certificants reporting themselves and one another, which is why
      the standards name the obligation explicitly. Concealment converts a violation into
      a more serious one.
    cognitiveLevel: application
    difficulty: 3
