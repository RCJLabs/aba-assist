  - id: bcba-e11-bias
    credential: BCBA
    taskRef: { credential: BCBA, code: E.11 }
    type: single-best-answer
    stem: >-
      An analyst notices they consistently rate supervisees from one background as less
      ready for independence. The most appropriate action is to:
    options:
      - id: a
        text: Examine the decisions against objective criteria and data, and change the process
        isCorrect: true
        rationale: >-
          Countering bias means checking the judgements against something external and
          altering how the decisions are made.
      - id: b
        text: Rely on intuition less and delay all independence decisions
        isCorrect: false
        rationale: >-
          Delaying decisions uniformly harms everybody and does not address the pattern.
      - id: c
        text: Ask the supervisees whether they feel treated fairly and act on that
        isCorrect: false
        rationale: >-
          Their view is worth having, but it places the burden on the people affected and does
          not test the judgements.
      - id: d
        text: Note it and monitor whether the pattern continues
        isCorrect: false
        rationale: >-
          Monitoring without changing anything allows a known problem to keep operating.
    explanation: >-
      Bias is not avoided by intending to be fair. The behaviour-analytic response is the
      one applied everywhere else: define the judgement operationally, measure it, compare
      it against criteria, and change the arrangement that produced the pattern.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [cultural-humility, supervision, performance-feedback, operational-definition]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-e12-mandated-reporting
    credential: BCBA
    taskRef: { credential: BCBA, code: E.12 }
    type: single-best-answer
    stem: >-
      An analyst forms a reasonable suspicion that a child is being harmed at home. The
      reporting obligation is triggered by:
    options:
      - id: a
        text: Reasonable suspicion, without needing to confirm it first
        isCorrect: true
        rationale: >-
          Mandated reporting statutes are built on suspicion precisely so that reporters are
          not asked to investigate.
      - id: b
        text: Confirmation by a second professional
        isCorrect: false
        rationale: >-
          Requiring corroboration would delay reports the statute intends to be prompt.
      - id: c
        text: The supervisor agreeing that a report should be made
        isCorrect: false
        rationale: >-
          Telling the supervisor is appropriate, but the legal duty attaches to the individual
          mandated reporter.
      - id: d
        text: Consent from the caregiver
        isCorrect: false
        rationale: >-
          Consent is not required and seeking it may place the child at greater risk.
    explanation: >-
      Legal and regulatory obligations sit alongside the ethics code and sometimes ahead
      of it. Mandated reporting is the clearest case: the standard is suspicion rather
      than proof, the duty is personal, and investigating is somebody else's job.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [mandated-reporter, confidentiality, ethics-code]
    citations:
      - sourceId: capta
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
