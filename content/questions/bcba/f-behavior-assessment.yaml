# BCBA practice questions — area F, Behavior Assessment. All original; nothing drawn from any examination. Task codes are the verified 6th-edition codes.

questions:
  - id: bcba-f1-missing-data
    credential: BCBA
    taskRef: { credential: BCBA, code: F.1 }
    type: single-best-answer
    stem: >-
      A record review shows an intervention was run for six months with no outcome data
      recorded. The most important implication is that:
    options:
      - id: a
        text: The intervention should be excluded from consideration
        isCorrect: false
        rationale: >-
          Excluding it on no evidence is as unsupported as adopting it.
      - id: b
        text: The previous team was negligent and should be reported
        isCorrect: false
        rationale: >-
          Poor documentation is a quality problem to note, not automatically a reportable one.
      - id: c
        text: Nothing can be concluded about whether it worked, and it should not be ruled in or out on that history
        isCorrect: true
        rationale: >-
          Absent data mean absent evidence; treating the period as a failed trial or a success
          are both unsupported.
      - id: d
        text: The intervention failed, or data would have been kept
        isCorrect: false
        rationale: >-
          Missing data are common for reasons unrelated to outcome and cannot be read as
          failure.
    explanation: >-
      What a record does not contain is part of what a review produces. An untested period
      is a gap in the history, and the useful output is knowing which questions the new
      assessment has to answer rather than an inference about what happened.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [treatment-integrity, data-sheet, indirect-assessment]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-15'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
      version: 1
      updated: '2026-09-15'
  - id: bcba-f1-prioritise-gaps
    credential: BCBA
    taskRef: { credential: BCBA, code: F.1 }
    type: single-best-answer
    stem: >-
      After a record review the analyst has partial skill data but nothing on the referral
      behaviour. Assessment effort should go first to:
    options:
      - id: a
        text: Caregiver interview about developmental history
        isCorrect: false
        rationale: >-
          History may be useful context but does not measure the behaviour in question.
      - id: b
        text: Direct measurement of the referral behaviour
        isCorrect: true
        rationale: >-
          The behaviour that prompted the referral has no data at all, so it is where the gap
          is largest and the question most urgent.
      - id: c
        text: Repeating the skills assessment to confirm it
        isCorrect: false
        rationale: >-
          Repeating existing data is the lowest-yield use of assessment time.
      - id: d
        text: A full preference assessment
        isCorrect: false
        rationale: >-
          Preference information will be needed but does not answer the referral question.
    explanation: >-
      Reviewing records is how assessment gets prioritised. Effort goes where the
      uncertainty is greatest and the question most consequential, which is normally the
      behaviour that caused somebody to refer.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [functional-behavior-assessment, descriptive-assessment, skills-assessment]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f2-interpreter
    credential: BCBA
    taskRef: { credential: BCBA, code: F.2 }
    type: single-best-answer
    stem: >-
      An assessment must be conducted with a family whose primary language differs from
      the analyst's. The most defensible arrangement is to:
    options:
      - id: a
        text: Work with a qualified interpreter and allow extra time for the session
        isCorrect: true
        rationale: >-
          Accurate information depends on the family being able to say what they mean, and
          interpretation takes time the schedule has to allow for.
      - id: b
        text: Use the eldest child to interpret, since they know the family best
        isCorrect: false
        rationale: >-
          Using a family member, especially a child, compromises accuracy and places them in
          an inappropriate role.
      - id: c
        text: Rely on direct observation only and skip the interview
        isCorrect: false
        rationale: >-
          Discarding the interview loses information nobody else can supply.
      - id: d
        text: Use a translation app during the session
        isCorrect: false
        rationale: >-
          Machine translation is unreliable for clinical content and offers no way to check
          understanding.
    explanation: >-
      Cultural and contextual variables affect what an assessment can detect and what
      goals come out of it. Language is the most concrete instance: an interview conducted
      through an inadequate channel produces data that look like findings but are
      artefacts of the channel.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [cultural-responsiveness, indirect-assessment, informed-consent]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f2-norms
    credential: BCBA
    taskRef: { credential: BCBA, code: F.2 }
    type: single-best-answer
    stem: >-
      A standardised tool was normed on a population very unlike the client. Using it, the
      analyst should:
    options:
      - id: a
        text: Interpret the scores with explicit caution and weight direct observation more heavily
        isCorrect: true
        rationale: >-
          A norm sample that does not represent the client makes the comparison less
          meaningful, so the interpretation has to say so and lean on data that do not depend
          on it.
      - id: b
        text: Use the scores as they stand, since the tool is standardised
        isCorrect: false
        rationale: >-
          Standardisation does not make a norm sample apply to everybody.
      - id: c
        text: Discard the tool entirely
        isCorrect: false
        rationale: >-
          The tool may still yield useful descriptive information even where the norms do not
          apply.
      - id: d
        text: Adjust the scores to compensate
        isCorrect: false
        rationale: >-
          Informal adjustment of standardised scores has no defensible basis.
    explanation: >-
      Contextual variables reach into the instruments themselves. Naming the limitation in
      the report is what lets the reader weigh it, and it is more honest than either using
      the number uncritically or discarding the information.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [skills-assessment, external-validity, cultural-responsiveness]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f3-direct-observation
    credential: BCBA
    taskRef: { credential: BCBA, code: F.3 }
    type: single-best-answer
    stem: >-
      The main advantage of direct observation over caregiver report in a skills
      assessment is that it:
    options:
      - id: a
        text: Takes less time
        isCorrect: false
        rationale: >-
          Direct observation usually takes considerably more time.
      - id: b
        text: Removes the need for a criterion-referenced tool
        isCorrect: false
        rationale: >-
          Observation and the tool are complementary; the tool supplies the criteria.
      - id: c
        text: Eliminates reactivity
        isCorrect: false
        rationale: >-
          Being observed can itself change behaviour, which is a limitation of observation
          rather than an advantage.
      - id: d
        text: Shows what the learner does under known conditions, rather than what somebody remembers
        isCorrect: true
        rationale: >-
          Observation fixes the conditions and records the behaviour as it happens, which
          report cannot do.
    explanation: >-
      Report and observation answer different questions and disagree for informative
      reasons. Report covers more situations and time; observation is accurate about the
      conditions it samples. A skills assessment normally needs both, and treats the
      disagreement as data.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [skills-assessment, reactivity, indirect-assessment, continuous-measurement]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f3-probe
    credential: BCBA
    taskRef: { credential: BCBA, code: F.3 }
    type: single-best-answer
    stem: >-
      A criterion-referenced assessment is being run and the learner fails an early item.
      The appropriate next step is normally to:
    options:
      - id: a
        text: Follow the tool's administration rules for basals and ceilings rather than improvising
        isCorrect: true
        rationale: >-
          Standardised administration is what makes the result interpretable against the
          criteria.
      - id: b
        text: Prompt the item until the learner succeeds, then move on
        isCorrect: false
        rationale: >-
          Prompting through converts an assessment into teaching and destroys the result.
      - id: c
        text: Stop the assessment and conclude the skill is absent
        isCorrect: false
        rationale: >-
          Single-item failure is not a conclusion, and the tool specifies how to proceed.
      - id: d
        text: Skip to the items the caregiver says the learner can do
        isCorrect: false
        rationale: >-
          Selecting items by expectation biases the assessment towards confirming the report.
    explanation: >-
      The value of a criterion-referenced tool is that everybody administering it does the
      same thing, so results mean the same thing. Departing from the administration rules
      produces a number that looks comparable and is not.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [skills-assessment, trials-to-criterion, treatment-integrity]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f4-free-operant
    credential: BCBA
    taskRef: { credential: BCBA, code: F.4 }
    type: single-best-answer
    stem: >-
      A learner will not tolerate items being removed once given. The preference
      assessment format that best suits this is:
    options:
      - id: a
        text: Free-operant observation
        isCorrect: true
        rationale: >-
          Free-operant formats record what the learner engages with when everything is freely
          available and nothing is removed.
      - id: b
        text: Paired-stimulus
        isCorrect: false
        rationale: >-
          Paired presentation requires removing the unchosen item on every trial.
      - id: c
        text: Multiple-stimulus without replacement
        isCorrect: false
        rationale: >-
          This format removes the chosen item after each selection, which is precisely the
          problem.
      - id: d
        text: Single-stimulus with forced removal after ten seconds
        isCorrect: false
        rationale: >-
          Timed removal is exactly what the learner does not tolerate.
    explanation: >-
      Preference assessment formats differ in how much information they yield and in what
      they demand of the learner. Format selection is a clinical decision that weighs a
      ranked hierarchy against the tolerability of the procedure.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        free-operant-preference-assessment,
        paired-stimulus-preference-assessment,
        multiple-stimulus-without-replacement,
        preference-assessment
      ]
    citations:
      - sourceId: roane-1998
        useType: fact-reference
      - sourceId: deleon-iwata-1996
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f4-hierarchy
    credential: BCBA
    taskRef: { credential: BCBA, code: F.4 }
    type: single-best-answer
    stem: >-
      Compared with a paired-stimulus assessment, a multiple-stimulus-without-replacement
      assessment generally:
    options:
      - id: a
        text: Works better for learners with limited scanning skills
        isCorrect: false
        rationale: >-
          An array demands more scanning than a pair, not less.
      - id: b
        text: Identifies the function of behaviour
        isCorrect: false
        rationale: >-
          Preference assessments identify potential reinforcers, not function.
      - id: c
        text: Produces a similar hierarchy in less time
        isCorrect: true
        rationale: >-
          Presenting an array and removing selections yields a ranking far more quickly than
          exhaustive pairing.
      - id: d
        text: Produces a more reliable hierarchy
        isCorrect: false
        rationale: >-
          Paired presentation is generally regarded as producing the more reliable ranking.
    explanation: >-
      The trade-off across formats is reliability against time and learner demands.
      Knowing which was used matters when reading somebody else's hierarchy, because the
      formats do not always agree and the differences are systematic.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        multiple-stimulus-without-replacement,
        paired-stimulus-preference-assessment,
        preference-assessment,
        reinforcer-assessment
      ]
    citations:
      - sourceId: deleon-iwata-1996
        useType: fact-reference
      - sourceId: fisher-1992
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f4-preference-vs-reinforcer
    credential: BCBA
    taskRef: { credential: BCBA, code: F.4 }
    type: single-best-answer
    stem: >-
      A preference assessment identifies an item as highly preferred, but using it
      contingently does not increase the target behaviour. The correct conclusion is:
    options:
      - id: a
        text: The learner is being non-compliant
        isCorrect: false
        rationale: >-
          That explains nothing and is not a behaviour-analytic account.
      - id: b
        text: The item has lost value through satiation, necessarily
        isCorrect: false
        rationale: >-
          Satiation is one possible explanation among several and is not established by the
          description.
      - id: c
        text: Preference does not guarantee reinforcer effect, and a reinforcer assessment is needed
        isCorrect: true
        rationale: >-
          Preference predicts reinforcer value imperfectly; whether a consequence reinforces
          is an empirical question about the behaviour.
      - id: d
        text: The preference assessment was run incorrectly
        isCorrect: false
        rationale: >-
          A correctly run assessment can still identify an item that does not function as a
          reinforcer for this response.
    explanation: >-
      Preference and reinforcer effect are different things measured in different ways.
      The only test of a reinforcer is whether contingent delivery increases the
      behaviour, which is why reinforcer assessment exists as a separate procedure.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [preference-assessment, reinforcer-assessment, reinforcer, satiation]
    citations:
      - sourceId: pace-1985
        useType: fact-reference
      - sourceId: roane-1998
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f5-scatterplot
    credential: BCBA
    taskRef: { credential: BCBA, code: F.5 }
    type: single-best-answer
    stem: >-
      A scatterplot is the descriptive tool best suited to answering:
    options:
      - id: a
        text: Whether two observers agree
        isCorrect: false
        rationale: >-
          That is an agreement question, unrelated to the tool.
      - id: b
        text: Whether the behaviour clusters at particular times of day or activities
        isCorrect: true
        rationale: >-
          Plotting occurrence against time slots across days is what exposes temporal
          patterns.
      - id: c
        text: What consequence maintains the behaviour
        isCorrect: false
        rationale: >-
          That requires ABC data or a functional analysis; a scatterplot shows when, not why.
      - id: d
        text: How long each episode lasts
        isCorrect: false
        rationale: >-
          Duration is measured directly; a scatterplot records occurrence within intervals.
    explanation: >-
      Descriptive assessment tools answer different questions. Scatterplots expose
      temporal patterning, ABC recording proposes antecedent and consequence relations,
      and interviews supply history. None of them establishes function, which needs
      manipulation.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [scatterplot, abc-recording, descriptive-assessment, functional-behavior-assessment]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f6-trial-based-fa
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      A trial-based functional analysis is most useful when:
    options:
      - id: a
        text: The behaviour must be assessed within ongoing classroom routines rather than in isolated sessions
        isCorrect: true
        rationale: >-
          Trial-based formats embed brief test and control segments in the natural routine,
          which suits settings where extended analogue sessions are impractical.
      - id: b
        text: The behaviour is dangerous and must not be evoked at all
        isCorrect: false
        rationale: >-
          Any functional analysis evokes the behaviour; safety is addressed by design and by
          latency-based variants, not by the trial-based format alone.
      - id: c
        text: No control condition is available
        isCorrect: false
        rationale: >-
          Trial-based analyses include control segments; they are shortened, not removed.
      - id: d
        text: The behaviour occurs at very high rates
        isCorrect: false
        rationale: >-
          High rates suit standard analogue formats perfectly well.
    explanation: >-
      Functional analysis variations exist to fit constraints: brief formats for limited
      time, latency-based for behaviour that should be evoked only once per session,
      trial-based for embedding in routines. The logic is identical; what changes is the
      arrangement.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [functional-analysis, experimental-control, single-case-design]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f6-undifferentiated
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      A functional analysis produces undifferentiated responding across all conditions.
      The most reasonable interpretation is:
    options:
      - id: a
        text: The behaviour has no function
        isCorrect: false
        rationale: >-
          All behaviour is maintained by something; an inconclusive analysis is a statement
          about the analysis.
      - id: b
        text: The learner is not a candidate for behaviour-analytic services
        isCorrect: false
        rationale: >-
          An inconclusive analysis is a reason to assess differently, not a judgement
          about whether the learner should receive services at all.
      - id: c
        text: Multiple functions have been ruled out
        isCorrect: false
        rationale: >-
          Undifferentiated data rule nothing out, which is the point.
      - id: d
        text: The behaviour may be automatically maintained, or the conditions did not capture the relevant variables
        isCorrect: true
        rationale: >-
          Undifferentiated results are consistent with automatic maintenance and with an
          analysis that failed to arrange the operative conditions.
    explanation: >-
      Reading a functional analysis includes reading a failure to differentiate. The usual
      next steps are to extend sessions, add an alone or ignore condition, refine the
      definition, or use structured criteria for deciding when data are conclusive.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [functional-analysis, automatic-reinforcement, multielement-design, visual-analysis]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f6-control-condition
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      The control condition in a standard functional analysis is designed so that:
    options:
      - id: a
        text: Every possible reinforcer is withheld
        isCorrect: false
        rationale: >-
          That describes an extinction arrangement, not a control condition.
      - id: b
        text: The behaviour is punished so it does not interfere
        isCorrect: false
        rationale: >-
          Punishment has no place in the control condition and would confound the comparison.
      - id: c
        text: Conditions match the natural environment exactly
        isCorrect: false
        rationale: >-
          The control is deliberately arranged rather than naturalistic; fidelity to the
          natural setting is the descriptive assessment's job.
      - id: d
        text: Reinforcers are freely available and demands are absent, so the behaviour has no reason to occur
        isCorrect: true
        rationale: >-
          The control provides a baseline of low responding against which the test conditions
          are compared.
    explanation: >-
      A functional analysis works by comparison. Each test condition isolates one
      candidate consequence while the control removes the reasons for the behaviour to
      occur, so differentiation between them is what identifies the maintaining variable.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        functional-analysis,
        multielement-design,
        experimental-control,
        noncontingent-reinforcement
      ]
    citations:
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f7-services-not-indicated
    credential: BCBA
    taskRef: { credential: BCBA, code: F.7 }
    type: single-best-answer
    stem: >-
      Assessment results indicate the concern is better addressed by another discipline.
      The analyst should:
    options:
      - id: a
        text: Reassess in six months before concluding anything
        isCorrect: false
        rationale: >-
          Delay is not warranted where the assessment already supports a conclusion.
      - id: b
        text: Say so in the report and support a referral to the appropriate service
        isCorrect: true
        rationale: >-
          Interpreting results includes concluding that behaviour-analytic services are not
          the right answer, and helping the client get to what is.
      - id: c
        text: Offer services anyway while the family pursues the referral
        isCorrect: false
        rationale: >-
          Delivering services that are not indicated is not made acceptable by a parallel
          referral.
      - id: d
        text: Decline further contact once the report is delivered
        isCorrect: false
        rationale: >-
          An abrupt end without supporting the transition fails the continuity obligation.
    explanation: >-
      Interpreting a referral means deciding whether services are needed and of what kind.
      Concluding that they are not is a legitimate result, and handling the handover well
      is part of the same obligation.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [scope-of-practice, continuity-of-care, collaboration]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f7-multiple-functions
    credential: BCBA
    taskRef: { credential: BCBA, code: F.7 }
    type: single-best-answer
    stem: >-
      Assessment suggests the same topography serves different functions in two settings.
      The most appropriate response is to:
    options:
      - id: a
        text: Plan separately for each setting, because the maintaining variable differs
        isCorrect: true
        rationale: >-
          A function-based plan follows the function, so two functions in two contexts require
          two treatments.
      - id: b
        text: Choose the more common function and treat that
        isCorrect: false
        rationale: >-
          This leaves the behaviour in the other setting untreated and may make it worse.
      - id: c
        text: Conclude the assessment is unreliable
        isCorrect: false
        rationale: >-
          Different functions in different contexts is a common and coherent finding, not an
          error.
      - id: d
        text: Treat it as automatically maintained
        isCorrect: false
        rationale: >-
          Nothing in the description supports that conclusion.
    explanation: >-
      Topography does not determine function, and the same response form can be maintained
      differently across contexts. Interpretation has to carry that through to the plan
      rather than collapsing it into a single treatment.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [function-of-behavior, functional-behavior-assessment, topography, response-class]
    citations:
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f8-social-significance
    credential: BCBA
    taskRef: { credential: BCBA, code: F.8 }
    type: single-best-answer
    stem: >-
      Which goal is most defensible on grounds of social significance?
    options:
      - id: a
        text: Requesting help, because it gives access to assistance across many settings
        isCorrect: true
        rationale: >-
          A goal that opens access to further reinforcement and further learning is socially
          significant in the sense the field intends.
      - id: b
        text: Sitting still for twenty minutes, because it makes group instruction easier
        isCorrect: false
        rationale: >-
          Convenience for adults is not by itself social significance, and stillness rarely
          serves the learner outside that context.
      - id: c
        text: Naming twenty animal flashcards, because it is measurable
        isCorrect: false
        rationale: >-
          Measurability is a property of the goal statement, not evidence that the skill
          matters.
      - id: d
        text: Making eye contact on command, because it looks attentive
        isCorrect: false
        rationale: >-
          Appearance of attending is not the same as a skill that benefits the learner.
    explanation: >-
      Prioritising goals asks who benefits and what the skill opens up. A behavioural cusp
      — a skill that exposes the learner to new contingencies and new learning — is the
      strongest case, and adult convenience is the weakest.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [social-validity, behavioral-cusp, pivotal-behavior, mand]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
      - sourceId: rosales-ruiz-baer-1997
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f8-cusp
    credential: BCBA
    taskRef: { credential: BCBA, code: F.8 }
    type: single-best-answer
    stem: >-
      A behavioural cusp is best described as a skill that:
    options:
      - id: a
        text: Is a prerequisite for a more complex skill in a task analysis
        isCorrect: false
        rationale: >-
          That is a component skill, which need not open new environments.
      - id: b
        text: Generalizes to untrained settings without programming
        isCorrect: false
        rationale: >-
          That is generalization, a different property.
      - id: c
        text: Can be taught in a small number of trials
        isCorrect: false
        rationale: >-
          Ease of teaching has nothing to do with whether a skill is a cusp.
      - id: d
        text: Exposes the learner to new environments, contingencies and learning opportunities
        isCorrect: true
        rationale: >-
          That consequence — opening access to further learning — is what defines a cusp.
    explanation: >-
      Cusps and pivotal behaviours are both arguments for prioritising one goal over
      another: a cusp opens new environments, a pivotal behaviour produces change across
      many untrained responses. Both answer the question of which goal buys the most.
    cognitiveLevel: recall
    difficulty: 3
    termRefs: [behavioral-cusp, pivotal-behavior, social-validity, generalization]
    citations:
      - sourceId: rosales-ruiz-baer-1997
        useType: fact-reference
      - sourceId: koegel-koegel-1999
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f8-caregiver-priority
    credential: BCBA
    taskRef: { credential: BCBA, code: F.8 }
    type: single-best-answer
    stem: >-
      Assessment identifies ten possible goals. The family names one that is not the
      analyst's first choice. The best response is to:
    options:
      - id: a
        text: Proceed with the clinical priority and revisit the family's later
        isCorrect: false
        rationale: >-
          Deferring the family's goal without discussion is how plans lose the people who have
          to run them.
      - id: b
        text: Work on all ten simultaneously
        isCorrect: false
        rationale: >-
          Spreading effort across ten goals is a way of achieving none.
      - id: c
        text: Ask the family to choose from the analyst's top three
        isCorrect: false
        rationale: >-
          Constraining the choice to the analyst's list is a version of not listening.
      - id: d
        text: Include the family's priority and discuss sequencing openly
        isCorrect: true
        rationale: >-
          Goals the family values are more likely to be supported, and social validity
          requires their priorities to carry weight.
    explanation: >-
      Social validity was defined around goals, procedures and outcomes being acceptable
      to the people affected. Prioritisation is where that is decided in practice, and it
      is a negotiation rather than a clinical determination made alone.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [social-validity, collaboration, informed-consent, cultural-responsiveness]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f5-abc-limits
    credential: BCBA
    taskRef: { credential: BCBA, code: F.5 }
    type: single-best-answer
    stem: >-
      ABC recording most directly produces:
    options:
      - id: a
        text: A demonstrated functional relation
        isCorrect: false
        rationale: >-
          That requires manipulation, which observational recording does not involve.
      - id: b
        text: A ranked reinforcer hierarchy
        isCorrect: false
        rationale: >-
          That is what preference assessment produces.
      - id: c
        text: A measure of treatment integrity
        isCorrect: false
        rationale: >-
          Integrity is measured against a procedure being run, not by ABC recording.
      - id: d
        text: Hypotheses about antecedents and consequences to test
        isCorrect: true
        rationale: >-
          It generates candidate relations that a functional analysis can then test
          experimentally.
    explanation: >-
      Descriptive assessment narrows the field before experimental work begins. Its output
      is a set of plausible relations, and its most common misuse is reporting one of them
      as the function.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [abc-recording, descriptive-assessment, three-term-contingency, functional-analysis]
    citations:
      - sourceId: bijou-peterson-ault-1968
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f3-ecological
    credential: BCBA
    taskRef: { credential: BCBA, code: F.3 }
    type: single-best-answer
    stem: >-
      An ecological assessment differs from a standard skills assessment in that it:
    options:
      - id: a
        text: Replaces the need for preference assessment
        isCorrect: false
        rationale: >-
          It answers a different question and does not substitute for one.
      - id: b
        text: Examines the settings the learner moves through and what those settings demand
        isCorrect: true
        rationale: >-
          It assesses the environments and their requirements rather than only the learner's
          repertoire.
      - id: c
        text: Uses only indirect methods
        isCorrect: false
        rationale: >-
          It commonly includes direct observation of the settings.
      - id: d
        text: Is restricted to home settings
        isCorrect: false
        rationale: >-
          It spans whatever settings are relevant.
    explanation: >-
      Assessing the environment alongside the learner is what makes goals fit the life the
      learner actually leads. A skill list drawn from a curriculum with no reference to
      the settings involved tends to produce goals nobody needs.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [ecological-assessment, skills-assessment, social-validity, generalization]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f6-brief-fa
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      Compared with a standard functional analysis, a brief functional analysis
      principally trades:
    options:
      - id: a
        text: Confidence in the result for the time it takes
        isCorrect: true
        rationale: >-
          Fewer and shorter sessions give a faster answer with weaker experimental control.
      - id: b
        text: Safety for speed
        isCorrect: false
        rationale: >-
          Brevity does not inherently make the analysis less safe.
      - id: c
        text: Internal validity for external validity
        isCorrect: false
        rationale: >-
          Shortening sessions weakens internal validity without improving generalizability.
      - id: d
        text: Precision of measurement for practicality
        isCorrect: false
        rationale: >-
          Measurement precision is not what the brief format alters; the number of
          replications is.
    explanation: >-
      Every variation of functional analysis trades something. Naming what has been given
      up is part of interpreting the result, and a brief analysis that differentiates
      clearly is more informative than one that does not.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [functional-analysis, internal-validity, replication, experimental-control]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f2-goals-from-context
    credential: BCBA
    taskRef: { credential: BCBA, code: F.2 }
    type: single-best-answer
    stem: >-
      Contextual variables affect not only how an assessment is run but also:
    options:
      - id: a
        text: Which goals are worth pursuing for this learner in this life
        isCorrect: true
        rationale: >-
          Goals are chosen against the settings, values and demands the learner actually
          faces.
      - id: b
        text: Whether reinforcement works as a principle
        isCorrect: false
        rationale: >-
          The principle does not vary by context, though the effective reinforcers do.
      - id: c
        text: Whether measurement is necessary
        isCorrect: false
        rationale: >-
          Measurement is required regardless of context.
      - id: d
        text: The validity of single-case designs
        isCorrect: false
        rationale: >-
          The design logic is not context-dependent in this sense.
    explanation: >-
      Accounting for context runs through to goal selection. Two learners with identical
      assessment profiles can warrant different goals because they live in different
      settings with different demands and different family priorities.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [ecological-assessment, social-validity, cultural-responsiveness, behavioral-cusp]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f7-what-kind
    credential: BCBA
    taskRef: { credential: BCBA, code: F.7 }
    type: single-best-answer
    stem: >-
      Assessment indicates services are needed. Determining what kind of service most
      depends on:
    options:
      - id: a
        text: The function of the behaviour and the skills assessment together
        isCorrect: true
        rationale: >-
          What to do follows from why the behaviour occurs and what the learner can already
          do.
      - id: b
        text: The intensity the funder will authorise
        isCorrect: false
        rationale: >-
          Funding constrains delivery but should not determine clinical indication.
      - id: c
        text: The family's availability for sessions
        isCorrect: false
        rationale: >-
          Practicality shapes scheduling rather than the kind of service indicated.
      - id: d
        text: The severity of the diagnosis
        isCorrect: false
        rationale: >-
          Diagnosis is not what behaviour-analytic service selection is built on.
    explanation: >-
      Interpretation joins the two halves of assessment. Function determines what the
      intervention has to replace or alter; the skills profile determines what can be
      built on. Constraints are then worked within rather than used to decide indication.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        function-of-behavior,
        skills-assessment,
        functional-behavior-assessment,
        scope-of-practice
      ]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f4-single-stimulus
    credential: BCBA
    taskRef: { credential: BCBA, code: F.4 }
    type: single-best-answer
    stem: >-
      A learner rejects most items and rarely selects when given a choice. The preference
      assessment format most likely to yield usable information is:
    options:
      - id: a
        text: Multiple-stimulus without replacement
        isCorrect: false
        rationale: >-
          An array demands more selection and more scanning than a pair, so it is a poorer
          fit rather than a better one.
      - id: b
        text: Caregiver questionnaire alone
        isCorrect: false
        rationale: >-
          Report is a reasonable starting point but is not a preference assessment, and it
          is least reliable for learners whose preferences are unclear to others.
      - id: c
        text: Single-stimulus presentation
        isCorrect: true
        rationale: >-
          Presenting one item at a time asks only whether the learner approaches it, which
          is the least demanding question and the one a learner who does not choose can
          still answer.
      - id: d
        text: Paired-stimulus presentation
        isCorrect: false
        rationale: >-
          Pairing requires choosing between two items, which is exactly what this learner
          does not do.
    explanation: >-
      Formats differ in what they demand of the learner as well as in what they yield.
      Single-stimulus gives approach data rather than a ranking, which is less information
      but is information, where a format the learner cannot complete gives none.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        single-stimulus-preference-assessment,
        paired-stimulus-preference-assessment,
        preference-assessment,
        multiple-stimulus-without-replacement
      ]
    citations:
      - sourceId: pace-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-f6-latency-based
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      A latency-based functional analysis ends each session at the first occurrence of the
      target behaviour. The principal reason for this arrangement is to:
    options:
      - id: a
        text: Avoid the need for a functional analysis altogether
        isCorrect: false
        rationale: >-
          It is a functional analysis, conducted with a different dependent measure.
      - id: b
        text: Limit how often the behaviour is evoked while still allowing conditions to be compared
        isCorrect: true
        rationale: >-
          Latency to the first response carries the comparison, so each condition needs the
          behaviour to occur only once rather than repeatedly.
      - id: c
        text: Produce a higher rate of responding for analysis
        isCorrect: false
        rationale: >-
          Ending at the first occurrence produces fewer responses, not more.
      - id: d
        text: Remove the need for a control condition
        isCorrect: false
        rationale: >-
          Latency-based analyses still compare test conditions against a control.
    explanation: >-
      Where evoking a behaviour repeatedly is the objection, latency rather than rate can
      carry the comparison. The experimental logic is unchanged — differentiated conditions
      against a control — and what changes is how much of the behaviour the analysis has to
      produce to reach a conclusion.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [functional-analysis, latency, experimental-control, multielement-design]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
