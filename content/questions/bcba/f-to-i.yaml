# BCBA practice questions — areas F through I. All original.

questions:
  - id: bcba-f6-fa-interpretation
    credential: BCBA
    taskRef: { credential: BCBA, code: F.6 }
    type: single-best-answer
    stem: >-
      In a multielement functional analysis, self-injury is high in the alone condition
      and low in the attention, demand and play conditions. Which interpretation is best
      supported?
    options:
      - id: a
        text: The analysis is inconclusive because the play condition was low
        isCorrect: false
        rationale: >-
          The play condition is the control and is expected to be low.
      - id: b
        text: The behavior is likely maintained by automatic reinforcement
        isCorrect: true
        rationale: >-
          Behavior that persists when no one is present to deliver consequences, and is
          low when social consequences are available, points to automatic reinforcement.
      - id: c
        text: The behavior is maintained by escape from demands
        isCorrect: false
        rationale: >-
          Escape-maintained behavior would be elevated in the demand condition.
      - id: d
        text: The behavior is maintained by attention
        isCorrect: false
        rationale: >-
          Attention-maintained behavior would be elevated in the attention condition.
    explanation: >-
      Each functional-analysis condition tests one contingency; the control (play)
      condition provides a comparison. Elevated responding only when alone is the
      signature of automatically reinforced behavior, which shapes treatment toward
      sensory-based alternatives and environmental enrichment.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [functional-analysis, automatic-reinforcement, multielement-design]
    citations:
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-14'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
      version: 1
      updated: '2026-09-14'

  - id: bcba-f4-preference-selection
    credential: BCBA
    taskRef: { credential: BCBA, code: F.4 }
    type: single-best-answer
    stem: >-
      An analyst needs a full ranking of eight potential reinforcers for a learner who
      tolerates items being removed and can scan an array. Time is limited to about ten
      minutes. Which format is the best fit?
    options:
      - id: a
        text: Paired-stimulus
        isCorrect: false
        rationale: >-
          Eight items require 28 pairs, which will not fit in ten minutes.
      - id: b
        text: Single-stimulus
        isCorrect: false
        rationale: >-
          Presenting items one at a time gives approach data but no comparison between
          items, so it ranks poorly.
      - id: c
        text: Free-operant observation
        isCorrect: false
        rationale: >-
          Free-operant assessment identifies what the learner engages with but often
          yields engagement with only one or two items rather than a full ranking.
      - id: d
        text: Multiple-stimulus without replacement
        isCorrect: true
        rationale: >-
          It produces a complete ranking in a few brief trials and suits a learner who
          can scan an array and tolerate removal.
    explanation: >-
      Preference-assessment formats trade thoroughness, time and demands on the learner.
      Multiple-stimulus without replacement is the efficient choice for a complete
      ranking; paired-stimulus is more thorough but grows quickly with the number of
      items.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        multiple-stimulus-without-replacement,
        paired-stimulus-preference-assessment,
        free-operant-preference-assessment
      ]
    citations:
      - sourceId: deleon-iwata-1996
        useType: fact-reference
      - sourceId: fisher-1992
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-f5-descriptive-limits
    credential: BCBA
    taskRef: { credential: BCBA, code: F.5 }
    type: single-best-answer
    stem: >-
      ABC data collected over two weeks show that a student's aggression is followed by
      adult attention in 80% of instances. What can the analyst conclude from these data
      alone?
    options:
      - id: a
        text: The data are useless without a functional analysis
        isCorrect: false
        rationale: >-
          Descriptive data are valuable for generating hypotheses and designing the
          analysis; they are simply not conclusive.
      - id: b
        text: Attention is a plausible hypothesis for the function, but the correlation does not demonstrate it
        isCorrect: true
        rationale: >-
          Descriptive data show what follows the behavior, not what maintains it. Adults
          may attend to aggression whatever its function. A functional analysis tests
          the hypothesis.
      - id: c
        text: The function is attention, so a treatment can be designed
        isCorrect: false
        rationale: >-
          A consequence that reliably follows a behavior is not necessarily the one
          maintaining it.
      - id: d
        text: The behavior is automatically reinforced because adults are not the cause
        isCorrect: false
        rationale: >-
          Nothing in the data suggests automatic reinforcement.
    explanation: >-
      Descriptive assessment reveals correlations under natural conditions. Because
      nothing is manipulated, it cannot separate the consequence that happens to follow a
      behavior from the one that maintains it. It generates the hypotheses that a
      functional analysis then tests.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [descriptive-assessment, abc-recording, functional-analysis]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-f8-prioritizing-goals
    credential: BCBA
    taskRef: { credential: BCBA, code: F.8 }
    type: single-best-answer
    stem: >-
      An assessment identifies many possible targets for a young learner. Which
      consideration should weigh most heavily in choosing the first target?
    options:
      - id: a
        text: Whether the behavior poses a risk to the learner's or others' safety and health
        isCorrect: true
        rationale: >-
          Risk to safety and health is the first consideration in prioritizing targets;
          everything else is weighed after it.
      - id: b
        text: Whether the target is easy to measure
        isCorrect: false
        rationale: >-
          Ease of measurement matters for feasibility but does not outrank the learner's
          welfare.
      - id: c
        text: Whether the analyst has a ready-made program for it
        isCorrect: false
        rationale: >-
          Convenience for the analyst is not a basis for prioritizing a client's goals.
      - id: d
        text: Whether the target will produce impressive data quickly
        isCorrect: false
        rationale: >-
          Fast results serve the provider more than the learner.
    explanation: >-
      Goals are prioritized by risk, by likely benefit to the learner — including cusps
      that open access to new environments — by the learner's and caregivers' values, and
      by feasibility. Safety comes first; social significance decides among the rest.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [social-validity, behavioral-cusp]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
      - sourceId: rosales-ruiz-baer-1997
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-f1-records-review
    credential: BCBA
    taskRef: { credential: BCBA, code: F.1 }
    type: single-best-answer
    stem: >-
      Before beginning a functional assessment for a new client with a history of
      medical problems, what should the analyst do first?
    options:
      - id: a
        text: Rely on the caregiver's summary instead of reading the records
        isCorrect: false
        rationale: >-
          Caregiver report is useful but incomplete; records contain information
          caregivers may not know or recall.
      - id: b
        text: Skip the records because prior providers may have been wrong
        isCorrect: false
        rationale: >-
          Prior records are data to be weighed, not ignored.
      - id: c
        text: Review available medical, educational and prior treatment records to identify variables that might affect the behavior or the assessment
        isCorrect: true
        rationale: >-
          Records may reveal medical conditions, medications or prior treatments that
          change how the behavior should be assessed or that require medical consultation
          first.
      - id: d
        text: Begin a functional analysis immediately to save time
        isCorrect: false
        rationale: >-
          Starting an experimental analysis without knowing the history risks missing a
          medical cause and can be unsafe.
    explanation: >-
      Assessment begins with what is already known. Records review can reveal medical
      contributors that require referral before behavioral assessment, prior treatments
      and their results, and the context the behavior occurs in.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [indirect-assessment, functional-behavior-assessment]
    citations:
      - sourceId: hanley-iwata-mccord-2003
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-g2-dro-interval
    credential: BCBA
    taskRef: { credential: BCBA, code: G.2 }
    type: single-best-answer
    stem: >-
      Baseline shows a learner's target behavior occurs about once every 4 minutes. An
      analyst is setting the initial interval for a DRO procedure. Which interval is
      most appropriate to start with?
    options:
      - id: a
        text: Exactly the baseline interval of 4 minutes
        isCorrect: false
        rationale: >-
          Matching the baseline interval gives roughly a coin-flip chance of
          reinforcement, which is a weak start.
      - id: b
        text: A random interval unrelated to baseline
        isCorrect: false
        rationale: >-
          The interval is derived from baseline data so that success is likely from the
          beginning.
      - id: c
        text: Shorter than the average time between occurrences, such as 2 to 3 minutes
        isCorrect: true
        rationale: >-
          The initial interval should be short enough that the learner frequently
          contacts reinforcement; it is then lengthened as the behavior decreases.
      - id: d
        text: Much longer than baseline, such as 20 minutes, to set a high standard
        isCorrect: false
        rationale: >-
          A long initial interval means the learner rarely earns reinforcement and the
          procedure has no effect.
    explanation: >-
      DRO intervals are set from baseline interresponse times so that reinforcement is
      contacted often at first, then gradually increased. Starting too long is the most
      common reason DRO fails.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [differential-reinforcement-of-other-behavior, interresponse-time]
    citations:
      - sourceId: vollmer-iwata-1992
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-g3-ncr-risk
    credential: BCBA
    taskRef: { credential: BCBA, code: G.3 }
    type: single-best-answer
    stem: >-
      A noncontingent-attention schedule is delivering attention every 90 seconds. Staff
      notice that the timed attention sometimes arrives seconds after the target behavior.
      What is the main risk, and what adjustment addresses it?
    options:
      - id: a
        text: Ratio strain; deliver attention more often
        isCorrect: false
        rationale: >-
          Ratio strain concerns response requirements, which a time-based schedule does
          not have.
      - id: b
        text: Accidental reinforcement of the target behavior; add a brief delay so attention is not delivered immediately after an occurrence
        isCorrect: true
        rationale: >-
          Time-based delivery can coincide with the behavior and strengthen it. A short
          omission or delay contingency after an occurrence is the standard safeguard.
      - id: c
        text: Satiation on attention; make the schedule leaner
        isCorrect: false
        rationale: >-
          Satiation is the intended effect of noncontingent reinforcement, not a risk.
      - id: d
        text: Extinction burst; stop the procedure
        isCorrect: false
        rationale: >-
          Noncontingent reinforcement usually reduces bursting compared with extinction
          alone.
    explanation: >-
      Noncontingent reinforcement reduces behavior by abolishing the motivation for it,
      but because delivery is independent of behavior it can accidentally follow the
      target behavior. Building in a brief delay after occurrences prevents that pairing.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [noncontingent-reinforcement, abolishing-operation]
    citations:
      - sourceId: vollmer-1993
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-g8-prompt-fading-choice
    credential: BCBA
    taskRef: { credential: BCBA, code: G.8 }
    type: single-best-answer
    stem: >-
      A learner responds correctly to a picture-naming task only when the analyst points
      to the correct card. Which procedure directly transfers control from the pointing
      prompt to the picture itself?
    options:
      - id: a
        text: Reinforcing only responses that occur after the point
        isCorrect: false
        rationale: >-
          That strengthens dependence on the prompt.
      - id: b
        text: Removing the point abruptly and correcting errors
        isCorrect: false
        rationale: >-
          Abrupt removal produces errors; fading is gradual by design.
      - id: c
        text: Progressive time delay, inserting a growing pause between the picture and the point
        isCorrect: true
        rationale: >-
          Delaying the prompt gives the learner the chance to respond to the natural
          stimulus first; responses that come before the prompt show transfer.
      - id: d
        text: Increasing the size of the correct card each session
        isCorrect: false
        rationale: >-
          Enlarging the card adds a stimulus prompt rather than fading the existing
          response prompt.
    explanation: >-
      Transfer of stimulus control is the goal of every prompting procedure. Time delay
      fades a response prompt along the dimension of time, stimulus fading along a
      physical dimension of the materials. Here the prompt is a response prompt, so time
      delay applies.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [time-delay, transfer-of-stimulus-control, stimulus-fading, prompt-fading]
    citations:
      - sourceId: touchette-1971
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-g4-token-design
    credential: BCBA
    taskRef: { credential: BCBA, code: G.4 }
    type: single-best-answer
    stem: >-
      Which element is essential when designing a token economy?
    options:
      - id: a
        text: Tokens that are themselves highly preferred items
        isCorrect: false
        rationale: >-
          Tokens are meant to be neutral objects whose value is conditioned; preferred
          objects as tokens invite consumption rather than exchange.
      - id: b
        text: A rule that tokens can never be lost once earned
        isCorrect: false
        rationale: >-
          Whether response cost is included is a design choice, not a requirement.
      - id: c
        text: Delivering tokens on a fixed-interval schedule regardless of behavior
        isCorrect: false
        rationale: >-
          Tokens are delivered contingent on target behavior; noncontingent delivery is a
          different procedure.
      - id: d
        text: A specified exchange schedule and a menu of backup reinforcers the tokens can be traded for
        isCorrect: true
        rationale: >-
          Tokens acquire and keep their value through exchange; without backups and a
          schedule for exchanging them, the tokens are not reinforcers.
    explanation: >-
      A token economy specifies the target behaviors, the tokens, the backup reinforcers,
      the exchange rate and schedule, and a plan for thinning. The exchange system is what
      makes the tokens generalized conditioned reinforcers.
    cognitiveLevel: recall
    difficulty: 2
    termRefs: [token-economy, generalized-conditioned-reinforcer]
    citations:
      - sourceId: kazdin-1977-token
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-g18-side-effects
    credential: BCBA
    taskRef: { credential: BCBA, code: G.18 }
    type: single-best-answer
    stem: >-
      When extinction is planned for an attention-maintained behavior, which side effect
      should the analyst prepare staff for, and how?
    options:
      - id: a
        text: Generalization to other settings; no action needed
        isCorrect: false
        rationale: >-
          Extinction effects do not automatically generalize, and behavioral contrast in
          other settings is possible.
      - id: b
        text: A temporary increase in the behavior and possible emotional responding; train staff to maintain the procedure consistently and specify a safety plan
        isCorrect: true
        rationale: >-
          Bursting and emotional or aggressive responding are documented side effects.
          Preparation means consistency, a plan for unsafe escalation, and often
          combining extinction with reinforcement of an alternative.
      - id: c
        text: Immediate elimination of the behavior; no preparation is needed
        isCorrect: false
        rationale: >-
          Extinction produces gradual reduction, typically with an initial increase.
      - id: d
        text: Satiation on attention; reduce attention across the day
        isCorrect: false
        rationale: >-
          Satiation is not an effect of extinction, and reducing attention generally
          would be harmful.
    explanation: >-
      Extinction and punishment both carry emotional and elicited side effects. Plans
      anticipate them by combining extinction with differential or noncontingent
      reinforcement, training staff to hold the procedure through the burst, and
      specifying what to do if behavior becomes unsafe.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [extinction-burst, extinction, behavioral-contrast]
    citations:
      - sourceId: lerman-iwata-wallace-1999
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-h2-contextual-fit
    credential: BCBA
    taskRef: { credential: BCBA, code: H.2 }
    type: single-best-answer
    stem: >-
      Two interventions have comparable research support for a learner's target
      behavior. One requires a staff member to be within arm's reach at all times; the
      classroom has one aide for six students. Which consideration should decide between
      them?
    options:
      - id: a
        text: Contextual fit — whether the setting can actually implement the procedure with integrity
        isCorrect: true
        rationale: >-
          With evidence equal, the intervention the setting can deliver as designed is
          the one likely to work; a procedure that cannot be implemented has no
          effectiveness.
      - id: b
        text: Which intervention the analyst has used most often
        isCorrect: false
        rationale: >-
          Familiarity to the analyst is not a feature of the client's context.
      - id: c
        text: Which intervention was published more recently
        isCorrect: false
        rationale: >-
          Recency is not evidence of effectiveness or fit.
      - id: d
        text: Which intervention produces the more dramatic graph
        isCorrect: false
        rationale: >-
          The graph depends on implementation; an unimplementable procedure produces no
          effect at all.
    explanation: >-
      Intervention selection weighs the evidence, the client's preferences and values,
      and contextual fit with the people and resources available. Fit is what turns an
      evidence-based procedure into a delivered one.
    cognitiveLevel: analysis
    difficulty: 2
    termRefs: [evidence-based-practice, treatment-integrity, social-validity]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
        locator: Selecting interventions
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-h5-resurgence
    credential: BCBA
    taskRef: { credential: BCBA, code: H.5 }
    type: single-best-answer
    stem: >-
      After successful functional communication training, a learner moves to a new
      classroom where staff do not honor the break request. The old escape behavior
      returns within days. Which term describes this and what would have reduced the risk?
    options:
      - id: a
        text: Resurgence; ensuring the replacement behavior continues to be reinforced across settings and staff
        isCorrect: true
        rationale: >-
          When the alternative stops being reinforced, the previously reinforced behavior
          returns. Programming generalization of the contingency to new staff and
          settings is the protection.
      - id: b
        text: Spontaneous recovery; waiting for it to pass
        isCorrect: false
        rationale: >-
          Spontaneous recovery occurs with time alone; here a specific change — loss of
          reinforcement for the alternative — triggered the return.
      - id: c
        text: Behavioral contrast; reducing reinforcement in the old classroom
        isCorrect: false
        rationale: >-
          Contrast involves a change in one setting affecting another; this is a direct
          effect within the new setting.
      - id: d
        text: Ratio strain; thinning the break schedule more slowly
        isCorrect: false
        rationale: >-
          The break request was not thinned; it was extinguished by staff who did not
          know the plan.
    explanation: >-
      Resurgence is a form of relapse in which extinction of the alternative brings back
      the original behavior. It is a predictable risk at transitions, and it is mitigated
      by training everyone who will interact with the learner and by generalization
      programming.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [resurgence, functional-communication-training, generalization]
    citations:
      - sourceId: lerman-iwata-1996
        useType: fact-reference
      - sourceId: stokes-baer-1977
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-h6-integrity-decision
    credential: BCBA
    taskRef: { credential: BCBA, code: H.6 }
    type: single-best-answer
    stem: >-
      Integrity data show that one step of a six-step plan — delivering the token within
      three seconds — is performed correctly only 30% of the time, while the other steps
      are at 95%. The staff member can describe the step accurately. What is the most
      appropriate first response?
    options:
      - id: a
        text: Remove the step from the plan
        isCorrect: false
        rationale: >-
          Immediacy of reinforcement is likely central to the plan's effectiveness.
      - id: b
        text: Conclude the plan is ineffective
        isCorrect: false
        rationale: >-
          The plan has not been delivered as designed, so its effectiveness is unknown.
      - id: c
        text: Treat it as a performance problem rather than a knowledge problem — rehearse the step with feedback and check whether the setting makes three-second delivery feasible
        isCorrect: true
        rationale: >-
          The staff member knows the step, so instruction alone will not help. Practice
          with feedback and a look at environmental barriers address the actual problem.
      - id: d
        text: Retrain the entire plan from the beginning
        isCorrect: false
        rationale: >-
          Five of six steps are at 95%; retraining everything wastes time and does not
          target the problem.
    explanation: >-
      Integrity data guide decisions about implementers: a skill deficit calls for
      training, a performance problem with a known skill calls for practice, feedback and
      removal of barriers, and a plan that cannot be delivered in the setting calls for
      revision.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [treatment-integrity, performance-diagnostic, performance-feedback]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
      - sourceId: peterson-homer-wonderlich-1982
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-h7-data-based-decision
    credential: BCBA
    taskRef: { credential: BCBA, code: H.7 }
    type: single-best-answer
    stem: >-
      A skill-acquisition program has been running for three weeks with integrity above
      90%. The data show a flat, low level of correct responding with no trend. What
      should the analyst do?
    options:
      - id: a
        text: Discontinue all services for the learner
        isCorrect: false
        rationale: >-
          One ineffective program is not grounds for ending services.
      - id: b
        text: Modify the program — for example, the prompting procedure, the reinforcer, or the target's prerequisites — and continue measuring
        isCorrect: true
        rationale: >-
          Well-implemented programs that produce no change are revised; the decision is
          made from the data rather than from hope or habit.
      - id: c
        text: Continue unchanged for another three months
        isCorrect: false
        rationale: >-
          Continuing an ineffective program without change costs the learner time.
      - id: d
        text: Retrain staff on the program
        isCorrect: false
        rationale: >-
          Integrity is already high; the problem is the program, not its delivery.
    explanation: >-
      Outcome data with adequate integrity are the basis for continuing, modifying or
      discontinuing an intervention. A flat trend after a reasonable trial period calls
      for modification and continued measurement, not persistence.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [visual-analysis, trend, treatment-integrity]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-h8-collaboration
    credential: BCBA
    taskRef: { credential: BCBA, code: H.8 }
    type: single-best-answer
    stem: >-
      A speech-language pathologist is teaching a learner to use a picture-exchange
      system while the behavior analyst's plan teaches signed requests for the same
      items. Which action best reflects the analyst's obligation to collaborate?
    options:
      - id: a
        text: Continue the sign program because behavior analysis has stronger evidence
        isCorrect: false
        rationale: >-
          Asserting disciplinary superiority is not collaboration and leaves the learner
          with conflicting teaching.
      - id: b
        text: Tell the family to choose which professional to keep
        isCorrect: false
        rationale: >-
          Forcing the family to choose shifts a professional problem onto them.
      - id: c
        text: Quietly adopt the picture system without discussion
        isCorrect: false
        rationale: >-
          Changing the plan without coordination or consent is neither collaboration nor
          good practice.
      - id: d
        text: Meet with the speech-language pathologist, with consent, to agree on a single communication approach and coordinate the programs
        isCorrect: true
        rationale: >-
          Two competing communication systems for the same function confuse the learner.
          Collaboration means coordinating goals with other professionals in the
          learner's life.
    explanation: >-
      The ethics code requires collaboration with other professionals in the client's
      best interest. Communication systems are a common point of conflict, and the
      learner benefits from one coordinated approach agreed on by both disciplines.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [collaboration, mand]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
        locator: Collaboration with colleagues
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-i5-bst
    credential: BCBA
    taskRef: { credential: BCBA, code: I.5 }
    type: single-best-answer
    stem: >-
      A supervisor needs to train four new technicians to run a prompting procedure. Which
      training approach has the strongest evidence for producing correct implementation?
    options:
      - id: a
        text: Behavioral skills training — instructions, modeling, rehearsal and feedback repeated to a performance criterion
        isCorrect: true
        rationale: >-
          The instruction-model-rehearse-feedback package, continued until the trainee
          meets a criterion, is the best-supported staff-training method.
      - id: b
        text: A written protocol and a quiz on its contents
        isCorrect: false
        rationale: >-
          Written instruction alone produces knowledge, not reliable performance.
      - id: c
        text: A lecture followed by a demonstration video
        isCorrect: false
        rationale: >-
          Without rehearsal and feedback, trainees rarely reach competent performance.
      - id: d
        text: Assigning trainees to observe an experienced technician for a week
        isCorrect: false
        rationale: >-
          Observation without practice and feedback is inefficient and inconsistent.
    explanation: >-
      Behavioral skills training combines the components that each partly work into a
      package that reliably does: explain, show, practice, give feedback, repeat until
      the criterion is met. Telling alone is its weakest component.
    cognitiveLevel: recall
    difficulty: 2
    termRefs: [behavioral-skills-training, performance-feedback]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-i6-performance-diagnostic
    credential: BCBA
    taskRef: { credential: BCBA, code: I.6 }
    type: single-best-answer
    stem: >-
      A technician's session notes are frequently late. The technician can describe the
      note requirements accurately and has written timely notes in the past. The notes
      system is only accessible from a shared computer that is usually occupied. Which
      remedy follows from a function-based analysis of the performance problem?
    options:
      - id: a
        text: Issue a written warning
        isCorrect: false
        rationale: >-
          Punishing a performance that the environment prevents is unfair and
          ineffective.
      - id: b
        text: Add a bonus for timely notes
        isCorrect: false
        rationale: >-
          Incentives do not help when the person cannot access the system.
      - id: c
        text: Remove the environmental barrier by providing reliable access to the notes system
        isCorrect: true
        rationale: >-
          The technician has the skill and has shown it before; the problem is an
          antecedent and resource barrier, which training would not fix.
      - id: d
        text: Retrain the technician on how to write notes
        isCorrect: false
        rationale: >-
          A skill the person already demonstrates is not a training problem.
    explanation: >-
      Performance diagnostics distinguish skill deficits from problems of antecedents,
      resources and consequences. The remedy follows the diagnosis: training for
      can't-do, environmental and contingency changes for won't-do or can't-get-to-it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [performance-diagnostic, performance-feedback]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-i2-feedback-delivery
    credential: BCBA
    taskRef: { credential: BCBA, code: I.2 }
    type: single-best-answer
    stem: >-
      Which feedback statement to a supervisee is most likely to improve performance?
    options:
      - id: a
        text: '"Good job today — keep it up."'
        isCorrect: false
        rationale: >-
          General praise does not tell the supervisee what to repeat.
      - id: b
        text: A list of every error observed across the whole month
        isCorrect: false
        rationale: >-
          A delayed list of errors is overwhelming and too far from the performance to
          change it.
      - id: c
        text: '"You know what you did wrong; fix it."'
        isCorrect: false
        rationale: >-
          It assumes the supervisee can identify and correct the problem without help.
      - id: d
        text: A specific statement of what was done correctly, one specific change to make, how to make it, and when the supervisor will check again
        isCorrect: true
        rationale: >-
          Effective feedback is specific, timely, balanced between correct and needed
          performance, and followed up.
    explanation: >-
      Feedback is the core supervisory behavior. The evidence favors feedback that is
      specific, delivered soon after the performance, includes both what to keep and what
      to change with a demonstration of how, and is followed by a check.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [performance-feedback, supervision]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-i1-benefits-of-supervision
    credential: BCBA
    taskRef: { credential: BCBA, code: I.1 }
    type: single-best-answer
    stem: >-
      Which outcome is the strongest argument for investing supervisor time in regular
      direct observation and feedback rather than in occasional meetings?
    options:
      - id: a
        text: Being able to assign more clients to each technician
        isCorrect: false
        rationale: >-
          Caseload is not the aim of supervision.
      - id: b
        text: Higher treatment integrity and better client outcomes, because implementation improves with observation and feedback
        isCorrect: true
        rationale: >-
          Supervision's purpose is client welfare through competent implementation;
          observation and feedback are what change performance.
      - id: c
        text: Fewer supervision hours to document
        isCorrect: false
        rationale: >-
          Documentation burden does not change with format, and reducing supervision is
          not a benefit.
      - id: d
        text: Meeting the minimum percentage requirement more easily
        isCorrect: false
        rationale: >-
          Meeting minimums is a floor, not the reason supervision matters.
    explanation: >-
      Effective supervision improves supervisee skills, treatment integrity, client
      outcomes and staff retention; poor supervision produces drift, harm and ethical
      violations. Direct observation with feedback is the active ingredient.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [supervision, treatment-integrity]
    citations:
      - sourceId: bacb-supervision-curriculum-2
        useType: fact-reference
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: bcba-i3-equitable-supervision
    credential: BCBA
    taskRef: { credential: BCBA, code: I.3 }
    type: single-best-answer
    stem: >-
      A supervisor notices that they give more informal coaching to supervisees who share
      their background and communication style. Which action best reflects equitable,
      culturally responsive supervision?
    options:
      - id: a
        text: Use a structured schedule of observation and feedback for every supervisee, and examine how the supervisor's own biases shape their attention
        isCorrect: true
        rationale: >-
          Structure equalizes access to supervision, and self-examination addresses the
          bias that produced the imbalance.
      - id: b
        text: Reduce coaching for the favored supervisees so everyone gets less
        isCorrect: false
        rationale: >-
          Leveling down harms the supervisees who were benefiting and helps no one.
      - id: c
        text: Assume the other supervisees need less support since they did not ask
        isCorrect: false
        rationale: >-
          Not asking often reflects the relationship, not the need.
      - id: d
        text: Ask supervisees to adapt their communication style to the supervisor's
        isCorrect: false
        rationale: >-
          Placing the burden of adaptation on supervisees inverts the supervisor's
          responsibility.
    explanation: >-
      Equity in supervision means every supervisee gets the observation, feedback and
      development they need, regardless of how much they resemble the supervisor. Power
      and identity shape the relationship, and the supervisor is responsible for
      noticing that.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [cultural-humility, supervision]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
        locator: Supervision and cultural responsiveness
    attestation: *att
    review: *rev
    provenance: *prov
