  - id: bcba-b21-behavioral-momentum
    credential: BCBA
    taskRef: { credential: BCBA, code: B.21 }
    type: single-best-answer
    stem: >-
      Two responses have the same rate, but one has a history of much denser
      reinforcement. When both are placed on extinction, the one with the denser history:
    options:
      - id: a
        text: Persists longer
        isCorrect: true
        rationale: >-
          Resistance to change increases with the rate of reinforcement in the presence of the
          stimulus situation, independent of response rate.
      - id: b
        text: Extinguishes faster
        isCorrect: false
        rationale: >-
          That reverses the relation; denser reinforcement histories produce greater
          persistence.
      - id: c
        text: Extinguishes at the same rate, because the response rates match
        isCorrect: false
        rationale: >-
          Response rate and resistance to change are separable. Momentum is about the
          stimulus–reinforcer relation, not the response–reinforcer one.
      - id: d
        text: Shows no extinction burst
        isCorrect: false
        rationale: >-
          Nothing about reinforcement density removes the burst; if anything a richer history
          makes the disruption more marked.
    explanation: >-
      Behavioral momentum treats persistence under changed conditions as analogous to
      mass. It explains why a well-reinforced problem behavior is hard to shift, and it
      is the reasoning behind high-probability request sequences.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [behavioral-momentum, extinction, resurgence, high-probability-request-sequence]
    citations:
      - sourceId: nevin-1992
        useType: fact-reference
      - sourceId: mace-1988
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b23-observational-learning
    credential: BCBA
    taskRef: { credential: BCBA, code: B.23 }
    type: single-best-answer
    stem: >-
      What distinguishes observational learning from imitation?
    options:
      - id: a
        text: Observational learning happens immediately and imitation is always delayed
        isCorrect: false
        rationale: >-
          Both can occur immediately or after a delay; timing is not the distinction.
      - id: b
        text: They are the same thing described at different levels
        isCorrect: false
        rationale: >-
          They are different: one depends on the model receiving a consequence, the other on
          matching the model.
      - id: c
        text: In observational learning the watcher changes behavior after seeing the model contact a consequence; imitation is copying the model itself
        isCorrect: true
        rationale: >-
          Observational learning depends on the observed consequence, whereas imitation
          requires only that the response formally match a model that acts as its
          discriminative stimulus.
      - id: d
        text: Imitation requires a verbal model and observational learning does not
        isCorrect: false
        rationale: >-
          Imitation concerns formal similarity to a model of any kind, not specifically verbal
          ones.
    explanation: >-
      Imitation is a response class where the behavior matches a model and the model
      functions as the discriminative stimulus. Observational learning is broader and
      hinges on what the observer sees happen to the model, which is why it can change
      behavior the observer never performed.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [imitation, observational-learning, modeling, discriminative-stimulus]
    citations:
      - sourceId: macduff-krantz-mcclannahan-2001
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-b24-derived-relations
    credential: BCBA
    taskRef: { credential: BCBA, code: B.24 }
    type: single-best-answer
    stem: >-
      A learner is taught that A goes with B and that B goes with C, and without further
      teaching selects C when given A. The untaught A–C relation is an instance of:
    options:
      - id: a
        text: Reflexivity
        isCorrect: false
        rationale: >-
          Reflexivity is matching a stimulus to itself, which requires no relation between
          different stimuli.
      - id: b
        text: Symmetry
        isCorrect: false
        rationale: >-
          Symmetry is the reversal of a trained relation — selecting A given B after being
          taught B given A.
      - id: c
        text: Generalization
        isCorrect: false
        rationale: >-
          Generalization depends on physical similarity or shared features. Equivalence
          relations are arbitrary and derived.
      - id: d
        text: Transitivity
        isCorrect: true
        rationale: >-
          Deriving a relation between two stimuli through a shared third is transitivity, one
          of the three relations that define stimulus equivalence.
    explanation: >-
      Equivalence-based instruction gets its efficiency from relations nobody taught:
      train a small number and a larger number emerge. Reflexivity, symmetry and
      transitivity are the three tests, and derived relational responding is the broader
      account of how generative language becomes possible.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [stimulus-equivalence, matching-to-sample, generalization, multiple-exemplar-training]
    citations:
      - sourceId: sidman-1994
        useType: fact-reference
      - sourceId: green-2001
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
