  - id: bcba-h8-caregiver-training
    credential: BCBA
    taskRef: { credential: BCBA, code: H.8 }
    type: single-best-answer
    stem: >-
      Collaboration with caregivers is most likely to produce durable change when the
      analyst:
    options:
      - id: a
        text: Trains them to run the procedure and gives feedback on their performance
        isCorrect: true
        rationale: >-
          Behavioural skills training with feedback is what produces implementation, as
          opposed to understanding.
      - id: b
        text: Explains the rationale thoroughly at the outset
        isCorrect: false
        rationale: >-
          Explanation supports buy-in but does not establish the skill.
      - id: c
        text: Provides a written plan and checks in monthly
        isCorrect: false
        rationale: >-
          Written instruction without rehearsal and feedback rarely produces accurate
          implementation.
      - id: d
        text: Runs the procedure for them during sessions
        isCorrect: false
        rationale: >-
          That produces change while the analyst is present and nothing afterwards.
    explanation: >-
      Collaboration is not only consultation. Caregivers are implementers, and
      implementers are trained the same way anybody is: instruction, modelling, rehearsal
      and feedback until performance meets criterion.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [behavioral-skills-training, performance-feedback, treatment-integrity, collaboration]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-h8-other-professionals
    credential: BCBA
    taskRef: { credential: BCBA, code: H.8 }
    type: single-best-answer
    stem: >-
      A speech pathologist and the analyst have overlapping goals that are stated
      differently. The productive response is to:
    options:
      - id: a
        text: Agree a shared operational definition and a single measure where the goals overlap
        isCorrect: true
        rationale: >-
          Two definitions of the same target produce contradictory data and confuse everybody
          implementing them.
      - id: b
        text: Keep separate goals so each discipline can report its own outcome
        isCorrect: false
        rationale: >-
          Parallel measurement of the same behaviour is exactly what produces the
          contradiction.
      - id: c
        text: Defer to the discipline with more sessions per week
        isCorrect: false
        rationale: >-
          Session volume does not settle a definitional question.
      - id: d
        text: Ask the family to choose between the two
        isCorrect: false
        rationale: >-
          This puts a technical disagreement onto the family.
    explanation: >-
      Interdisciplinary collaboration usually founders on definitions rather than on
      disagreement about aims. Agreeing what will be counted, by whom and how, is the
      concrete work that makes a shared plan possible.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [operational-definition, collaboration, interobserver-agreement, continuity-of-care]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcba-h8-client-involvement
    credential: BCBA
    taskRef: { credential: BCBA, code: H.8 }
    type: single-best-answer
    stem: >-
      Involving the client themselves in planning is most important because:
    options:
      - id: a
        text: Their preferences and assent shape whether the plan is acceptable and sustainable
        isCorrect: true
        rationale: >-
          The person receiving the intervention has the strongest claim on its goals and
          procedures, and their assent bears on whether it continues.
      - id: b
        text: It satisfies a documentation requirement
        isCorrect: false
        rationale: >-
          It may be documented, but that is not why it matters.
      - id: c
        text: It reduces the analyst's liability
        isCorrect: false
        rationale: >-
          Liability is not the clinical reason.
      - id: d
        text: Clients usually select the most effective procedures
        isCorrect: false
        rationale: >-
          Effectiveness is a separate question; involvement is about goals, acceptability and
          assent.
    explanation: >-
      Social validity was always defined around the people affected, and the client is
      first among them. Where the client can participate in choosing goals and procedures,
      doing so is both the ethical position and the practical one.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [assent, social-validity, dignity, informed-consent]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
      - sourceId: hanley-2014
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
