  - id: bcaba-i8-competing-contingencies
    credential: BCaBA
    taskRef: { credential: BCaBA, code: I.8 }
    type: single-best-answer
    stem: >-
      A supervisee has the skill and performs the procedure only when their manager is
      present. The most likely account is:
    options:
      - id: a
        text: Competing contingencies make the procedure costly when unobserved
        isCorrect: true
        rationale: >-
          The procedure competes with other demands, and only the manager's presence tips the
          balance.
      - id: b
        text: A skill deficit that appears intermittently
        isCorrect: false
        rationale: >-
          A skill that is reliably present under observation is available.
      - id: c
        text: Insufficient knowledge of the underlying principles
        isCorrect: false
        rationale: >-
          Knowledge does not vary with who is in the room.
      - id: d
        text: Poor initial training
        isCorrect: false
        rationale: >-
          Training produced a performance that occurs, which is evidence it worked.
    explanation: >-
      Managing what competes with a procedure — caseload, paperwork, the other eight
      things due that hour — is usually more effective than another round of training the
      person does not need.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [performance-diagnostic, stimulus-control, treatment-integrity, performance-feedback]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-i9-evaluating-supervision
    credential: BCaBA
    taskRef: { credential: BCaBA, code: I.9 }
    type: single-best-answer
    stem: >-
      Which measure best evaluates whether supervision is working?
    options:
      - id: a
        text: Change in supervisee performance, and in the outcomes of the learners they serve
        isCorrect: true
        rationale: >-
          Supervision is evaluated by what changes downstream of it, in both performance and
          client outcomes.
      - id: b
        text: The number of supervision hours delivered
        isCorrect: false
        rationale: >-
          Hours measure input, not effect.
      - id: c
        text: Supervisee satisfaction ratings
        isCorrect: false
        rationale: >-
          Satisfaction is worth knowing and correlates poorly with performance change.
      - id: d
        text: The proportion of required topics covered
        isCorrect: false
        rationale: >-
          Coverage is a completeness measure rather than an effectiveness one.
    explanation: >-
      The same standard applied to every other procedure in this field applies here: the
      justification for supervision is what it changes, and that is measurable.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [supervision, treatment-integrity, competency-assessment, visual-analysis]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-i9-adjusting
    credential: BCaBA
    taskRef: { credential: BCaBA, code: I.9 }
    type: single-best-answer
    stem: >-
      Data show a supervisee's procedural integrity has not improved over eight weeks of
      weekly feedback. The appropriate response is:
    options:
      - id: a
        text: Change the supervision approach and state what the change is meant to fix
        isCorrect: true
        rationale: >-
          Supervision that is not producing change should be modified in the same data-based
          way any procedure would be.
      - id: b
        text: Continue, since consistency is important in supervision
        isCorrect: false
        rationale: >-
          Consistency in an approach that is not working is persistence without a rationale.
      - id: c
        text: Conclude the supervisee is unsuitable for the role
        isCorrect: false
        rationale: >-
          The supervision approach has not been varied, so nothing supports that conclusion.
      - id: d
        text: Reduce the frequency of feedback
        isCorrect: false
        rationale: >-
          Less of an unsuccessful approach is unlikely to help and removes information.
    explanation: >-
      Eight weeks of unchanged data is a finding about the supervision, not only about the
      supervisee. Trying a different component — in-situ training, a checklist, reduced
      effort — is the data-based response.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [supervision, treatment-integrity, performance-feedback, behavioral-skills-training]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
