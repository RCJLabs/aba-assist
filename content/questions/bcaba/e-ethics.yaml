# BCaBA practice questions — area E, Ethical and Professional Issues. All original; nothing drawn from any examination. Task codes are the 6th-edition BCaBA codes.

questions:
  - id: bcaba-e1-core-principles
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.1 }
    type: single-best-answer
    stem: >-
      A programme would produce faster progress but the learner consistently signals
      distress during it. Which core principle most directly governs the decision?
    options:
      - id: a
        text: Benefiting others
        isCorrect: false
        rationale: >-
          This principle is engaged, but on its own it is what the speed argument appeals to;
          dignity is what it must be weighed against.
      - id: b
        text: Treating others with compassion, dignity and respect
        isCorrect: true
        rationale: >-
          Distress signalled by the learner is information about how they are being treated,
          and the principle requires it to carry weight against speed of progress.
      - id: c
        text: Ensuring competence
        isCorrect: false
        rationale: >-
          Competence concerns whether the practitioner is qualified, which is not what is in
          question.
      - id: d
        text: Behaving with integrity
        isCorrect: false
        rationale: >-
          Integrity concerns honesty and following through on commitments, which is a
          different issue here.
    explanation: >-
      The principles are meant to be weighed rather than ranked once and for all. What an
      assistant analyst should not do is settle this alone: a learner signalling distress
      in a programme is a supervisor conversation the same day.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [dignity, assent, ethics-code, supervision]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-16'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
      version: 1
      updated: '2026-09-16'
  - id: bcaba-e1-assent-withdrawal
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.1 }
    type: single-best-answer
    stem: >-
      A learner who previously joined a activity now pushes materials away and turns from
      the table each time it is presented. Treating this as assent withdrawal means:
    options:
      - id: a
        text: Waiting for the learner to say the word "no" before stopping
        isCorrect: false
        rationale: >-
          Assent withdrawal is not limited to speech; turning away and pushing materials are
          signals.
      - id: b
        text: Recording it, pausing the demand, and raising it with the supervisor
        isCorrect: true
        rationale: >-
          Assent withdrawal is information about the programme. An assistant analyst records
          it, stops pressing, and takes it to the person responsible for the plan.
      - id: c
        text: Continuing the activity, since consent was given by the guardian
        isCorrect: false
        rationale: >-
          Guardian consent does not override the learner's ongoing signals during a session.
      - id: d
        text: Removing the activity permanently from the programme
        isCorrect: false
        rationale: >-
          Discontinuing a programme component is a decision for the supervising analyst, not a
          unilateral one.
    explanation: >-
      Assent is treated as ongoing rather than as something collected once. The practical
      consequence for an assistant analyst is a specific two-step: do not press, and
      report it rather than absorbing it.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [assent, dignity, supervision, session-note]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: hanley-2014
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e1-integrity
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.1 }
    type: single-best-answer
    stem: >-
      An assistant analyst realises they recorded a session that did not take place as
      written. Acting with integrity requires:
    options:
      - id: a
        text: Leaving the record, since the session mostly happened as described
        isCorrect: false
        rationale: >-
          A record that misrepresents what occurred is inaccurate regardless of how close it
          was.
      - id: b
        text: Amending the record quietly without telling anyone
        isCorrect: false
        rationale: >-
          An undisclosed amendment to a service record creates a second problem on top of the
          first.
      - id: c
        text: Waiting to see whether anyone notices
        isCorrect: false
        rationale: >-
          Delay converts an error into a concealment, and records may be billed or relied on
          in the meantime.
      - id: d
        text: Correcting the record and reporting the error to the supervisor
        isCorrect: true
        rationale: >-
          Integrity is about accuracy and honesty in records, including when the error is your
          own and inconvenient.
    explanation: >-
      Service records are used for funding, for clinical decisions and sometimes in legal
      proceedings. The cost of correcting one promptly is almost always smaller than the
      cost of having left it.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [ethics-code, session-note, self-reporting, supervision]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e2-social-media
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.2 }
    type: single-best-answer
    stem: >-
      A staff member posts an anonymised description of a difficult session on a public
      social media account. The main risk is:
    options:
      - id: a
        text: Identification remains possible from context, and the client did not agree to this
        isCorrect: true
        rationale: >-
          Details that seem anonymous often identify a person to anyone who knows them, and
          the client agreed to services rather than to publication.
      - id: b
        text: The post might attract critical comments from colleagues
        isCorrect: false
        rationale: >-
          Professional criticism is uncomfortable but is not the ethical problem here.
      - id: c
        text: The employer may not have a social media policy
        isCorrect: false
        rationale: >-
          The absence of a policy does not create the risk; disclosure does.
      - id: d
        text: The post may misrepresent behaviour analysis to the public
        isCorrect: false
        rationale: >-
          A real concern in general, but secondary to disclosing a client's information.
    explanation: >-
      Re-identification from context is the specific failure mode. A setting, an age, a
      behaviour and a date is frequently enough within a small community, and the
      disclosure cannot be withdrawn once made.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [confidentiality, public-statement, ethics-code, hipaa]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: hipaa-privacy-rule
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e2-credential-misrepresentation
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.2 }
    type: single-best-answer
    stem: >-
      An assistant analyst is introduced at a school meeting as "the behaviour analyst
      running the programme". The appropriate response is:
    options:
      - id: a
        text: Accept it, since the supervisor approved the programme
        isCorrect: false
        rationale: >-
          Supervisor approval of the programme does not transfer the analyst's role to you.
      - id: b
        text: Correct the description at the time and state who supervises the programme
        isCorrect: true
        rationale: >-
          Allowing a misdescription of your credential to stand misrepresents both your role
          and who is responsible.
      - id: c
        text: Say nothing, since the difference is unlikely to matter to the school
        isCorrect: false
        rationale: >-
          The difference determines who may make plan decisions, which matters a great deal to
          the school.
      - id: d
        text: Correct it privately with the head teacher afterwards
        isCorrect: false
        rationale: >-
          The people at the meeting will act on what they heard, so the correction belongs
          there.
    explanation: >-
      This is one of the most common real-world scope failures, and it usually happens by
      drift rather than by claim. Correcting it in the room also tells the school who to
      call when a decision is needed.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [scope-of-practice, scope-of-competence, supervision, public-statement]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e3-scope-boundary
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.3 }
    type: single-best-answer
    stem: >-
      A parent asks an assistant analyst whether their child's medication should be
      changed now that behaviour has improved. The appropriate response is:
    options:
      - id: a
        text: Ask the supervising analyst to answer the medical question instead
        isCorrect: false
        rationale: >-
          The question is outside the scope of the profession, not only of your role, so
          passing it up does not resolve it.
      - id: b
        text: Explain that this is outside your scope and direct them to the medical team
        isCorrect: true
        rationale: >-
          Medication decisions belong to the doctor managing them, and the boundary should be
          stated plainly rather than hedged.
      - id: c
        text: Share the behaviour data and let the parent draw their own conclusion
        isCorrect: false
        rationale: >-
          Handing over data in answer to a medical question is an implicit opinion on it.
      - id: d
        text: Offer a view, since you see the child more often than the doctor does
        isCorrect: false
        rationale: >-
          Frequency of contact does not confer competence in medicine.
    explanation: >-
      Knowing where competence ends is itself a competence. The data you hold is genuinely
      useful to the medical team, and the right route is sharing it with consent and
      through the supervising analyst, not answering the question.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [scope-of-competence, scope-of-practice, collaboration, informed-consent]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e3-when-to-ask
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.3 }
    type: single-best-answer
    stem: >-
      Which situation most clearly requires an assistant analyst to seek the supervisor's
      guidance before acting?
    options:
      - id: a
        text: A data sheet runs out of space
        isCorrect: false
        rationale: >-
          This is a logistical matter requiring no clinical decision.
      - id: b
        text: The written plan does not cover a behaviour that has begun occurring
        isCorrect: true
        rationale: >-
          Behaviour outside the plan requires a plan decision, which is the supervising
          analyst's to make.
      - id: c
        text: A learner is slower than expected on a mastered step
        isCorrect: false
        rationale: >-
          Ordinary variation within a running programme is handled as part of implementation
          and reported at the usual time.
      - id: d
        text: A parent asks how the session went
        isCorrect: false
        rationale: >-
          Reporting on a session as delivered is within an assistant analyst's role.
    explanation: >-
      The line falls at plan decisions. Implementing, measuring and reporting sit with the
      assistant analyst; deciding what the plan should be, including for behaviour it does
      not address, does not.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [scope-of-practice, supervision, behavior-intervention-plan, function-of-behavior]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e3-competence-gap
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.3 }
    type: single-best-answer
    stem: >-
      An assistant analyst is asked to take on a case involving a population they have
      never worked with. The ethically sound course is to:
    options:
      - id: a
        text: Decline outright, since the competence is absent today
        isCorrect: false
        rationale: >-
          Declining is defensible but not required; competence is built this way routinely.
      - id: b
        text: Accept, since behavioural principles apply across populations
        isCorrect: false
        rationale: >-
          Principles generalise; the specific knowledge, risks and cultural context do not.
      - id: c
        text: Accept and consult colleagues informally as questions arise
        isCorrect: false
        rationale: >-
          Informal consultation is not a substitute for supervision and a structured plan to
          acquire the competence.
      - id: d
        text: Accept only with supervision, training and a plan to build the competence
        isCorrect: true
        rationale: >-
          Competence can be developed, and the code contemplates doing so with supervision and
          study rather than refusing outright or pretending.
    explanation: >-
      Scope of competence is a boundary that moves with training, not a fixed list. What
      makes the move legitimate is that it is planned and supervised before the work
      starts rather than improvised during it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [scope-of-competence, supervision, continuing-education-unit, evidence-based-practice]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e4-development-choice
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.4 }
    type: single-best-answer
    stem: >-
      Which professional development activity is most likely to genuinely extend an
      assistant analyst's competence in a new area?
    options:
      - id: a
        text: Completing an online module and its quiz
        isCorrect: false
        rationale: >-
          A quiz tests recall of the module, not performance with a learner.
      - id: b
        text: A supervised practicum with feedback on performance in that area
        isCorrect: true
        rationale: >-
          Competence is performance, and performance changes through practice with feedback
          rather than through exposure alone.
      - id: c
        text: Attending a conference session on the topic
        isCorrect: false
        rationale: >-
          Useful for awareness, but listening rarely changes what someone can do.
      - id: d
        text: Reading the major textbook chapters on the topic
        isCorrect: false
        rationale: >-
          Reading builds knowledge and is a reasonable first step, but it is not practice.
    explanation: >-
      The unit requirement and the competence requirement are different things. Units can
      be earned by listening; competence is demonstrated by doing, which is why
      competency-based training is the standard for teaching procedures.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        behavioral-skills-training,
        competency-assessment,
        performance-feedback,
        continuing-education-unit
      ]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e4-mentorship
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.4 }
    type: single-best-answer
    stem: >-
      An assistant analyst wants to build skill in an area their supervisor does not
      practise. The most appropriate step is:
    options:
      - id: a
        text: Arrange consultation or mentorship with someone competent in that area, with the supervisor's knowledge
        isCorrect: true
        rationale: >-
          Seeking expertise elsewhere is appropriate, and doing it openly keeps the
          supervisory relationship and responsibility intact.
      - id: b
        text: Change supervisors immediately
        isCorrect: false
        rationale: >-
          A supervisor need not be expert in everything, and changing supervision carries
          costs of its own.
      - id: c
        text: Learn independently and begin applying it to cases
        isCorrect: false
        rationale: >-
          Applying an unpractised skill to a case without oversight is the situation the code
          is designed to prevent.
      - id: d
        text: Wait until the supervisor develops the skill
        isCorrect: false
        rationale: >-
          Development need not be sequential, and waiting serves nobody.
    explanation: >-
      Supervision is a relationship, not a monopoly on learning. What matters is that the
      supervisor knows what you are learning and applying, because they remain responsible
      for your work.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [supervision, scope-of-competence, collaboration]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: bacb-supervision-curriculum-2
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e5-confidential-storage
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.5 }
    type: single-best-answer
    stem: >-
      Which practice best protects confidential information during a home-based session?
    options:
      - id: a
        text: Storing session notes in a personal phone's notes application
        isCorrect: false
        rationale: >-
          A personal device outside the organisation's control is not an appropriate store for
          client information.
      - id: b
        text: Leaving materials in a locked car between sessions
        isCorrect: false
        rationale: >-
          A locked vehicle is not secure storage, and this is a common source of real
          breaches.
      - id: c
        text: Carrying only the data needed for that session, identified by code rather than name
        isCorrect: true
        rationale: >-
          Minimising what is carried and removing identifiers limits the harm if materials are
          lost or seen.
      - id: d
        text: Carrying the full file so all information is available if needed
        isCorrect: false
        rationale: >-
          Carrying everything maximises exposure for a benefit that is rarely realised.
    explanation: >-
      Data minimisation is the most reliable protection available to a practitioner
      working across settings, because it reduces the consequence of the failures that
      actually happen: loss, theft and an unintended reader.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [confidentiality, hipaa, session-note, data-sheet]
    citations:
      - sourceId: hipaa-privacy-rule
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e5-disclosure-required
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.5 }
    type: single-best-answer
    stem: >-
      An assistant analyst forms a reasonable suspicion that a child is being abused.
      Their obligation is to:
    options:
      - id: a
        text: Raise it with the family first to check the facts
        isCorrect: false
        rationale: >-
          Raising it with the family may place the child at further risk and is not required
          before reporting.
      - id: b
        text: Report it as a mandated reporter, according to jurisdiction, without waiting for proof
        isCorrect: true
        rationale: >-
          The standard is reasonable suspicion, and the duty belongs to the individual who
          holds it.
      - id: c
        text: Investigate further until the suspicion is confirmed or resolved
        isCorrect: false
        rationale: >-
          Investigating is not the reporter's role and can delay a report and compromise an
          inquiry.
      - id: d
        text: Report only if the supervising analyst agrees
        isCorrect: false
        rationale: >-
          A mandated reporter's duty is personal and cannot be delegated upwards.
    explanation: >-
      Confidentiality has limits that are set in law rather than by the profession, and
      this is the clearest of them. Telling the supervisor is still appropriate, but as a
      parallel step rather than a precondition.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [mandated-reporter, confidentiality, incident-report, ethics-code]
    citations:
      - sourceId: capta
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e5-record-release
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.5 }
    type: single-best-answer
    stem: >-
      A school requests a copy of a learner's behaviour data from the assistant analyst.
      Before anything is released, what is required?
    options:
      - id: a
        text: Confirmation that the school is involved in the child's education
        isCorrect: false
        rationale: >-
          Legitimate interest is not the same as authorisation to receive records.
      - id: b
        text: The supervising analyst's verbal agreement
        isCorrect: false
        rationale: >-
          The supervisor cannot consent on the family's behalf.
      - id: c
        text: Authorisation from the person with legal authority, and release through the proper channel
        isCorrect: true
        rationale: >-
          Release requires appropriate authorisation, and it should go through the
          organisation's process rather than directly from a practitioner.
      - id: d
        text: A written request from the school on headed paper
        isCorrect: false
        rationale: >-
          A request does not itself authorise release; consent from the right person does.
    explanation: >-
      Requests from other professionals feel routine and are a common route to an
      unauthorised disclosure. Sending it through the organisation's process also creates
      the record that the release was authorised.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [confidentiality, informed-consent, hipaa, collaboration]
    citations:
      - sourceId: hipaa-privacy-rule
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e6-client-transition
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.6 }
    type: single-best-answer
    stem: >-
      A learner is transferring to another provider. What most protects continuity of
      care?
    options:
      - id: a
        text: Sending the complete raw file without a summary
        isCorrect: false
        rationale: >-
          A raw file without interpretation is difficult to act on and discloses more than is
          needed.
      - id: b
        text: Waiting for the new provider to request specific information
        isCorrect: false
        rationale: >-
          A provider who does not know what exists cannot ask for it, and the gap falls on the
          learner.
      - id: c
        text: A written summary of goals, procedures and current data, released with authorisation
        isCorrect: true
        rationale: >-
          The receiving provider needs what was being done and where the learner had reached,
          and release requires authorisation.
      - id: d
        text: A verbal handover call between the two teams
        isCorrect: false
        rationale: >-
          Useful in addition, but a conversation leaves no record the new team can work from.
    explanation: >-
      Transitions are where progress is most often lost, and the loss is invisible because
      the new team simply starts from scratch. A summary with authorisation is a small
      piece of work against a real cost.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [continuity-of-care, confidentiality, informed-consent, session-note]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e6-supervisor-change
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.6 }
    type: single-best-answer
    stem: >-
      An assistant analyst's supervisor is leaving, and a new supervisor will take over.
      The assistant analyst should ensure that:
    options:
      - id: a
        text: The new supervisor re-writes each behaviour plan
        isCorrect: false
        rationale: >-
          Plans are reviewed on their merits; a change of supervisor does not require
          rewriting them.
      - id: b
        text: Families are not informed until the new supervisor has settled in
        isCorrect: false
        rationale: >-
          Families are entitled to know who is responsible for their child's programme.
      - id: c
        text: Supervision arrangements are documented and unbroken before the change takes effect
        isCorrect: true
        rationale: >-
          Practice depends on supervision being in place, so a gap is a practice problem as
          well as an administrative one.
      - id: d
        text: They continue as before, since the cases are unchanged
        isCorrect: false
        rationale: >-
          Continuing without confirmed supervision leaves the work unsupervised, whatever the
          caseload looks like.
    explanation: >-
      A supervision gap is easy to fall into because nothing visibly changes on the day.
      It is also one of the things certificants are required to self-report, which makes
      documenting the handover directly relevant.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [supervision, continuity-of-care, self-reporting, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: bacb-bcba-handbook-2026
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e7-multiple-relationship
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.7 }
    type: single-best-answer
    stem: >-
      An assistant analyst is asked to provide services to the child of a close friend.
      The best initial step is:
    options:
      - id: a
        text: Decline and help the family find another provider
        isCorrect: true
        rationale: >-
          A close pre-existing relationship compromises objectivity in ways that are difficult
          to manage, so avoidance is preferred to mitigation.
      - id: b
        text: Accept, and be careful to keep the relationship separate
        isCorrect: false
        rationale: >-
          Intending to keep roles separate does not remove the conflict, and it is exactly the
          reasoning that precedes most failures here.
      - id: c
        text: Accept if the family signs an acknowledgement of the dual role
        isCorrect: false
        rationale: >-
          Consent does not repair the risk to the practitioner's objectivity.
      - id: d
        text: Accept with the supervisor observing sessions
        isCorrect: false
        rationale: >-
          Observation improves oversight but does not address the underlying conflict.
    explanation: >-
      The code prefers avoidance where a multiple relationship can be avoided, and
      mitigation only where it cannot. In rural or small communities avoidance is
      sometimes impossible, which is when documented mitigation becomes the answer.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [dual-relationship, conflict-of-interest, ethics-code, supervision]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e7-unavoidable
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.7 }
    type: single-best-answer
    stem: >-
      In a small rural community, an assistant analyst's only local colleague is also
      their neighbour and their child's coach. Given that the overlap is unavoidable, the
      appropriate response is:
    options:
      - id: a
        text: Document the overlap, define boundaries in advance, and review it in supervision
        isCorrect: true
        rationale: >-
          Where a multiple relationship cannot be avoided, the response is explicit boundaries
          and oversight rather than silence.
      - id: b
        text: Proceed normally, since the overlap is common in rural areas
        isCorrect: false
        rationale: >-
          Commonness does not reduce the risk, and treating it as unremarkable is how
          boundaries erode.
      - id: c
        text: Refuse all professional contact with that colleague
        isCorrect: false
        rationale: >-
          Refusing necessary professional contact would harm the service without addressing
          the risk.
      - id: d
        text: Disclose the overlap to every family on the caseload
        isCorrect: false
        rationale: >-
          Broad disclosure is not required and creates its own confidentiality problems.
    explanation: >-
      Rural and small-community practice is where this standard does real work. The
      requirement is not purity but visibility: an overlap that is named, bounded and
      reviewed is manageable in a way that an unexamined one is not.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [dual-relationship, conflict-of-interest, supervision, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e7-gifts
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.7 }
    type: single-best-answer
    stem: >-
      A family offers an assistant analyst a substantial gift at the end of a successful
      programme. The main ethical consideration is:
    options:
      - id: a
        text: Whether the employer permits gifts
        isCorrect: false
        rationale: >-
          Employer policy matters practically, but the ethical question stands independently
          of it.
      - id: b
        text: Whether refusing would offend the family
        isCorrect: false
        rationale: >-
          Cultural context is worth weighing, but it does not settle whether a conflict is
          created.
      - id: c
        text: Whether accepting it creates an obligation that could affect future judgement
        isCorrect: true
        rationale: >-
          The risk is that the relationship acquires a second dimension that influences
          professional decisions.
      - id: d
        text: Whether the gift is affordable for the family
        isCorrect: false
        rationale: >-
          Affordability is a kindness consideration, not the professional risk.
    explanation: >-
      Small tokens are usually unremarkable; substantial gifts create an obligation
      whether or not anyone intends one. Where refusal would cause offence in a particular
      cultural context, that is a supervision conversation rather than a reason to accept
      quietly.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [conflict-of-interest, dual-relationship, cultural-responsiveness, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e8-receiving-feedback
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.8 }
    type: single-best-answer
    stem: >-
      A supervisor gives corrective feedback on an assistant analyst's prompting during a
      session. The most professionally useful response is:
    options:
      - id: a
        text: Ask for specifics, restate what will change, and try it in the next session
        isCorrect: true
        rationale: >-
          Feedback is only useful once it is specific enough to act on and is actually
          applied.
      - id: b
        text: Explain the reasons the session went the way it did
        isCorrect: false
        rationale: >-
          Context can be relevant, but leading with explanation tends to close the
          conversation rather than use it.
      - id: c
        text: Accept it without comment to avoid appearing defensive
        isCorrect: false
        rationale: >-
          Silent acceptance often means the feedback was not understood well enough to apply.
      - id: d
        text: Request that feedback be given in writing in future
        isCorrect: false
        rationale: >-
          Written feedback has its uses but delays the change and removes the chance to
          clarify.
    explanation: >-
      Accepting feedback is a skill with observable components, and it is one of the
      strongest predictors of how quickly a practitioner improves. The test is whether
      next session looks different.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [performance-feedback, supervision, behavioral-skills-training, collaboration]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e8-collaboration-conflict
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.8 }
    type: single-best-answer
    stem: >-
      A speech therapist and an assistant analyst disagree about how to prompt requesting.
      The most constructive first step is:
    options:
      - id: a
        text: Defer to the speech therapist on anything involving communication
        isCorrect: false
        rationale: >-
          Automatic deference avoids the disagreement rather than resolving it, and may not
          serve the learner.
      - id: b
        text: Continue with the behaviour plan as written and document the disagreement
        isCorrect: false
        rationale: >-
          Documenting is necessary but proceeding without engaging leaves the learner
          receiving inconsistent approaches.
      - id: c
        text: Ask the family to choose between the two approaches
        isCorrect: false
        rationale: >-
          Asking a family to arbitrate between professionals places an unfair burden on them.
      - id: d
        text: Meet, state each rationale, and agree how the learner's data will settle it
        isCorrect: true
        rationale: >-
          Making the disagreement explicit and letting the learner's data decide keeps both
          professions honest and keeps the learner central.
    explanation: >-
      Inconsistent prompting across professionals is a real cost to a learner, so the
      disagreement is worth the meeting. Agreeing in advance what data would settle it is
      what stops the discussion becoming a contest of opinion.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [collaboration, evidence-based-practice, social-validity, supervision]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e9-cultural-humility
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.9 }
    type: single-best-answer
    stem: >-
      Which practice best reflects cultural humility rather than cultural knowledge alone?
    options:
      - id: a
        text: Applying a standard programme equally to every family
        isCorrect: false
        rationale: >-
          Equal treatment regardless of context is the position humility is meant to correct.
      - id: b
        text: Matching the practitioner to the family's background where possible
        isCorrect: false
        rationale: >-
          Shared background does not guarantee shared values, and this cannot be the general
          approach.
      - id: c
        text: Asking the family how a goal fits their household, and revising it on what they say
        isCorrect: true
        rationale: >-
          Humility treats the family as the authority on their own context and lets their
          answer change the plan.
      - id: d
        text: Reading about the family's culture before the first meeting
        isCorrect: false
        rationale: >-
          Preparation is useful, but knowledge about a group does not tell you about this
          family.
    explanation: >-
      The distinction is between knowing about a culture and remaining open to being
      corrected about this family. The second is a practice rather than a body of
      knowledge, which is why it has to show up in what changes after you ask.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [cultural-humility, cultural-responsiveness, social-validity, collaboration]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e9-assumption-check
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.9 }
    type: single-best-answer
    stem: >-
      An assistant analyst assumes a family is uninterested in a programme because they
      decline evening sessions. A culturally humble response is to:
    options:
      - id: a
        text: Record the family as non-adherent in the file
        isCorrect: false
        rationale: >-
          Labelling the family on the basis of an untested inference is both inaccurate and
          consequential.
      - id: b
        text: Escalate to the supervisor as a compliance concern
        isCorrect: false
        rationale: >-
          Framing a scheduling constraint as compliance misstates the situation to the person
          who will act on it.
      - id: c
        text: Ask what times and arrangements would work, and why evenings do not
        isCorrect: true
        rationale: >-
          The assumption is tested by asking, which frequently reveals a constraint rather
          than a preference about the programme.
      - id: d
        text: Reduce the programme's intensity to match the apparent interest
        isCorrect: false
        rationale: >-
          This acts on the untested assumption and reduces service for a reason that may not
          exist.
    explanation: >-
      Attributing a scheduling constraint to attitude is one of the most consequential
      everyday errors, because it changes how a family is described in the record and how
      they are treated afterwards.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [cultural-humility, cultural-responsiveness, collaboration, social-validity]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e10-responsive-goals
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.10 }
    type: single-best-answer
    stem: >-
      Which goal-setting practice is most culturally responsive?
    options:
      - id: a
        text: Selecting goals with the family from what matters in their daily life
        isCorrect: true
        rationale: >-
          Responsiveness shows in whose priorities the goals reflect, which is settled at goal
          selection.
      - id: b
        text: Selecting goals from a standard curriculum sequence
        isCorrect: false
        rationale: >-
          A curriculum reflects general developmental assumptions rather than this family's
          context.
      - id: c
        text: Selecting goals that match the learner's assessment scores most closely
        isCorrect: false
        rationale: >-
          Assessment identifies candidates; it does not determine which of them matter to the
          family.
      - id: d
        text: Selecting goals the funder is most likely to authorise
        isCorrect: false
        rationale: >-
          Funding is a real constraint but is not a basis for deciding what matters.
    explanation: >-
      Social validity is decided at goal selection more than anywhere else. A technically
      excellent programme aimed at something the family does not value will be abandoned,
      and that outcome is usually recorded as the family's failure.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [social-validity, cultural-responsiveness, collaboration, behavioral-cusp]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e10-inclusive-supervision
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.10 }
    type: single-best-answer
    stem: >-
      A supervisor notices that two supervisees receive most of the observation time and
      the more complex cases, while three others do not. Making supervision more inclusive
      requires:
    options:
      - id: a
        text: Asking the three supervisees whether they feel excluded
        isCorrect: false
        rationale: >-
          Their perception is worth knowing, but the allocation itself is the observable
          issue.
      - id: b
        text: Providing the same written materials to all five
        isCorrect: false
        rationale: >-
          Equal materials do not address unequal access to observation and experience.
      - id: c
        text: Rotating supervision meetings between the five
        isCorrect: false
        rationale: >-
          Meeting time is only part of it; case allocation and observation are where the
          difference shows.
      - id: d
        text: Examining how opportunities are allocated and distributing them deliberately
        isCorrect: true
        rationale: >-
          Unequal allocation of observation and case complexity is a supervision practice that
          can be measured and changed.
    explanation: >-
      Equity in supervision is a distribution question, and distributions can be counted.
      Who gets observed, who gets the interesting case, and who gets covered when
      short-staffed are the measures that matter.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [supervision, cultural-responsiveness, performance-feedback, competency-assessment]
    citations:
      - sourceId: bacb-supervision-curriculum-2
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e11-licensure
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.11 }
    type: single-best-answer
    stem: >-
      An assistant analyst moves to a jurisdiction that licenses behaviour analysts. Their
      certification:
    options:
      - id: a
        text: Transfers automatically after a notification period
        isCorrect: false
        rationale: >-
          There is no general automatic transfer; requirements vary by jurisdiction.
      - id: b
        text: Does not by itself authorise practice; the jurisdiction's licensing law governs
        isCorrect: true
        rationale: >-
          Certification and licensure are separate, and practising without a required licence
          is unlawful regardless of certification.
      - id: c
        text: Is sufficient, since certification is national in scope
        isCorrect: false
        rationale: >-
          A national certification does not override a jurisdiction's own licensing
          requirement.
      - id: d
        text: Is sufficient if their supervisor holds the local licence
        isCorrect: false
        rationale: >-
          A supervisor's licence does not extend to the supervisee's own requirement to be
          licensed where one applies.
    explanation: >-
      This catches people who relocate mid-caseload, including those working remotely
      across a boundary. The requirement attaches to where the client is, which is the
      part most often missed.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [scope-of-practice, self-reporting, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: bacb-bcba-handbook-2026
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-e11-funder-requirements
    credential: BCaBA
    taskRef: { credential: BCaBA, code: E.11 }
    type: single-best-answer
    stem: >-
      A funder requires a specific service-note format that omits information the clinical
      record needs. The appropriate response is:
    options:
      - id: a
        text: Use the funder's format alone, since it is what is required
        isCorrect: false
        rationale: >-
          A funder format does not discharge the obligation to keep an adequate clinical
          record.
      - id: b
        text: Use the clinical format alone and submit it to the funder
        isCorrect: false
        rationale: >-
          Submitting a non-compliant note risks the claim and may disclose more than the
          funder needs.
      - id: c
        text: Ask the funder to change the format
        isCorrect: false
        rationale: >-
          Worth raising eventually, but it does not answer what to do for today's session.
      - id: d
        text: Meet the funder's format and keep the clinical detail in the record as well
        isCorrect: true
        rationale: >-
          The two requirements are not in conflict; the funder sets a billing format, and the
          clinical record remains the practitioner's responsibility.
    explanation: >-
      Regulatory, funding and clinical requirements sit on top of one another rather than
      replacing one another. Treating a funder's minimum as the ceiling is how records
      become unusable for the purpose they exist for.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [session-note, scope-of-practice, confidentiality, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
