  - id: bcaba-h5-contrast
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.5 }
    type: single-best-answer
    stem: >-
      A behavior is reduced successfully in one classroom and increases in another where
      nothing changed. This pattern is:
    options:
      - id: a
        text: Stimulus generalization
        isCorrect: false
        rationale: >-
          Generalization would mean the reduction spread to the second setting, not the
          opposite.
      - id: b
        text: Resurgence
        isCorrect: false
        rationale: >-
          Resurgence follows the failure of a more recently reinforced alternative.
      - id: c
        text: An extinction burst
        isCorrect: false
        rationale: >-
          A burst occurs within the condition where reinforcement was withheld.
      - id: d
        text: Behavioral contrast
        isCorrect: true
        rationale: >-
          A change in responding in one condition following a change in the contingencies of
          another is contrast.
    explanation: >-
      Contrast is a reason to plan across settings rather than one at a time. A reduction
      that simply moves the behavior somewhere else is not a result the learner benefits
      from.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [behavioral-contrast, extinction, generalization, stimulus-control]
    citations:
      - sourceId: reynolds-1961
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h6-integrity-first
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.6 }
    type: single-best-answer
    stem: >-
      Data show no progress after three weeks. Before concluding the procedure is
      ineffective, the team should first check:
    options:
      - id: a
        text: Whether a different procedure would work better
        isCorrect: false
        rationale: >-
          Changing procedures before checking integrity risks discarding one that was never
          run.
      - id: b
        text: Whether the procedure has been delivered as written
        isCorrect: true
        rationale: >-
          A procedure that was not run cannot be evaluated, and low integrity is the most
          common explanation for flat data.
      - id: c
        text: Whether the goal was set too high
        isCorrect: false
        rationale: >-
          Worth reviewing, but it does not explain an absence of any movement.
      - id: d
        text: Whether the learner's preferences have changed
        isCorrect: false
        rationale: >-
          Relevant, and still second to whether the procedure was actually delivered.
    explanation: >-
      Integrity is checked first because it is both the most likely cause and the cheapest
      to establish. Abandoning procedures that were never delivered is how a service
      cycles through everything and settles on nothing.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [treatment-integrity, treatment-drift, performance-feedback, visual-analysis]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h6-integrity-measure
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.6 }
    type: single-best-answer
    stem: >-
      What is the most direct way to measure procedural integrity?
    options:
      - id: a
        text: Review the learner's outcome data
        isCorrect: false
        rationale: >-
          Outcome data conflate integrity with effectiveness, which is the confusion to
          avoid.
      - id: b
        text: Check that staff attended the training
        isCorrect: false
        rationale: >-
          Attendance predicts performance poorly, which is why competency-based training
          exists.
      - id: c
        text: Observe sessions against a checklist of the procedure's steps
        isCorrect: true
        rationale: >-
          Direct observation scored against the written steps measures what was actually done.
      - id: d
        text: Ask staff whether they followed the plan
        isCorrect: false
        rationale: >-
          Self-report is a weak measure of performance, and not because staff are dishonest.
    explanation: >-
      Integrity is a measure of staff behavior, and staff behavior is measured the same
      way any behavior is. A step checklist also doubles as the feedback tool, which is
      why it is worth writing carefully.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        treatment-integrity,
        performance-feedback,
        behavioral-skills-training,
        competency-assessment
      ]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h6-drift
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.6 }
    type: single-best-answer
    stem: >-
      Staff ran a procedure accurately at first, but six weeks later several steps have
      quietly changed. This is:
    options:
      - id: a
        text: Poor initial training
        isCorrect: false
        rationale: >-
          Initial performance was accurate, so training established the skill.
      - id: b
        text: A failure of the procedure
        isCorrect: false
        rationale: >-
          The procedure is no longer being run as written, so it has not been tested.
      - id: c
        text: Observer drift
        isCorrect: false
        rationale: >-
          Observer drift concerns how data are recorded, not how the procedure is delivered.
      - id: d
        text: Treatment drift
        isCorrect: true
        rationale: >-
          Gradual departure from the written procedure over time is drift.
    explanation: >-
      Drift is normal and predictable rather than a staff failing. Periodic integrity
      checks and feedback are what hold a procedure in place; without them, drift is the
      default.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [treatment-drift, treatment-integrity, performance-feedback, observer-drift]
    citations:
      - sourceId: parsons-rollyson-reid-2012
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h6-progress-and-integrity
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.6 }
    type: single-best-answer
    stem: >-
      Why must progress and procedural integrity be tracked separately?
    options:
      - id: a
        text: >-
          Flat data mean something different depending on whether the procedure was
          delivered
        isCorrect: true
        rationale: >-
          With integrity high, flat data indict the procedure; with integrity low, they indict
          implementation.
      - id: b
        text: Funders require two separate reports
        isCorrect: false
        rationale: >-
          Reporting requirements are not the reason.
      - id: c
        text: Integrity data are collected by a different person
        isCorrect: false
        rationale: >-
          Who collects it is a logistical matter.
      - id: d
        text: Progress data are more reliable than integrity data
        isCorrect: false
        rationale: >-
          Neither is inherently more reliable; they answer different questions.
    explanation: >-
      These two measures together are what let a team make a defensible decision. Either
      one alone supports a confident conclusion that may be pointing at the wrong thing.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [treatment-integrity, visual-analysis, trend, performance-feedback]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h7-data-decision
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.7 }
    type: single-best-answer
    stem: >-
      Four weeks of intervention data show a flat line at the baseline level, with
      integrity confirmed at 95%. The appropriate decision is:
    options:
      - id: a
        text: Continue for another four weeks
        isCorrect: false
        rationale: >-
          Continuing an intervention with no effect and confirmed integrity costs the learner
          a month.
      - id: b
        text: Lower the goal so progress can be recorded
        isCorrect: false
        rationale: >-
          Changing the target to fit the data misrepresents the outcome.
      - id: c
        text: Add a second procedure alongside the first
        isCorrect: false
        rationale: >-
          Adding without removing accumulates untested components and makes the next decision
          harder.
      - id: d
        text: Modify or replace the procedure, and say what the change is intended to test
        isCorrect: true
        rationale: >-
          With integrity established, the procedure itself is what the data indict.
    explanation: >-
      Making the change explicit — what is being altered and what would count as it
      working — is what keeps a sequence of adjustments from becoming an untraceable
      drift.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [visual-analysis, treatment-integrity, level, behavior-intervention-plan]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h7-premature-change
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.7 }
    type: single-best-answer
    stem: >-
      A team changes a procedure after three sessions because the data have not yet moved.
      The main risk is:
    options:
      - id: a
        text: Violating the treatment integrity requirement
        isCorrect: false
        rationale: >-
          Changing a procedure by decision is not an integrity failure, though it does end the
          test.
      - id: b
        text: Losing interobserver agreement
        isCorrect: false
        rationale: >-
          Agreement is unaffected by a change of procedure.
      - id: c
        text: Reducing the learner's assent to the program
        isCorrect: false
        rationale: >-
          Possible in principle, but not the main risk in this decision.
      - id: d
        text: Abandoning an effective procedure before its effect could appear
        isCorrect: true
        rationale: >-
          Three sessions is rarely enough to distinguish no effect from an effect not yet
          visible.
    explanation: >-
      Deciding in advance how long a procedure gets, and what would count as a change,
      protects against both the premature switch and the opposite failure of running
      something ineffective for a term.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [visual-analysis, trend, variability, baseline]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h7-scope-modification
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.7 }
    type: single-best-answer
    stem: >-
      The data clearly support modifying a procedure. An assistant analyst's role at this
      point is to:
    options:
      - id: a
        text: Present the data and a recommendation to the supervising analyst, who decides
        isCorrect: true
        rationale: >-
          Interpreting data and recommending is within the role; changing the plan is not.
      - id: b
        text: Implement the modification and document it
        isCorrect: false
        rationale: >-
          Implementing a plan change without authorization is outside scope, however well
          supported.
      - id: c
        text: Wait for the supervisor to notice the pattern
        isCorrect: false
        rationale: >-
          Withholding a clear finding delays a decision the learner needs.
      - id: d
        text: Discuss the modification with the family first
        isCorrect: false
        rationale: >-
          The family is part of the decision, but it should not be put to them before the
          supervising analyst has seen it.
    explanation: >-
      This boundary is a recurring theme of the assistant credential: the data work and
      the recommendation belong to you, and the plan decision belongs to the analyst
      responsible for it.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [scope-of-practice, supervision, behavior-intervention-plan, visual-analysis]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h8-collaboration-value
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.8 }
    type: single-best-answer
    stem: >-
      Why is including a classroom teacher in plan discussions more than a courtesy?
    options:
      - id: a
        text: It transfers responsibility for outcomes to the school
        isCorrect: false
        rationale: >-
          Collaboration does not move clinical responsibility, and framing it that way would
          be wrong.
      - id: b
        text: They will run the plan in the setting, and their constraints determine whether it works
        isCorrect: true
        rationale: >-
          The person delivering the procedure holds the information that decides its
          feasibility.
      - id: c
        text: It satisfies the requirement for consent
        isCorrect: false
        rationale: >-
          Consent comes from the person with legal authority, not from the teacher.
      - id: d
        text: It allows the plan to be shortened
        isCorrect: false
        rationale: >-
          Length is not the issue collaboration addresses.
    explanation: >-
      A plan written without the person who will run it is a plan written for a setting
      that does not exist. Their constraints are data about feasibility, not obstacles to
      be managed.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [collaboration, treatment-integrity, ecological-assessment, social-validity]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h8-including-family
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.8 }
    type: single-best-answer
    stem: >-
      Which practice best reflects including a family rather than informing them?
    options:
      - id: a
        text: Sending a written summary of the plan before it begins
        isCorrect: false
        rationale: >-
          A summary informs; it does not give the family a part in the decision.
      - id: b
        text: Inviting the family to observe a session
        isCorrect: false
        rationale: >-
          Observation is valuable and still not participation in the decision.
      - id: c
        text: Asking the family to sign the plan document
        isCorrect: false
        rationale: >-
          A signature records agreement to a decision already made.
      - id: d
        text: Bringing options with trade-offs and deciding together what fits their week
        isCorrect: true
        rationale: >-
          Inclusion means the family's input can change the decision, not just receive it.
    explanation: >-
      The test is whether anything in the plan would have been different if the family had
      answered differently. If not, they were informed rather than included.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [collaboration, social-validity, cultural-humility, informed-consent]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h8-consistency
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.8 }
    type: single-best-answer
    stem: >-
      A learner receives support from a teaching assistant, a speech therapist and a
      behavior team, each using different prompting. The most likely consequence is:
    options:
      - id: a
        text: Faster generalization, because the learner meets more variation
        isCorrect: false
        rationale: >-
          Unplanned inconsistency in the teaching procedure is not the same as planned
          variation in stimuli.
      - id: b
        text: No effect, since each professional works on different goals
        isCorrect: false
        rationale: >-
          They are prompting the same learner on overlapping skills, so the procedures
          interact.
      - id: c
        text: Improved assent, because the learner has more choice
        isCorrect: false
        rationale: >-
          Inconsistency between adults is not learner choice.
      - id: d
        text: Slower acquisition, because the prompting the learner contacts is inconsistent
        isCorrect: true
        rationale: >-
          Inconsistent prompting and fading make transfer of stimulus control slower and less
          reliable.
    explanation: >-
      Coordinating prompting across a team is unglamorous and is often the highest-yield
      thing available. It requires someone to convene the conversation, which is
      frequently the assistant analyst.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [prompt-hierarchy, transfer-of-stimulus-control, collaboration, treatment-integrity]
    citations:
      - sourceId: touchette-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
