# BCaBA practice questions — area H, Intervention Development and Monitoring. All original; nothing drawn from any examination. Task codes are the 6th-edition BCaBA codes.

questions:
  - id: bcaba-h1-measurable-goal
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.1 }
    type: single-best-answer
    stem: >-
      Which intervention goal is stated in observable and measurable terms?
    options:
      - id: a
        text: Independently puts on a coat within 60 seconds of the instruction, on 8 of 10 opportunities
        isCorrect: true
        rationale: >-
          It names the response, the condition, the timeframe and the criterion, so anyone
          could score it.
      - id: b
        text: Becomes more independent with dressing
        isCorrect: false
        rationale: >-
          Neither the response nor the criterion is specified, so progress cannot be scored.
      - id: c
        text: Improves self-help skills across the school day
        isCorrect: false
        rationale: >-
          This names a domain rather than a behavior and gives no criterion.
      - id: d
        text: Demonstrates increased confidence in dressing tasks
        isCorrect: false
        rationale: >-
          Confidence is an inference, not something two observers could score the same way.
    explanation: >-
      A goal has to survive being handed to someone who was not in the meeting. The test
      is whether a new staff member could score it correctly on their first day from the
      wording alone.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [operational-definition, objective-language, trials-to-criterion, task-analysis]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-16'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
      version: 1
      updated: '2026-09-16'
  - id: bcaba-h1-criterion-condition
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.1 }
    type: single-best-answer
    stem: >-
      A goal states "will request a break appropriately". What is most obviously missing?
    options:
      - id: a
        text: The date the goal was written
        isCorrect: false
        rationale: >-
          Useful administratively but not part of what makes the goal measurable.
      - id: b
        text: A definition of what counts as appropriate, and a performance criterion
        isCorrect: true
        rationale: >-
          "Appropriately" requires a judgment, and no criterion says how often or how well.
      - id: c
        text: The setting in which the goal applies
        isCorrect: false
        rationale: >-
          Setting is worth adding, but the undefined term and the missing criterion are the
          larger problems.
      - id: d
        text: The reinforcer that will be used
        isCorrect: false
        rationale: >-
          A goal states the target; the procedure states the reinforcer.
    explanation: >-
      Words like appropriately, consistently and independently are where measurable goals
      quietly stop being measurable. Each needs replacing with what the observer would
      actually see.
    cognitiveLevel: analysis
    difficulty: 2
    termRefs: [operational-definition, objective-language, mand, trials-to-criterion]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h1-baseline-in-goal
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.1 }
    type: single-best-answer
    stem: >-
      Why should a goal statement include the learner's current performance?
    options:
      - id: a
        text: It determines which reinforcer will be used
        isCorrect: false
        rationale: >-
          Reinforcer selection comes from preference and reinforcer assessment.
      - id: b
        text: It establishes the function of the behavior
        isCorrect: false
        rationale: >-
          Function comes from functional assessment, not from a performance level.
      - id: c
        text: Without it, the size and significance of the intended change cannot be judged
        isCorrect: true
        rationale: >-
          A target of eight out of ten means something very different from a baseline of seven
          than from a baseline of zero.
      - id: d
        text: It is required by every funder
        isCorrect: false
        rationale: >-
          Requirements vary, and the clinical reason stands regardless.
    explanation: >-
      Goals without a starting point are unreadable a year later, and they make it
      impossible to tell an ambitious goal from a goal that had already been met when it
      was written.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [baseline, operational-definition, level, trials-to-criterion]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h2-assessment-driven
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.2 }
    type: single-best-answer
    stem: >-
      A functional assessment indicates escape from demands. Which intervention component
      follows most directly from that finding?
    options:
      - id: a
        text: Teaching and honoring a break request, with demands adjusted
        isCorrect: true
        rationale: >-
          It gives the learner an efficient way to obtain the same consequence the behavior
          was producing.
      - id: b
        text: A token system for preferred items
        isCorrect: false
        rationale: >-
          Access to items does not address a consequence the behavior was producing through
          escape.
      - id: c
        text: Increased attention for periods without the behavior
        isCorrect: false
        rationale: >-
          Attention is not the maintaining consequence identified.
      - id: d
        text: Removing the preferred item following the behavior
        isCorrect: false
        rationale: >-
          A consequence unrelated to the identified function, and a restrictive one at that.
    explanation: >-
      Matching the intervention to the function is the single highest-yield decision in
      plan design. Function-mismatched procedures often appear to work briefly and then
      stop.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        function-of-behavior,
        functional-communication-training,
        negative-reinforcement,
        replacement-behavior
      ]
    citations:
      - sourceId: carr-durand-1985
        useType: fact-reference
      - sourceId: iwata-1982-1994
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h2-evidence-base
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.2 }
    type: single-best-answer
    stem: >-
      What does it mean to say a procedure is evidence-based for a particular use?
    options:
      - id: a
        text: It worked for a similar learner in the same service
        isCorrect: false
        rationale: >-
          A local anecdote is weaker still, though it may be worth investigating.
      - id: b
        text: Research supports it for that population and purpose, and it is judged against this learner's data
        isCorrect: true
        rationale: >-
          Evidence-based practice combines research support with individual data and the
          client's context, not research alone.
      - id: c
        text: It has been published in a peer-reviewed journal at least once
        isCorrect: false
        rationale: >-
          A single publication does not establish an evidence base.
      - id: d
        text: It is widely used in the field
        isCorrect: false
        rationale: >-
          Widespread use and evidence are not the same thing, and several common procedures
          are poorly supported.
    explanation: >-
      The definition has three parts for a reason. Research says a procedure is worth
      trying; the learner's own data say whether it is working; the family's context says
      whether it can be sustained.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [evidence-based-practice, social-validity, visual-analysis, treatment-integrity]
    citations:
      - sourceId: baer-wolf-risley-1968
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h2-scope-in-selection
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.2 }
    type: single-best-answer
    stem: >-
      An assistant analyst believes a different procedure would suit a learner better than
      the one in the plan. They should:
    options:
      - id: a
        text: Bring the reasoning and supporting data to the supervising analyst
        isCorrect: true
        rationale: >-
          Plan changes are the supervising analyst's decision, and data-supported proposals
          are exactly what an assistant analyst should bring.
      - id: b
        text: Trial the alternative for a week and compare the data
        isCorrect: false
        rationale: >-
          Running an unauthorized procedure is outside scope and contaminates the existing
          data.
      - id: c
        text: Continue with the plan and say nothing
        isCorrect: false
        rationale: >-
          Withholding a clinically relevant observation does not serve the learner.
      - id: d
        text: Ask the family which procedure they prefer
        isCorrect: false
        rationale: >-
          Asking the family to choose between procedures places a clinical decision on them
          and bypasses the supervisor.
    explanation: >-
      The assistant analyst is often the person who sees the problem first. The route is
      upward with evidence, not sideways into a trial — and a supervisor who receives that
      well is doing their job too.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [scope-of-practice, supervision, behavior-intervention-plan, treatment-integrity]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h2-package-vs-component
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.2 }
    type: single-best-answer
    stem: >-
      A plan lists six components introduced simultaneously. From an evaluation standpoint
      this means:
    options:
      - id: a
        text: The plan cannot be effective
        isCorrect: false
        rationale: >-
          Packages are frequently effective; the limitation is on what can be concluded.
      - id: b
        text: The plan violates the requirement for treatment integrity
        isCorrect: false
        rationale: >-
          Integrity concerns whether components are delivered as written, not how many there
          are.
      - id: c
        text: Any effect cannot be attributed to a particular component
        isCorrect: true
        rationale: >-
          Simultaneous introduction leaves each component untested individually.
      - id: d
        text: The plan is stronger because it addresses several variables
        isCorrect: false
        rationale: >-
          It may be more effective, and it is less informative, which is a real cost over
          time.
    explanation: >-
      Packages are sometimes the right clinical choice, particularly under time pressure.
      The cost is that the service accumulates components nobody can drop, because nobody
      knows which ones are working.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        behavior-intervention-plan,
        treatment-integrity,
        multielement-design,
        evidence-based-practice
      ]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h3-risk-weighing
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.3 }
    type: single-best-answer
    stem: >-
      Two procedures are expected to be similarly effective. One is more restrictive. The
      plan should:
    options:
      - id: a
        text: Let the family choose between them
        isCorrect: false
        rationale: >-
          Family input matters, but the clinician cannot delegate the restrictiveness
          judgment.
      - id: b
        text: Select the less restrictive procedure
        isCorrect: true
        rationale: >-
          Where effectiveness is comparable, the less restrictive option is required.
      - id: c
        text: Select the more restrictive procedure for faster results
        isCorrect: false
        rationale: >-
          Speed is not established here, and it would not justify greater restriction if it
          were.
      - id: d
        text: Alternate between them to compare
        isCorrect: false
        rationale: >-
          Exposing a learner to a more restrictive procedure to make a comparison that is not
          needed is not justified.
    explanation: >-
      The least restrictive alternative is a decision rule rather than a preference. It
      applies most strongly precisely when the options are close, because that is when the
      extra restriction buys nothing.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [least-restrictive-alternative, dignity, behavior-intervention-plan, ethics-code]
    citations:
      - sourceId: bacb-ethics-code-2022
        useType: fact-reference
      - sourceId: abai-restraint-position-2010
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h3-contextual-fit-plan
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.3 }
    type: single-best-answer
    stem: >-
      A plan is written for a household with three young children and one adult in the
      evenings. Which feature most threatens it?
    options:
      - id: a
        text: A component requiring five minutes of uninterrupted one-to-one attention every hour
        isCorrect: true
        rationale: >-
          The household cannot supply that, so the component will be dropped and the plan will
          appear to fail.
      - id: b
        text: A component using items the family already owns
        isCorrect: false
        rationale: >-
          Using existing materials improves fit rather than threatening it.
      - id: c
        text: A component embedded in an existing bedtime routine
        isCorrect: false
        rationale: >-
          Embedding in an existing routine is one of the strongest fit strategies.
      - id: d
        text: A component the older sibling can help with
        isCorrect: false
        rationale: >-
          Appropriately involving a sibling can improve feasibility, within reason.
    explanation: >-
      Plans are usually abandoned rather than refused, and the abandonment is invisible.
      Writing for the household that exists, rather than an idealized one, is what makes
      the data mean something.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [treatment-integrity, social-validity, ecological-assessment, cultural-responsiveness]
    citations:
      - sourceId: wolf-1978
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h3-preferences-in-plan
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.3 }
    type: single-best-answer
    stem: >-
      Incorporating a learner's preferences into a plan is valuable mainly because:
    options:
      - id: a
        text: It improves engagement and assent, which affects whether the plan runs at all
        isCorrect: true
        rationale: >-
          A plan built around what the learner values is more likely to be participated in
          rather than endured.
      - id: b
        text: It makes the plan easier to write
        isCorrect: false
        rationale: >-
          It usually makes the plan harder to write, not easier.
      - id: c
        text: It satisfies the requirement for informed consent
        isCorrect: false
        rationale: >-
          Consent is a separate process, generally with the guardian.
      - id: d
        text: It guarantees the procedure will be effective
        isCorrect: false
        rationale: >-
          No single feature guarantees effectiveness.
    explanation: >-
      Preference and assent are not softeners applied to a plan afterwards. They change
      the probability that the plan is ever actually delivered, which makes them technical
      considerations as much as ethical ones.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [assent, preference-assessment, social-validity, dignity]
    citations:
      - sourceId: hanley-2014
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h4-replacement-function
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.4 }
    type: single-best-answer
    stem: >-
      What is the most important property of a replacement behavior?
    options:
      - id: a
        text: It produces the same consequence as the behavior it replaces, at least as easily
        isCorrect: true
        rationale: >-
          If the replacement is harder or slower to the same outcome, the original behavior
          remains the better option for the learner.
      - id: b
        text: It is socially acceptable to staff and family
        isCorrect: false
        rationale: >-
          Acceptability matters, but a socially acceptable response that does not work will
          not be used.
      - id: c
        text: It is physically incompatible with the target behavior
        isCorrect: false
        rationale: >-
          Incompatibility is one useful option, not the defining property.
      - id: d
        text: It is already in the learner's repertoire
        isCorrect: false
        rationale: >-
          Convenient if so, but the replacement can be taught; function is what it must match.
    explanation: >-
      Response efficiency is the whole account. The learner will use whichever response
      gets the outcome with less effort, less delay and more reliability, and that is a
      comparison the plan has to win rather than assert.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        replacement-behavior,
        functional-communication-training,
        function-of-behavior,
        response-class
      ]
    citations:
      - sourceId: carr-durand-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h4-fct-honoring
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.4 }
    type: single-best-answer
    stem: >-
      A learner is taught to request a break instead of throwing materials. In the first
      weeks, requests should be:
    options:
      - id: a
        text: Honored on a variable schedule from the start
        isCorrect: false
        rationale: >-
          Thinning too early makes the new response unreliable and the old one competitive
          again.
      - id: b
        text: Honored only when the learner has completed some work
        isCorrect: false
        rationale: >-
          Adding a requirement immediately makes the request less efficient than the behavior
          it replaces.
      - id: c
        text: Honored only if the learner asks calmly
        isCorrect: false
        rationale: >-
          Adding a form requirement at the outset is a second contingency the learner has not
          been taught.
      - id: d
        text: Honored essentially every time they occur
        isCorrect: true
        rationale: >-
          A dense schedule early on establishes the new response as reliable and efficient.
    explanation: >-
      Thinning comes later, deliberately, and often through a signaled delay. Attaching
      conditions in week one is the most common way functional communication training
      fails.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        functional-communication-training,
        continuous-reinforcement,
        schedule-thinning,
        replacement-behavior
      ]
    citations:
      - sourceId: carr-durand-1985
        useType: fact-reference
      - sourceId: hagopian-1998
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h4-before-reduction
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.4 }
    type: single-best-answer
    stem: >-
      Why should a replacement behavior be identified before a reduction procedure is
      introduced?
    options:
      - id: a
        text: Because reduction procedures are prohibited without one
        isCorrect: false
        rationale: >-
          Not an absolute prohibition, though good practice and most policies require it.
      - id: b
        text: Because it makes data collection easier
        isCorrect: false
        rationale: >-
          Data collection is not the reason.
      - id: c
        text: Because funders require two goals per plan
        isCorrect: false
        rationale: >-
          Funding structure is not a clinical rationale.
      - id: d
        text: Otherwise the learner loses a way of producing an outcome and has no alternative
        isCorrect: true
        rationale: >-
          Reducing a behavior without a replacement removes access to something the learner
          needs without providing another route to it.
    explanation: >-
      This is the clinical core of a reduction plan. Removing a behavior that was working
      for the learner, with nothing in its place, predicts either its return or the
      emergence of something worse.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [replacement-behavior, function-of-behavior, least-restrictive-alternative, extinction]
    citations:
      - sourceId: carr-durand-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h4-efficiency
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.4 }
    type: single-best-answer
    stem: >-
      A taught replacement request is used at school but not at home, where the original
      behavior continues. The most likely reason is:
    options:
      - id: a
        text: The learner prefers the original behavior
        isCorrect: false
        rationale: >-
          Preference here is a restatement of the outcome rather than an explanation of it.
      - id: b
        text: At home the request is less efficient than the original behavior
        isCorrect: true
        rationale: >-
          If requests are slower, less reliable or more effortful at home, the original
          behavior remains the better option there.
      - id: c
        text: The learner has not generalized the response form
        isCorrect: false
        rationale: >-
          Possible, but the differential outcome across settings points to the consequences
          rather than the form.
      - id: d
        text: The home environment is less structured
        isCorrect: false
        rationale: >-
          Structure may contribute, but the analysis still comes back to what each response
          produces.
    explanation: >-
      When a replacement works in one setting and not another, look at what each response
      produces in each setting rather than at the learner. Usually requests are honored
      promptly in one place and not in the other.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [
        replacement-behavior,
        functional-communication-training,
        generalization,
        treatment-integrity
      ]
    citations:
      - sourceId: carr-durand-1985
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h5-extinction-risks
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.5 }
    type: single-best-answer
    stem: >-
      Which combination of effects should a plan using extinction anticipate?
    options:
      - id: a
        text: An increase in the alternative behavior only
        isCorrect: false
        rationale: >-
          An alternative will increase only if one has been taught and reinforced.
      - id: b
        text: A temporary increase in rate or intensity, and later reappearance after a pause
        isCorrect: true
        rationale: >-
          Extinction bursts and spontaneous recovery are both well documented and both need a
          planned response.
      - id: c
        text: An immediate and permanent reduction
        isCorrect: false
        rationale: >-
          Immediate permanent reduction is not what the literature describes.
      - id: d
        text: A gradual reduction with no side effects
        isCorrect: false
        rationale: >-
          Side effects including emotional responding are common.
    explanation: >-
      Planning for the burst and for recovery is what allows staff to hold the procedure
      at the two moments it is most likely to be abandoned — and abandoning it at either
      point reinforces a worse version of the behavior.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [extinction-burst, spontaneous-recovery, extinction, resurgence]
    citations:
      - sourceId: lerman-iwata-1996
        useType: fact-reference
      - sourceId: lerman-iwata-wallace-1999
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h5-resurgence
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.5 }
    type: single-best-answer
    stem: >-
      A previously reduced behavior reappears when the newly taught replacement stops
      producing reinforcement. This is best described as:
    options:
      - id: a
        text: An extinction burst
        isCorrect: false
        rationale: >-
          A burst is an intensification of the response being extinguished, early in the
          procedure.
      - id: b
        text: Behavioral contrast
        isCorrect: false
        rationale: >-
          Contrast is a change in one condition following a change in another.
      - id: c
        text: Resurgence
        isCorrect: true
        rationale: >-
          Resurgence is the return of a previously reinforced response when a more recently
          reinforced one is no longer effective.
      - id: d
        text: Spontaneous recovery
        isCorrect: false
        rationale: >-
          Spontaneous recovery follows a period without the behavior, not a failure of the
          alternative.
    explanation: >-
      Resurgence is why a replacement behavior has to keep working. A team that stops
      honoring requests when the schedule gets busy will see the original behavior
      return, and will usually attribute it to the learner.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [resurgence, extinction, functional-communication-training, replacement-behavior]
    citations:
      - sourceId: lerman-iwata-wallace-1999
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
  - id: bcaba-h5-reinforcement-side-effects
    credential: BCaBA
    taskRef: { credential: BCaBA, code: H.5 }
    type: single-best-answer
    stem: >-
      Which is a genuine unwanted effect that a reinforcement-based plan should
      anticipate?
    options:
      - id: a
        text: Suppression of all untargeted behavior
        isCorrect: false
        rationale: >-
          Reinforcement strengthens a target; it does not suppress everything else.
      - id: b
        text: Satiation reducing the reinforcer's effectiveness within a session
        isCorrect: true
        rationale: >-
          Repeated delivery of the same reinforcer reduces its value, which flattens
          responding mid-session.
      - id: c
        text: Permanent dependence on external reinforcement
        isCorrect: false
        rationale: >-
          This is a common worry rather than a documented inevitability, and thinning
          addresses it.
      - id: d
        text: Loss of the learner's existing skills
        isCorrect: false
        rationale: >-
          Reinforcing one behavior does not remove others from the repertoire.
    explanation: >-
      Satiation is the practical one, and it is easily managed by varying reinforcers and
      sampling preference at the start of a session. Naming the real risk matters more
      than repeating the folk one.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [satiation, preference-assessment, motivating-operation, schedule-thinning]
    citations:
      - sourceId: michael-1982
        useType: fact-reference
      - sourceId: deleon-iwata-1996
        useType: fact-reference
