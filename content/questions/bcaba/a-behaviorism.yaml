# BCaBA practice questions — area A, Behaviorism and Philosophical Foundations. All original; nothing drawn from any examination. Task codes are the 6th-edition BCaBA codes.

questions:
  - id: bcaba-a1-three-goals
    credential: BCaBA
    taskRef: { credential: BCaBA, code: A.1 }
    type: single-best-answer
    stem: >-
      A supervisor says the team has "done the science" on a learner's hand-flapping
      because they can now state when it is most likely to happen and how often. Which
      goal of a natural science of behaviour has the team NOT yet demonstrated?
    negated: true
    options:
      - id: a
        text: Control
        isCorrect: true
        rationale: >-
          Control means producing a change in the behaviour by changing the conditions it
          depends on. Knowing when it happens is not the same as being able to change it.
      - id: b
        text: Description
        isCorrect: false
        rationale: >-
          Description is already done: the team can say what the behaviour looks like and how
          often it occurs.
      - id: c
        text: Prediction
        isCorrect: false
        rationale: >-
          Prediction is already done: the team can state the conditions under which the
          behaviour is more and less likely.
      - id: d
        text: Replication
        isCorrect: false
        rationale: >-
          Replication is a method used to establish the goals, not one of the three goals a
          natural science of behaviour pursues.
    explanation: >-
      Description, prediction and control are the three goals, in that order of demands.
      Description says what happens; prediction says when it will happen again; control
      shows that changing one thing reliably changes the other. Stopping at prediction is
      common and is the point at which a correlation is often mistaken for a functional
      relation.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [functional-relation, applied-behavior-analysis]
    citations:
      - sourceId: skinner-1953
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary literature named in its citations; no
        examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-16'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
      tier: free
