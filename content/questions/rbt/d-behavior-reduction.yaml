  - id: rbt-d-timeout-authorised
    credential: RBT
    taskRef: { credential: RBT, code: D.5 }
    type: single-best-answer
    stem: >-
      A plan authorises a brief time-out from reinforcement following a specified
      behaviour. What does running it correctly most depend on?
    options:
      - id: a
        text: 'It being delivered inconsistently'
        isCorrect: false
        rationale: >-
          Inconsistent delivery weakens any consequence procedure and makes the
          resulting data uninterpretable.
      - id: b
        text: 'The learner agreeing that it is fair'
        isCorrect: false
        rationale: >-
          Agreement is not the operative variable, although assent and dignity are
          real considerations the plan should already have addressed.
      - id: c
        text: 'The environment the learner is removed from being reinforcing in the first place'
        isCorrect: true
        rationale: >-
          Time-out is time out from reinforcement. If the ongoing activity is not
          reinforcing, removal from it is not a punishment and may function as
          escape.
      - id: d
        text: 'The duration being as long as possible'
        isCorrect: false
        rationale: >-
          Longer is not better; plans specify brief durations, and extended
          removal raises restrictiveness without adding effect.
    explanation: >-
      Time-out only functions as intended where the setting being removed is
      reinforcing. Used with a learner whose behaviour is escape-maintained it can
      reinforce the very behaviour it targets, which is one reason it requires
      authorisation and specification in the written plan rather than technician
      judgement.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [
        time-out,
        negative-punishment,
        escape-extinction,
        least-restrictive-alternative,
        function-of-behavior
      ]
