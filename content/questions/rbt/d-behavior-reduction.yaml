  - id: rbt-d-dri-example
    credential: RBT
    taskRef: { credential: RBT, code: D.3 }
    type: single-best-answer
    stem: >-
      Which arrangement is an example of differential reinforcement of an incompatible
      behaviour?
    options:
      - id: a
        text: 'Reinforcing asking for a break to reduce hand-mouthing'
        isCorrect: false
        rationale: >-
          Asking for a break is an alternative but it can occur while
          hand-mouthing does, so it is DRA rather than DRI.
      - id: b
        text: 'Reinforcing fewer than three instances per session'
        isCorrect: false
        rationale: >-
          That is DRL, which reinforces a reduced rate rather than a competing
          response.
      - id: c
        text: 'Reinforcing hands resting on the desk to reduce hand-mouthing'
        isCorrect: true
        rationale: >-
          Hands on the desk and hands in the mouth cannot occur at the same time,
          which is what makes the alternative incompatible rather than merely
          different.
      - id: d
        text: 'Reinforcing any two minutes without hand-mouthing'
        isCorrect: false
        rationale: >-
          That is DRO: reinforcement follows the absence of the behaviour rather
          than a specified competing response.
    explanation: >-
      DRI is a special case of DRA where the reinforced response physically cannot
      co-occur with the problem behaviour. The distinction matters because
      incompatibility does some of the work automatically rather than relying on the
      alternative being more efficient.
    cognitiveLevel: recall
    difficulty: 2
    termRefs:
      [
        differential-reinforcement-of-incompatible-behavior,
        differential-reinforcement-of-alternative-behavior,
        differential-reinforcement-of-other-behavior,
        differential-reinforcement-of-low-rates
