  - id: rbt-d-dro-interval
    credential: RBT
    taskRef: { credential: RBT, code: D.3 }
    type: single-best-answer
    stem: >-
      A plan specifies DRO with a two-minute interval. The behaviour occurs 90 seconds
      into an interval. What does the procedure require?
    options:
      - id: a
        text: 'Deliver a smaller reinforcer'
        isCorrect: false
        rationale: >-
          Partial delivery is not part of the procedure and creates a contingency
          nobody designed.
      - id: b
        text: 'Deliver the reinforcer at the two-minute mark as planned'
        isCorrect: false
        rationale: >-
          DRO delivers only if the behaviour did not occur during the interval.
          Delivering anyway reinforces an interval containing the behaviour.
      - id: c
        text: 'Withhold the reinforcer and reset the interval as the plan specifies'
        isCorrect: true
        rationale: >-
          The defining feature of DRO is that reinforcement follows the absence of
          the behaviour for the whole interval. Occurrence means the interval does
          not earn.
      - id: d
        text: 'Shorten the interval to one minute permanently'
        isCorrect: false
        rationale: >-
          Changing the interval is a programme change. It may be the right
          adjustment, but the analyst makes it.
    explanation: >-
      DRO reinforces the omission of a behaviour across an interval. Whether a reset
      is momentary or whole-interval, and how long the interval is, are set by the
      written plan; running it as written is what makes the resulting data
      interpretable.
