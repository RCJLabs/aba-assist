  - id: rbt-d-ncr-mechanism
    credential: RBT
    taskRef: { credential: RBT, code: D.2 }
    type: single-best-answer
    stem: >-
      A plan delivers attention every 90 seconds regardless of what the learner is
      doing, and attention-maintained calling out decreases. What accounts for the
      decrease?
    options:
      - id: a
        text: 'The value of attention is reduced and it no longer depends on calling out'
        isCorrect: true
        rationale: >-
          Free and frequent access both weakens the motivating operation for
          attention and breaks the contingency between calling out and getting it.
      - id: b
        text: 'Calling out is being punished'
        isCorrect: false
        rationale: >-
          Nothing aversive follows calling out. The arrangement adds a consequence
          independently of behaviour rather than after it.
      - id: c
        text: 'The learner has been taught an alternative response'
        isCorrect: false
        rationale: >-
          Non-contingent reinforcement teaches nothing. That is a real limitation
          of it, and why it is often paired with a teaching procedure.
      - id: d
        text: 'Attention is being withheld'
        isCorrect: false
        rationale: >-
          Attention is being delivered more often than before, not withheld.
    explanation: >-
      Non-contingent reinforcement works by reducing motivation and by severing the
      response-reinforcer contingency. It is an antecedent procedure, it acts quickly,
      and on its own it teaches the learner nothing — which is why plans usually
      combine it with a teaching component.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        noncontingent-reinforcement,
        motivating-operation,
        antecedent-intervention,
        extinction,
        abolishing-operation
      ]
    citations:
