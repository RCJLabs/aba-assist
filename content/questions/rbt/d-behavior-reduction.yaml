# RBT practice questions — area D, Behavior Reduction. All original.

questions:
  - id: rbt-d-dra-identify
    credential: RBT
    taskRef: { credential: RBT, code: D.3 }
    type: single-best-answer
    stem: >-
      A plan says: reinforce the learner each time they tap a peer's shoulder to start
      play, and do not respond when they pull the peer's hair to start play. Which
      procedure is this?
    options:
      - id: a
        text: Response cost
        isCorrect: false
        rationale: >-
          Response cost removes an earned reinforcer after the problem behavior; nothing
          is removed here.
      - id: b
        text: Differential reinforcement of alternative behavior
        isCorrect: true
        rationale: >-
          Reinforcing an acceptable behavior that serves the same function while
          withholding reinforcement for the problem behavior is DRA.
      - id: c
        text: Differential reinforcement of other behavior
        isCorrect: false
        rationale: >-
          DRO reinforces the absence of the problem behavior for a period; it does not
          specify a particular alternative to reinforce.
      - id: d
        text: Noncontingent reinforcement
        isCorrect: false
        rationale: >-
          Noncontingent reinforcement is delivered on a time schedule regardless of
          behavior.
    explanation: >-
      DRA strengthens a specific alternative that gets the learner the same outcome as the
      problem behavior, while the problem behavior stops working. It is the procedure
      behind functional communication training.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [differential-reinforcement-of-alternative-behavior, replacement-behavior]
    citations:
      - sourceId: vollmer-iwata-1992
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the differential-reinforcement and extinction
        literature; no examination material consulted.
