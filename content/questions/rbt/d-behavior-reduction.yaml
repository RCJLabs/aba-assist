  - id: rbt-d-punishment-side-effects
    credential: RBT
    taskRef: { credential: RBT, code: D.6 }
    type: single-best-answer
    stem: >-
      Which of the following is a documented side effect associated with
      punishment-based procedures?
    options:
      - id: a
        text: 'Avoidance of the person who delivers it'
        isCorrect: true
        rationale: >-
          Escape and avoidance of the punishing agent and setting are among the
          most consistently reported side effects, which is one reason these
          procedures are restricted.
      - id: b
        text: 'Permanent elimination of the behaviour'
        isCorrect: false
        rationale: >-
          Suppression under punishment is frequently specific to the conditions in
          which it was delivered and does not reliably persist.
      - id: c
        text: 'Improved generalization of the target skill'
        isCorrect: false
        rationale: >-
          Punishment suppresses a behaviour; it does not teach an alternative, and
          nothing about it promotes generalization.
      - id: d
        text: 'An increase in the punished behaviour'
        isCorrect: false
        rationale: >-
          An increase would mean the consequence was not functioning as a
          punisher, which is by definition not punishment.
    explanation: >-
      The documented side effects of punishment include avoidance of the person and
      setting, emotional responding, and suppression that does not persist outside the
      conditions of delivery. These are why plans favour reinforcement-based
      procedures and why punishment components require specific authorisation.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        punishment,
        positive-punishment,
        negative-punishment,
        least-restrictive-alternative,
        escape-extinction
      ]
    citations:
      - sourceId: azrin-holz-1966
        useType: fact-reference
    attestation:
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the primary behaviour-reduction literature;
        no examination material consulted.
