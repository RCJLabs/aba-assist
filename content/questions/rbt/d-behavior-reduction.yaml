  - id: rbt-d-antecedent-first
    credential: RBT
    taskRef: { credential: RBT, code: D.2 }
    type: single-best-answer
    stem: >-
      A plan lists both an antecedent strategy and a consequence strategy for the same
      behaviour. Why do plans commonly include the antecedent component?
    options:
      - id: a
        text: 'It removes the need to collect data'
        isCorrect: false
        rationale: >-
          Data are collected regardless of which components a plan uses.
      - id: b
        text: 'It is less effective but easier to run'
        isCorrect: false
        rationale: >-
          Antecedent strategies are included because they work, not as a
          convenient substitute.
      - id: c
        text: 'It replaces the need for a functional assessment'
        isCorrect: false
        rationale: >-
          Choosing an antecedent strategy depends on knowing the function, so the
          assessment comes first rather than being replaced.
      - id: d
        text: 'It prevents the behaviour occurring rather than responding after it has'
        isCorrect: true
        rationale: >-
          Antecedent strategies change the conditions under which the behaviour is
          likely, so fewer occurrences need to be responded to at all.
    explanation: >-
      Antecedent strategies — non-contingent access, choice, priming, adjusting task
      difficulty, changing the schedule of demands — act before the behaviour occurs.
      They are generally less intrusive than consequence-based components, which is
      part of why plans lead with them.
    cognitiveLevel: analysis
    difficulty: 2
    termRefs:
      [
        antecedent-intervention,
        motivating-operation,
        noncontingent-reinforcement,
        setting-event,
        high-probability-request-sequence
      ]
