  - id: rbt-d-function-attention-vs-escape
    credential: RBT
    taskRef: { credential: RBT, code: D.1 }
    type: single-best-answer
    stem: >-
      A learner throws materials only during maths and only when an adult is nearby,
      and the throwing reliably ends the maths task. Which function do these data most
      support?
    options:
      - id: a
        text: 'Automatic reinforcement'
        isCorrect: false
        rationale: >-
          Automatic reinforcement would not depend on a demand being present and
          would not be so tightly tied to the maths task.
      - id: b
        text: 'Access to a tangible item'
        isCorrect: false
        rationale: >-
          No item is delivered following the behaviour in this description.
      - id: c
        text: 'Escape from the task'
        isCorrect: true
        rationale: >-
          The behaviour occurs under demands and produces removal of the demand.
          That is the pattern of escape maintenance, whoever happens to be nearby.
      - id: d
        text: 'Access to attention'
        isCorrect: false
        rationale: >-
          An adult being present is not the same as attention being the
          consequence. What reliably follows is the task ending.
    explanation: >-
      Function is identified by what reliably follows the behaviour, not by who is
      present or what the behaviour looks like. Technicians assist with the assessment
      that establishes function; they do not determine it, and the written plan
      follows from it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        function-of-behavior,
        escape-extinction,
        automatic-reinforcement,
        functional-behavior-assessment,
        abc-recording
      ]
