  - id: rbt-d-escape-extinction-integrity
    credential: RBT
    taskRef: { credential: RBT, code: D.4 }
    type: single-best-answer
    stem: >-
      A plan specifies that a demand is not removed following problem behaviour.
      During a difficult session the technician ends the demand early once to let the
      learner calm down. What is the most likely consequence for the plan?
    options:
      - id: a
        text: 'No effect, because it was only once'
        isCorrect: false
        rationale: >-
          A single removal after a long run of non-removal is an intermittent
          schedule for the problem behaviour, which is the arrangement that makes
          behaviour most persistent.
      - id: b
        text: 'The behaviour is likely to become more persistent'
        isCorrect: true
        rationale: >-
          Intermittent reinforcement of a behaviour on extinction makes it
          markedly harder to reduce afterwards, so one removal can cost weeks.
      - id: c
        text: 'The plan will work faster'
        isCorrect: false
        rationale: >-
          Nothing about breaking the contingency accelerates the reduction it
          depends on.
      - id: d
        text: 'The learner will generalize the skill sooner'
        isCorrect: false
        rationale: >-
          Generalization is unrelated, and no skill was taught by ending the
          demand.
    explanation: >-
      Extinction depends on the maintaining consequence being withheld consistently.
      An occasional lapse converts it into intermittent reinforcement, which produces
      more persistent responding than continuous reinforcement ever did. If a plan
      cannot be run safely as written, that is a report to the supervisor rather than
      an on-the-spot change.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs:
      [
        escape-extinction,
        extinction,
        intermittent-reinforcement,
        treatment-integrity,
        behavioral-momentum
      ]
    citations:
