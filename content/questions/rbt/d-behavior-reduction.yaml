  - id: rbt-d-spontaneous-recovery
    credential: RBT
    taskRef: { credential: RBT, code: D.6 }
    type: single-best-answer
    stem: >-
      A behaviour on extinction has been near zero for three weeks. After a long
      weekend it occurs several times in one session, then falls away again. What is
      the most likely account?
    options:
      - id: a
        text: 'Spontaneous recovery'
        isCorrect: true
        rationale: >-
          A behaviour that has undergone extinction commonly reappears after a
          break and then declines again. It is a documented feature of the process
          rather than a failure of it.
      - id: b
        text: 'The extinction procedure was run incorrectly'
        isCorrect: false
        rationale: >-
          Possible, but a brief reappearance after a break followed by a return to
          near zero is the textbook pattern for recovery rather than for
          procedural error.
      - id: c
        text: 'The behaviour has acquired a new function'
        isCorrect: false
        rationale: >-
          A change in function would usually show as a sustained change in
          pattern, not a single session that resolves on its own.
      - id: d
        text: 'The learner is being reinforced by the technician deliberately'
        isCorrect: false
        rationale: >-
          Nothing in the description indicates this, and the pattern described is
          well accounted for without it.
    explanation: >-
      Spontaneous recovery is the reappearance of an extinguished behaviour after time
      has passed, usually at a lower level and briefly. Recognising it matters because
      the alternative reading — that the plan has stopped working — leads to
      abandoning a procedure that is working.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [spontaneous-recovery, extinction, resurgence, extinction-burst]
    citations:
      - sourceId: lerman-iwata-wallace-1999
        useType: fact-reference
    attestation:
      originalProse: true
