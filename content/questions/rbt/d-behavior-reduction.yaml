  - id: rbt-d-dra-vs-dro
    credential: RBT
    taskRef: { credential: RBT, code: D.3 }
    type: single-best-answer
    stem: >-
      A plan aims to increase a learner asking for help and decrease throwing
      materials. Which differential reinforcement arrangement matches that aim most
      directly?
    options:
      - id: a
        text: 'DRH, reinforcing higher rates of throwing'
        isCorrect: false
        rationale: >-
          DRH increases a behaviour, which is the opposite of the stated aim.
      - id: b
        text: 'DRO, reinforcing the absence of throwing'
        isCorrect: false
        rationale: >-
          DRO would reduce throwing but does not specify or strengthen the asking,
          so the learner is left without a way to get help.
      - id: c
        text: 'DRA, reinforcing asking for help'
        isCorrect: true
        rationale: >-
          DRA reinforces a specific alternative response that serves the same
          function, which both reduces the problem behaviour and leaves the
          learner with something that works.
      - id: d
        text: 'DRL, reinforcing lower rates of throwing'
        isCorrect: false
        rationale: >-
          DRL is for behaviours that are acceptable at a lower rate. Throwing
          materials is not usually one of them, and it still teaches no
          alternative.
    explanation: >-
      DRA reinforces a specific alternative; DRO reinforces the absence of the target;
      DRI reinforces something incompatible. DRA is the usual choice where the learner
      needs a way to achieve what the problem behaviour was achieving.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        differential-reinforcement-of-alternative-behavior,
        differential-reinforcement-of-other-behavior,
        differential-reinforcement-of-low-rates,
        functional-communication-training,
        replacement-behavior
      ]
