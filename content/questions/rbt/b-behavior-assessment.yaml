# RBT practice questions — area B, Behavior Assessment. All original.

questions:
  - id: rbt-b-mswo-procedure
    credential: RBT
    taskRef: { credential: RBT, code: B }
    type: single-best-answer
    stem: >-
      A technician lays out five items, lets the learner pick one, removes the chosen
      item, rearranges the remaining four, and repeats until all items have been chosen.
      Which preference assessment is this?
    options:
      - id: a
        text: Paired-stimulus
        isCorrect: false
        rationale: >-
          Paired-stimulus presents items two at a time, not as an array of five.
      - id: b
        text: Free-operant observation
        isCorrect: false
        rationale: >-
          Free-operant assessment gives free access to everything at once and times
          engagement; nothing is chosen or removed.
      - id: c
        text: Multiple-stimulus without replacement
        isCorrect: true
        rationale: >-
          Removing each chosen item and re-presenting the rest is the defining feature of
          the without-replacement format. The order of selection gives the ranking.
      - id: d
        text: Multiple-stimulus with replacement
        isCorrect: false
        rationale: >-
          In the with-replacement format the chosen item goes back into the array and the
          same items are presented again, so nothing is removed and no ranking emerges.
    explanation: >-
      Multiple-stimulus without replacement presents an array, removes each selected item
      and re-presents the remainder. It is fast, gives a full ranking, and is widely used
      before sessions to choose the day's reinforcers.
    cognitiveLevel: recall
    difficulty: 1
    termRefs:
      [
        multiple-stimulus-without-replacement,
        multiple-stimulus-with-replacement,
        preference-assessment
      ]
    citations:
      - sourceId: deleon-iwata-1996
        useType: fact-reference
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the preference-assessment and functional-assessment
        literature; no examination material consulted.
