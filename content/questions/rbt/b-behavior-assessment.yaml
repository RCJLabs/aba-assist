  - id: rbt-b-abc-what-technician-records
    credential: RBT
    taskRef: { credential: RBT, code: B.3 }
    type: single-best-answer
    stem: >-
      A technician is asked to complete ABC recording for a week. Which entry is
      written the way the procedure requires?
    options:
      - id: a
        text: 'Antecedent — instruction to put the tablet away. Behavior — pushed it off the table. Consequence — adult retrieved it and stepped away.'
        isCorrect: true
        rationale: >-
          Each column describes what an observer could see and hear, with no claim
          about why. That is what makes the record usable for identifying a
          pattern.
      - id: b
        text: 'Antecedent — frustration building. Behavior — meltdown. Consequence — calmed down.'
        isCorrect: false
        rationale: >-
          "Building", "meltdown" and "calmed down" are all inferences, and
          different recorders would apply them differently.
      - id: c
        text: 'Antecedent — none. Behavior — aggression. Consequence — none.'
        isCorrect: false
        rationale: >-
          Recording nothing in two of three columns loses the information the
          procedure exists to capture.
      - id: d
        text: 'Antecedent — wanted attention. Behavior — acting out. Consequence — got what he wanted.'
        isCorrect: false
        rationale: >-
          Every column here is an interpretation rather than an observation, and
          none of it could be verified by somebody else watching.
    explanation: >-
      ABC recording is a descriptive assessment: it records what was observed before,
      during and after, in terms somebody else could verify. Interpreting the pattern
      is the analyst's job, and interpretation written into the columns makes that job
      harder rather than easier.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        abc-recording,
        descriptive-assessment,
        objective-language,
        functional-behavior-assessment,
        operational-definition
      ]
    citations:
