  - id: rbt-d-extinction-burst-expected
    credential: RBT
    taskRef: { credential: RBT, code: D.6 }
    type: single-best-answer
    stem: >-
      In the first sessions after an extinction procedure begins, the behavior gets more
      frequent and more intense. What is the technician's response?
    options:
      - id: a
        text: Stop the procedure, since it is making things worse
        isCorrect: false
        rationale: >-
          Stopping mid-burst reinforces the escalated form, which is the worst available
          outcome.
      - id: b
        text: Deliver the consequence once to settle the learner
        isCorrect: false
        rationale: >-
          One delivery at the height of a burst is intermittent reinforcement of the most
          intense response yet.
      - id: c
        text: Increase the intensity of the procedure
        isCorrect: false
        rationale: >-
          Changing the procedure's parameters is a program decision, not a response to an
          expected effect.
      - id: d
        text: Continue the plan as written if it is safe to do so, record what happened, and report it
        isCorrect: true
        rationale: >-
          A temporary increase is a documented effect of the procedure, and abandoning it
          at the peak teaches that the behavior works when escalated.
    explanation: >-
      A burst is predicted, not a sign of failure — which is why it is taught in advance.
      The two things that are the technician's to do are keep the procedure intact where
      safe and make sure the supervisor sees what happened.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [extinction, extinction-burst]
    citations:
      - sourceId: lerman-iwata-1996
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov

  - id: rbt-d-spontaneous-recovery-vs-failure
    credential: RBT
    taskRef: { credential: RBT, code: D.6 }
    type: single-best-answer
    stem: >-
      A behavior reduced by extinction had almost stopped, then reappeared after a quiet
      week. What is the most likely explanation?
    options:
      - id: a
        text: The behavior was never really reduced
        isCorrect: false
        rationale: >-
          The data showed a reduction; that record does not un-happen.
      - id: b
        text: Spontaneous recovery, a known effect that can follow a period without the behavior
        isCorrect: true
        rationale: >-
          A reduced behavior reappearing after time has passed is documented and does not
          by itself mean the procedure failed.
      - id: c
        text: The plan has stopped working and needs replacing
        isCorrect: false
        rationale: >-
          A single reappearance is not evidence for that, and the conclusion is not the
          technician's to draw.
      - id: d
        text: Somebody must have reinforced the behavior deliberately
        isCorrect: false
        rationale: >-
          Possible and worth noting, but spontaneous recovery does not require it.
    explanation: >-
      Extinction does not produce a clean line to zero. Bursts early and recoveries later
      are part of the pattern, and knowing that is what keeps a team from abandoning a
      working procedure at the wrong moment.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [extinction, spontaneous-recovery]
    citations:
      - sourceId: lerman-iwata-1996
        useType: fact-reference
    attestation: *att
    review: *rev
    provenance: *prov
