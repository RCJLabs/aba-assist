  - id: rbt-e-when-to-ask-supervisor
    credential: RBT
    taskRef: { credential: RBT, code: E.2 }
    type: single-best-answer
    stem: >-
      Mid-session a technician realizes the written program does not cover a
      situation that has arisen. Nobody is in danger. What is the appropriate course?
    options:
      - id: a
        text: 'Ask the caregiver what they would prefer'
        isCorrect: false
        rationale: >-
          That places a clinical decision on the family, who have not been asked
          to make it and are not positioned to.
      - id: b
        text: 'End the session immediately'
        isCorrect: false
        rationale: >-
          Ending is a large step for a situation with no danger in it, and it
          costs the session's data for no benefit.
      - id: c
        text: 'Choose the procedure that seems closest and run it'
        isCorrect: false
        rationale: >-
          Selecting a procedure is a clinical decision. Running an unwritten one
          also produces data that do not describe the program.
      - id: d
        text: 'Continue with what is written, contact the supervisor through the usual route, and record the question'
        isCorrect: true
        rationale: >-
          Running the written program is never the wrong answer, and the
          question reaches the person whose decision it is with a record that it
          was raised at the time.
    explanation: >-
      Asking for direction promptly and through the agreed route is a named part of
      the role. The default while waiting is the written program, because an
      improvised procedure changes both what the learner experiences and what the data
      mean.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [supervision, scope-of-practice, treatment-integrity, behavior-intervention-plan]
    ethicsRefs: [working-under-supervision, staying-in-your-role]
    citations:
