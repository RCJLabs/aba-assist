  - id: rbt-e-data-belongs-to-record
    credential: RBT
    taskRef: { credential: RBT, code: E.4 }
    type: single-best-answer
    stem: >-
      A technician keeps personal shorthand notes on their phone during sessions and
      writes the formal note later from them. What is the main risk?
    options:
      - id: a
        text: 'The supervisor may want to see the shorthand'
        isCorrect: false
        rationale: >-
          A supervisor asking to see working notes is ordinary and is not a risk.
      - id: b
        text: 'The formal note may take longer to write'
        isCorrect: false
        rationale: >-
          Time to write is a practical matter and not the risk that matters here.
      - id: c
        text: "Identifiable information may be held somewhere outside the record system's protections"
        isCorrect: true
        rationale: >-
          Anything identifying a client belongs in the system the employer secures
          and retains. A personal device is outside those controls and outside the
          retention rules.
      - id: d
        text: 'The shorthand may be hard to read later'
        isCorrect: false
        rationale: >-
          Legibility is a real annoyance but a much smaller problem than where the
          information is being stored.
    explanation: >-
      Client information is governed wherever it is written down, including a phone.
      Employers set which systems may hold it and for how long, and a personal device
      is almost never one of them. Using the employer's system from the start avoids
      the problem rather than managing it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [confidentiality, hipaa, session-note, data-sheet]
    ethicsRefs: [confidentiality-and-records]
