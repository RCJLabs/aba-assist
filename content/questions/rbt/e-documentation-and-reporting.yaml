  - id: rbt-e-incident-report-timing
    credential: RBT
    taskRef: { credential: RBT, code: E.4 }
    type: single-best-answer
    stem: >-
      A learner is scratched during a session and the skin is not broken. The
      technician plans to mention it at supervision next week. What is wrong with that
      plan?
    options:
      - id: a
        text: 'Nothing, since the injury was minor'
        isCorrect: false
        rationale: >-
          Severity is not what determines reporting. Timeliness is, and minor
          injuries are exactly the ones that go unreported until a pattern is
          invisible.
      - id: b
        text: 'Injuries are reported the same day, whatever their severity'
        isCorrect: true
        rationale: >-
          Same-day reporting is the standard professional expectation, and it is
          also what makes an accurate record possible while the detail is fresh.
      - id: c
        text: 'It should be recorded but not reported'
        isCorrect: false
        rationale: >-
          Recording without reporting leaves the information somewhere nobody is
          looking at until the next review.
      - id: d
        text: 'The caregiver should decide whether to report it'
        isCorrect: false
        rationale: >-
          Reporting to the supervisor is the technician's obligation and is not
          delegated to the family.
    explanation: >-
      Any injury connected with a session goes to the supervising analyst the same
      day, minor or not, alongside whatever incident form the employer requires.
      Waiting loses detail and hides patterns that only become visible when several
      small events are read together.
