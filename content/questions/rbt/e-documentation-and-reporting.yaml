# RBT practice questions — area E, Documentation and Reporting. All original.

questions:
  - id: rbt-e-objective-note
    credential: RBT
    taskRef: { credential: RBT, code: E }
    type: single-best-answer
    stem: >-
      Which sentence belongs in a session note?
    options:
      - id: a
        text: 'Cried for approximately 3 minutes after the tablet was removed at 10:15.'
        isCorrect: true
        rationale: >-
          It describes what was observed, how long, and when, without interpretation.
      - id: b
        text: 'Had a meltdown because he was being manipulative about the tablet.'
        isCorrect: false
        rationale: >-
          It labels the behavior and assigns a motive nobody observed.
      - id: c
        text: 'Was in a bad mood the whole session.'
        isCorrect: false
        rationale: >-
          A mood judgment is not observable and gives the reader nothing measurable.
      - id: d
        text: 'Did great today!'
        isCorrect: false
        rationale: >-
          A general evaluation contains no observation and cannot be checked.
    explanation: >-
      Session notes describe behavior in objective, observable terms with times and
      amounts. They are clinical and often legal records, read by supervisors, funders and
      sometimes courts. Interpretations and labels belong nowhere in them.
    cognitiveLevel: application
    difficulty: 1
    termRefs: [objective-language, session-note]
    citations:
      - sourceId: bacb-rbt-ethics-code-2
        useType: fact-reference
        locator: Documentation responsibilities
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from documentation practice and the technician ethics
        code; no examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-14'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
