  - id: rbt-e-pass-on-caregiver-report
    credential: RBT
    taskRef: { credential: RBT, code: E.1 }
    type: single-best-answer
    stem: >-
      At the door a caregiver tells a technician that the learner has started refusing
      to get on the school bus. What is the technician's responsibility?
    options:
      - id: a
        text: 'Note it only if it happens again'
        isCorrect: false
        rationale: >-
          Waiting for a second report delays information the analyst may need now,
          and the detail is already fading.
      - id: b
        text: 'Advise the caregiver on how to handle the bus refusal'
        isCorrect: false
        rationale: >-
          Advising on a situation outside the program is a clinical
          recommendation and outside the technician's role.
      - id: c
        text: 'Pass the report to the supervising analyst promptly and record what was said'
        isCorrect: true
        rationale: >-
          Relaying what caregivers and other team members raise is a named part of
          the role. The analyst decides whether it changes anything.
      - id: d
        text: 'Add the bus to the session program'
        isCorrect: false
        rationale: >-
          Adding a target is a program change, which the analyst makes.
    explanation: >-
      The technician sees and hears things nobody else on the team does. Passing them
      on promptly and factually is the mechanism by which that information reaches the
      person who can act on it, and it is explicitly part of the role rather than a
      courtesy.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [collaboration, session-note, scope-of-practice]
    ethicsRefs: [reporting-to-your-supervisor, staying-in-your-role]
    citations:
