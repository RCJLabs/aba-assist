  - id: rbt-e-note-objective-phrasing
    credential: RBT
    taskRef: { credential: RBT, code: E.4 }
    type: single-best-answer
    stem: >-
      Which sentence belongs in a session note as written?
    options:
      - id: a
        text: The learner was in a bad mood all session.
        isCorrect: false
        rationale: >-
          Mood is not observable and cannot be verified. It also tells the next
          reader nothing they can act on.
      - id: b
        text: >-
          The learner completed 4 of 10 trials independently and left the table three
          times.
        isCorrect: true
        rationale: >-
          Both statements are counts of things an observer could verify, which is
          what makes a note useful to somebody who was not there.
      - id: c
        text: The learner clearly did not want to be there.
        isCorrect: false
        rationale: >-
          This attributes an intention. What was observed — leaving, refusing,
          turning away — is the part that belongs in the record.
      - id: d
        text: Session went well overall.
        isCorrect: false
        rationale: >-
          A summary judgment with nothing behind it cannot be checked, compared
          with last week, or used by anyone.
    explanation: >-
      A session note is a clinical record and usually a billing record. Anything in it
      should be something another person could have observed and counted, because that
      is the standard both a supervisor and an auditor read it against.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [session-note, objective-language, operational-definition]
    ethicsRefs: [honest-documentation-and-billing]
    citations:
      - sourceId: bacb-rbt-ethics-code-2
        useType: fact-reference
    attestation:
