  - id: rbt-f-cultural-adaptation
    credential: RBT
    taskRef: { credential: RBT, code: F.10 }
    type: single-best-answer
    stem: >-
      A caregiver explains that a mealtime routine in the programme conflicts with how
      their family eats. What is the appropriate response from the technician?
    options:
      - id: a
        text: 'Record what the caregiver said and pass it to the supervising analyst promptly'
        isCorrect: true
        rationale: >-
          The family’s values are part of what the goal and the procedure have to
          fit. Relaying it is the technician’s part; adapting the programme is the
          analyst’s.
      - id: b
        text: 'Change the routine to match the family’s preference'
        isCorrect: false
        rationale: >-
          Changing a procedure is a programme change, however reasonable the
          reason.
      - id: c
        text: 'Ask the family to follow the programme at home and their own routine elsewhere'
        isCorrect: false
        rationale: >-
          Asking a family to set aside their own practice in their own home is not
          an adaptation, and it is not the technician’s request to make.
      - id: d
        text: 'Explain that the programme is evidence-based and continue as written'
        isCorrect: false
        rationale: >-
          Citing evidence does not answer the objection, and a programme a family
          will not run at home is not going to work whatever its evidence base.
    explanation: >-
      Cultural responsiveness means the assessment, the goals and the procedures fit
      the people who have to live with them. A technician’s role is to notice the
      mismatch and get it to the analyst quickly, with the family’s own words rather
      than a summary of them.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [cultural-responsiveness, cultural-humility, social-validity, collaboration, assent]
    ethicsRefs:
      [cultural-humility-and-bias, choosing-goals-that-matter, consent-and-who-decides]
    citations:
