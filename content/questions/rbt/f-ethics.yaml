  - id: rbt-f-feedback-response
    credential: RBT
    taskRef: { credential: RBT, code: F.9 }
    type: single-best-answer
    stem: >-
      A supervisor gives a technician corrective feedback about how they delivered
      prompts. The technician disagrees. Which response best fits what the role
      requires?
    options:
      - id: a
        text: 'Implement the feedback and raise the disagreement in the same conversation'
        isCorrect: true
        rationale: >-
          Taking feedback and being able to discuss it are both named parts of the
          role. Doing the first while doing the second is how a disagreement stays
          professional and gets resolved.
      - id: b
        text: 'Implement it silently and say nothing'
        isCorrect: false
        rationale: >-
          Compliance without discussion hides information the supervisor needs and
          leaves the technician running something they believe is wrong.
      - id: c
        text: 'Continue as before, since they have more contact with the learner'
        isCorrect: false
        rationale: >-
          Contact time does not transfer the responsibility for the procedure,
          which remains the supervisor’s.
      - id: d
        text: 'Ask a colleague which of the two is right'
        isCorrect: false
        rationale: >-
          A third technician cannot settle a question about a programme neither of
          them is responsible for.
    explanation: >-
      Receiving feedback, asking questions and working through a disagreement are
      interpersonal skills the code names explicitly. The thing the role does not
      permit is deciding unilaterally to keep running something the supervisor has
      asked to be changed.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [performance-feedback, supervision, collaboration, scope-of-practice]
    ethicsRefs: [professional-and-interpersonal-skills, working-under-supervision]
    citations:
