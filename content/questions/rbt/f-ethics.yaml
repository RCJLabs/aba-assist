  - id: rbt-f-assumptions-about-family
    credential: RBT
    taskRef: { credential: RBT, code: F.10 }
    type: single-best-answer
    stem: >-
      A technician notices they have been assuming a family is uninterested because
      they rarely attend caregiver training sessions. What does cultural humility ask
      of them here?
    options:
      - id: a
        text: 'Raise it directly with the family as a concern about their commitment'
        isCorrect: false
        rationale: >-
          That confronts a family with a judgement rather than asking what would
          make participation possible.
      - id: b
        text: 'Examine the assumption and consider what else could explain the pattern'
        isCorrect: true
        rationale: >-
          Cultural humility is an ongoing self-examining stance. Shift work,
          transport, other children and previous experiences of services all
          produce the same attendance pattern as disinterest.
      - id: c
        text: 'Record the family as non-compliant in the session note'
        isCorrect: false
        rationale: >-
          "Non-compliant" is a conclusion about the family rather than an
          observation, and writing it into the record makes the assumption
          durable.
      - id: d
        text: 'Reduce the number of goals because the family will not participate'
        isCorrect: false
        rationale: >-
          Changing goals is a programme decision, and here it would be made on the
          basis of an untested assumption.
    explanation: >-
      The stance the code describes is directed at oneself: noticing an assumption,
      holding it loosely, and finding out. What looks like disinterest is frequently a
      scheduling problem, a transport problem, or a history of services that did not
      listen.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [cultural-humility, cultural-responsiveness, objective-language, collaboration]
    ethicsRefs: [cultural-humility-and-bias, professional-and-interpersonal-skills]
