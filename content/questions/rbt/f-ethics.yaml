  - id: rbt-f-new-procedure-partial-training
    credential: RBT
    taskRef: { credential: RBT, code: F.2 }
    type: single-best-answer
    stem: >-
      A technician has been shown a new procedure once and does not feel confident
      running it unsupervised. Which response fits the code best?
    options:
      - id: a
        text: 'Refuse to work with that learner at all'
        isCorrect: false
        rationale: >-
          Declining the whole assignment is a larger step than the situation
          needs, and the procedure is one part of the session.
      - id: b
        text: 'Ask another technician to run it instead without telling the supervisor'
        isCorrect: false
        rationale: >-
          Reassigning work informally hides a training need from the person
          responsible for addressing it.
      - id: c
        text: 'Run it and hope accuracy improves with practice'
        isCorrect: false
        rationale: >-
          Practising a procedure incorrectly builds an inaccurate performance and
          produces data that misdescribe what the learner actually received.
      - id: d
        text: 'Ask for practice with feedback until performance is reliable, and say where they are up to'
        isCorrect: true
        rationale: >-
          Behavioural skills training — instruction, modelling, rehearsal and
          feedback — is the standard, and reporting your own current level is part
          of working under supervision.
    explanation: >-
      Being partly trained is an ordinary state and the answer is to say so.
      Behavioural skills training exists because being told about a procedure does not
      reliably produce competent performance of it, and rehearsal with feedback does.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [behavioral-skills-training, scope-of-competence, performance-feedback, supervision]
    ethicsRefs: [competence-before-you-practise, working-under-supervision]
    citations:
      - sourceId: bacb-rbt-ethics-code-2
        useType: fact-reference
    attestation:
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
