# RBT practice questions — area F, Ethics. All original.

questions:
  - id: rbt-f-confidentiality-in-public
    credential: RBT
    taskRef: { credential: RBT, code: F.5 }
    type: single-best-answer
    stem: >-
      At a grocery store a neighbor mentions seeing the technician at a particular
      family's house, asks whether the technician works with their son, and asks how he is
      doing. What is the most appropriate response?
    options:
      - id: a
        text: Ask the neighbor to keep it between the two of you
        isCorrect: false
        rationale: >-
          Asking for secrecy means a disclosure has already been made.
      - id: b
        text: Say that you cannot discuss whether anyone is a client or anything about services, and change the subject
        isCorrect: true
        rationale: >-
          Confirming a service relationship is itself a disclosure. A clear, polite
          refusal protects the family and complies with confidentiality standards.
      - id: c
        text: Confirm you work with the family but say you cannot share details
        isCorrect: false
        rationale: >-
          Confirming the relationship discloses that the child receives services.
      - id: d
        text: Share only positive news since it will not embarrass anyone
        isCorrect: false
        rationale: >-
          Positive information is still protected information.
    explanation: >-
      Confidentiality covers the fact of services, not just their content. The safest
      response in any public setting is a friendly refusal to confirm or deny, and the
      incident should be mentioned to the supervisor if it may recur.
    cognitiveLevel: application
    difficulty: 1
    termRefs: [confidentiality, hipaa]
    citations:
      - sourceId: bacb-rbt-ethics-code-2
        useType: fact-reference
        locator: Confidentiality
    attestation: &att
      originalProse: true
      noVerbatimSource: true
      aiAssisted: true
      consulted: >-
        Original question written from the ethics codes' standards, restated in our own
        words; no examination material consulted.
    review: &rev
      status: in-review
      authoredBy: claude
      authoredOn: '2026-09-14'
      reviewedBy: null
      reviewedOn: null
    provenance: &prov
      license: CC-BY-SA-4.0
