  - id: rbt-f-supervision-not-happening
    credential: RBT
    taskRef: { credential: RBT, code: F.4 }
    type: single-best-answer
    stem: >-
      A technician’s supervision contacts have consisted only of brief phone calls
      with no observation for three months. What should they do?
    options:
      - id: a
        text: 'Raise it with the supervisor in writing and, if it continues, with the organisation'
        isCorrect: true
        rationale: >-
          The technician has an obligation to practise under supervision that
          meets the requirement, and raising a shortfall is part of that rather
          than a complaint about a person.
      - id: b
        text: 'Record the contacts as observed so the paperwork is complete'
        isCorrect: false
        rationale: >-
          Recording supervision that did not happen the way it is recorded is
          falsifying a document, which is a far more serious matter than the
          shortfall itself.
      - id: c
        text: 'Stop practising immediately without telling anybody'
        isCorrect: false
        rationale: >-
          Withdrawing without notice leaves learners without a technician and does
          not address the problem with anyone who can fix it.
      - id: d
        text: 'Nothing, since contacts did take place'
        isCorrect: false
        rationale: >-
          Contacts happening is not the same as the requirement being met, and
          observation is a specified part of it.
    explanation: >-
      Both the technician and the supervisor carry obligations here. A shortfall
      raised in writing is a problem being managed; one left unraised becomes the
      technician’s problem at recertification, when the application asks them
      directly.
    cognitiveLevel: application
    difficulty: 3
    termRefs: [supervision, self-reporting, scope-of-practice]
    ethicsRefs:
      [working-under-supervision, raising-an-ethics-concern, honest-documentation-and-billing]
