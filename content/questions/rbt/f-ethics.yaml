  - id: rbt-f-gift-limits
    credential: RBT
    taskRef: { credential: RBT, code: F.8 }
    type: single-best-answer
    stem: >-
      At the end of a long placement a family offers a technician a gift card worth a
      substantial amount. What does the code direct?
    options:
      - id: a
        text: 'Decline it, explain the rule warmly, and tell the supervisor it was offered'
        isCorrect: true
        rationale: >-
          Gifts of more than nominal value are restricted. Declining kindly,
          giving the reason once, and reporting it is the complete response.
      - id: b
        text: 'Accept it and share it with colleagues'
        isCorrect: false
        rationale: >-
          Sharing it does not change that it was accepted, nor the relationship it
          creates with the family.
      - id: c
        text: 'Accept it if the organisation never finds out'
        isCorrect: false
        rationale: >-
          Concealment converts a boundary question into a dishonesty question and
          makes the situation considerably worse.
      - id: d
        text: 'Accept it, because refusing would be rude'
        isCorrect: false
        rationale: >-
          Politeness does not resolve it. Gifts of substantial value create an
          obligation that can affect professional judgement, which is why they are
          limited.
    explanation: >-
      Both codes limit giving and accepting gifts to items of nominal value, because
      gifts create obligations that sit awkwardly with professional judgement. The
      practical answer is a warm, consistent, brief refusal and a note to the
      supervisor, which also protects the technician.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [dual-relationship, conflict-of-interest, professional-development-unit]
    ethicsRefs: [gifts, conflicts-of-interest-and-money, multiple-relationships]
    citations:
