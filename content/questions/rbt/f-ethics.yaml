  - id: rbt-f-what-supervision-includes
    credential: RBT
    taskRef: { credential: RBT, code: F.4 }
    type: single-best-answer
    stem: >-
      Which description best matches what ongoing supervision is expected to consist
      of?
    options:
      - id: a
        text: 'Observation of work with a client, feedback on performance, and practice of skills'
        isCorrect: true
        rationale: >-
          Supervision is performance-based: the supervisor watches the technician
          work, gives feedback on what they saw, and builds skills through
          practice.
      - id: b
        text: 'A written quiz completed each month'
        isCorrect: false
        rationale: >-
          A quiz tests knowledge rather than performance, and the requirement is
          about what the technician does with a client.
      - id: c
        text: 'Reviewing session notes without meeting'
        isCorrect: false
        rationale: >-
          Reviewing paperwork is useful but is not real-time contact and does not
          include observation of the technician working.
      - id: d
        text: 'A monthly conversation about how sessions are going'
        isCorrect: false
        rationale: >-
          Conversation alone omits the observation and the feedback on actual
          performance that supervision is built around.
    explanation: >-
      Supervision is meant to change what happens in sessions, which is why it
      involves being watched with a client and receiving feedback rather than only
      discussing cases. A technician who is only ever talked to is not being
      supervised in the sense the requirement means.
    cognitiveLevel: recall
    difficulty: 2
    termRefs:
      [supervision, performance-feedback, behavioral-skills-training, competency-assessment]
    ethicsRefs: [what-good-supervision-looks-like, working-under-supervision]
    citations:
      - sourceId: bacb-rbt-ethics-code-2
        useType: fact-reference
    attestation:
