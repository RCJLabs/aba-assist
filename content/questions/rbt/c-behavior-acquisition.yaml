  - id: rbt-c-token-exchange-rules
    credential: RBT
    taskRef: { credential: RBT, code: C.11 }
    type: single-best-answer
    stem: >-
      A token economy specifies that five tokens are exchanged for a five-minute
      break. A learner has four tokens and asks to exchange now. What should the
      technician do?
    options:
      - id: a
        text: 'Allow the exchange to avoid escalation'
        isCorrect: false
        rationale: >-
          Changing the exchange rule in the moment teaches that the rule moves
          under pressure, which makes the system less effective for everyone using
          it.
      - id: b
        text: 'Run the system as written and provide the opportunity to earn the fifth token'
        isCorrect: true
        rationale: >-
          The exchange rate is part of the written programme. Running it as
          specified keeps both the contingency and the data intact.
      - id: c
        text: 'Remove a token as a consequence for asking'
        isCorrect: false
        rationale: >-
          Response cost is a punishment component that must be authorised in the
          written plan. Improvising it is outside the technician’s role.
      - id: d
        text: 'Give the break without any tokens'
        isCorrect: false
        rationale: >-
          Delivering the backup reinforcer non-contingently undoes the contingency
          the token system depends on.
    explanation: >-
      A token economy works because the rules are consistent: what earns a token, what
      tokens buy, and at what rate. Changing any of those in the moment is a programme
      change, and both the clinical effect and the data depend on it not happening.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        token-economy,
        response-cost,
        conditioned-reinforcer,
        treatment-integrity,
        scope-of-practice
      ]
    citations:
