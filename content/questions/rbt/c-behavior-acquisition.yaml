  - id: rbt-c-negative-reinforcement-teaching
    credential: RBT
    taskRef: { credential: RBT, code: C.1 }
    type: single-best-answer
    stem: >-
      A program teaches a learner to hand over a break card, after which the demand is
      removed for two minutes. Requesting a break increases. What process is operating
      on the card-handing response?
    options:
      - id: a
        text: 'Positive reinforcement'
        isCorrect: false
        rationale: >-
          Nothing is added following the response. What changes is that the demand
          is taken away.
      - id: b
        text: 'Negative reinforcement'
        isCorrect: true
        rationale: >-
          The response is followed by removal of the demand and the response
          increases. Removal plus an increase is negative reinforcement.
      - id: c
        text: 'Positive punishment'
        isCorrect: false
        rationale: >-
          Punishment would mean the response became less likely. It increased.
      - id: d
        text: 'Extinction'
        isCorrect: false
        rationale: >-
          Extinction is withholding the maintaining consequence. Here the
          consequence is being delivered reliably.
    explanation: >-
      Negative reinforcement is defined by removal of something followed by an
      increase in the response. The word "negative" describes the removal, not whether
      the arrangement is undesirable — a break card taught this way is one of the most
      common replacement behaviours in the field.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
