  - id: rbt-c-acquisition-vs-maintenance
    credential: RBT
    taskRef: { credential: RBT, code: C.9 }
    type: single-best-answer
    stem: >-
      A learner reliably names twenty pictures taught six months ago and is currently
      being taught five new ones. Which describes the correct arrangement?
    options:
      - id: a
        text: 'All twenty-five targets should be run as acquisition trials each session'
        isCorrect: false
        rationale: >-
          Running mastered targets as acquisition wastes teaching time and gives
          the learner mostly-easy trials, which tells nobody anything new.
      - id: b
        text: 'The five new targets are acquisition; the twenty mastered ones need periodic maintenance checks'
        isCorrect: true
        rationale: >-
          Acquisition teaches what the learner cannot yet do. Maintenance confirms
          that what was learned is still there, which is a different purpose and a
          much lighter schedule.
      - id: c
        text: 'The twenty mastered targets can be dropped entirely'
        isCorrect: false
        rationale: >-
          Skills that are never revisited can be lost. Maintenance exists
          precisely because mastery at one point does not guarantee mastery later.
      - id: d
        text: 'Maintenance means teaching the same targets again from scratch'
        isCorrect: false
        rationale: >-
          Maintenance is a check on retained responding, not a repeat of the
          teaching sequence.
    explanation: >-
      Acquisition and maintenance answer different questions: can the learner do this
      yet, and does the learner still do it. Confusing them either wastes teaching
      time on mastered targets or quietly loses skills nobody has looked at in months.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [maintenance, discrete-trial-training, trials-to-criterion, generalization]
