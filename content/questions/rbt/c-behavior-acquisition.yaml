  - id: rbt-c-task-analysis-step-size
    credential: RBT
    taskRef: { credential: RBT, code: C.5 }
    type: single-best-answer
    stem: >-
      A learner consistently fails one step of a written task analysis while
      completing the rest. What is the most appropriate thing for the technician to
      do?
    options:
      - id: a
        text: 'Break that step into smaller steps'
        isCorrect: false
        rationale: >-
          Changing the task analysis is a programme change. It may well be the
          right answer, but it is the analyst’s to make.
      - id: b
        text: 'Record the pattern and report it to the supervisor'
        isCorrect: true
        rationale: >-
          The technician’s job is to run the written analysis and report what the
          data show. A single failing step is exactly the observation an analyst
          needs.
      - id: c
        text: 'Skip the step and complete the rest of the chain'
        isCorrect: false
        rationale: >-
          Skipping a step changes the chain being taught and produces data that do
          not describe the programme as written.
      - id: d
        text: 'Complete that step for the learner every time without recording it'
        isCorrect: false
        rationale: >-
          Providing unrecorded assistance makes the data say the learner performed
          a step they did not, which is worse than the original problem.
    explanation: >-
      A step that consistently fails usually means it is too large or needs a
      different prompt, and both are revisions to the written task analysis. Noticing
      and reporting it is within the technician’s role; rewriting it is not.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [task-analysis, chaining, treatment-integrity, scope-of-practice]
    citations:
