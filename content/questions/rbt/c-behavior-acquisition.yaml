  - id: rbt-c-prompt-dependence
    credential: RBT
    taskRef: { credential: RBT, code: C.7 }
    type: single-best-answer
    stem: >-
      A learner completes a task correctly every time but only after a physical
      prompt, and never before it. What does this pattern most likely indicate?
    options:
      - id: a
        text: 'The skill has been mastered'
        isCorrect: false
        rationale: >-
          Mastery means responding without the prompt. Perfect accuracy that is
          entirely prompt-dependent is not mastery of the target response.
      - id: b
        text: 'Stimulus control has transferred to the prompt rather than to the natural cue'
        isCorrect: true
        rationale: >-
          The prompt is now what occasions the response. Transfer-of-control
          procedures exist exactly for this situation.
      - id: c
        text: 'The reinforcer is too strong'
        isCorrect: false
        rationale: >-
          Reinforcer strength does not determine which stimulus occasions
          responding.
      - id: d
        text: 'The task analysis has too few steps'
        isCorrect: false
        rationale: >-
          Step size affects how teachable each step is, not whether control sits
          with the prompt or the natural cue.
    explanation: >-
      The goal is responding under the natural discriminative stimulus, not under the
      prompt. Reliable responding that only ever follows the prompt means control has
      landed in the wrong place, and the written plan’s fading or delay procedure is
      what moves it.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
