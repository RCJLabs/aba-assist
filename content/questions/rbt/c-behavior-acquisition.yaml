  - id: rbt-c-prompt-hierarchy-least-to-most
    credential: RBT
    taskRef: { credential: RBT, code: C.7 }
    type: single-best-answer
    stem: >-
      A program specifies least-to-most prompting for a hand-washing step. The learner
      does not begin within five seconds of the instruction. What comes next?
    options:
      - id: a
        text: 'Deliver the most intrusive prompt available'
        isCorrect: false
        rationale: >-
          That is most-to-least, a different arrangement. Starting at the most
          intrusive level removes the chance to respond with less help.
      - id: b
        text: 'Deliver the next level of assistance in the written hierarchy'
        isCorrect: true
        rationale: >-
          Least-to-most works up the hierarchy one level at a time, giving the
          learner the opportunity to respond with the smallest amount of help that
          works.
      - id: c
        text: 'Repeat the instruction more loudly'
        isCorrect: false
        rationale: >-
          Volume is not a prompt level and changing it introduces a variable the
          program did not specify.
      - id: d
        text: 'End the trial and record no response'
        isCorrect: false
        rationale: >-
          The procedure specifies what to do when the learner does not initiate,
          and ending the trial skips the teaching the hierarchy exists to deliver.
    explanation: >-
      Least-to-most gives the learner the chance to respond independently first and
      adds assistance only as needed, which limits how much prompting the response
      comes to depend on. Which hierarchy is used, and at what intervals, is set by
      the written program.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [least-to-most-prompting, prompt-hierarchy, prompt, most-to-least-prompting]
    citations:
