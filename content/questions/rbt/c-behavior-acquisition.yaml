  - id: rbt-c-discrimination-sd-sdelta
    credential: RBT
    taskRef: { credential: RBT, code: C.6 }
    type: single-best-answer
    stem: >-
      During discrimination training, a learner is reinforced for touching a red card
      and not reinforced for touching a blue one. After training, the learner touches
      red and not blue. What role does the blue card now serve?
    options:
      - id: a
        text: 'A discriminative stimulus for responding'
        isCorrect: false
        rationale: >-
          The red card is the discriminative stimulus for the reinforced response.
          Blue signals the opposite.
      - id: b
        text: 'A stimulus in the presence of which the response is not reinforced'
        isCorrect: true
        rationale: >-
          That is an S-delta: a condition signalling that responding will not
          produce reinforcement, so responding under it declines.
      - id: c
        text: 'A conditioned reinforcer'
        isCorrect: false
        rationale: >-
          Nothing has paired the blue card with reinforcement; the arrangement is
          designed to do the reverse.
      - id: d
        text: 'A motivating operation'
        isCorrect: false
        rationale: >-
          A motivating operation alters the value of a consequence. The blue card
          signals availability, which is a different function.
    explanation: >-
      Discrimination training produces differential responding across two conditions:
      the discriminative stimulus signals reinforcement is available for that
      response, and the S-delta signals it is not. Both are needed for the
      discrimination to form.
    cognitiveLevel: recall
    difficulty: 2
    termRefs:
      [
        discriminative-stimulus,
        s-delta,
        discrimination-training,
        stimulus-control,
        stimulus-discrimination
      ]
