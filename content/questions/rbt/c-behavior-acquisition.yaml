  - id: rbt-c-errorless-rationale
    credential: RBT
    taskRef: { credential: RBT, code: C.6 }
    type: single-best-answer
    stem: >-
      A program uses errorless teaching for a new discrimination. What is the main
      reason for arranging teaching so that errors are unlikely?
    options:
      - id: a
        text: 'It makes sessions shorter'
        isCorrect: false
        rationale: >-
          Session length is not the point, and errorless arrangements often
          require more careful setup rather than less.
      - id: b
        text: 'Repeated errors can become part of the learner’s pattern of responding and are hard to undo'
        isCorrect: true
        rationale: >-
          Errors that are practised get stronger. Arranging teaching so the
          correct response occurs from the start avoids building a competing
          history.
      - id: c
        text: 'It removes the need for reinforcement'
        isCorrect: false
        rationale: >-
          Errorless arrangements still reinforce correct responding; what they
          change is how likely an error is.
      - id: d
        text: 'It guarantees generalization'
        isCorrect: false
        rationale: >-
          Generalization has to be programmed separately. Nothing about errorless
          teaching produces it on its own.
    explanation: >-
      Errorless teaching front-loads assistance so the correct response occurs from
      the first trial, then fades it. The rationale is that practised errors persist
      and that the frustration of repeated failure is itself a cost worth avoiding.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        errorless-teaching,
        stimulus-fading,
        discrimination-training,
        prompt-fading,
        error-correction
      ]
    citations:
