  - id: rbt-c-generalized-conditioned-reinforcer
    credential: RBT
    taskRef: { credential: RBT, code: C.2 }
    type: single-best-answer
    stem: >-
      Why is a token exchangeable for a choice of several items usually more durable
      than a token exchangeable for one specific snack?
    options:
      - id: a
        text: 'It takes longer to deliver'
        isCorrect: false
        rationale: >-
          Delivery time is not what maintains the effect, and a slower reinforcer
          is generally worse rather than better.
      - id: b
        text: 'Its effect does not depend on the learner being deprived of one particular thing'
        isCorrect: true
        rationale: >-
          A generalized conditioned reinforcer is backed by several reinforcers,
          so satiation on any one of them does not remove its value.
      - id: c
        text: 'It is easier for the technician to count'
        isCorrect: false
        rationale: >-
          Counting convenience is a practical matter and has no bearing on why the
          token keeps working.
      - id: d
        text: 'It has been paired with punishment'
        isCorrect: false
        rationale: >-
          Pairing with punishment would make it aversive rather than reinforcing.
    explanation: >-
      A generalized conditioned reinforcer is one backed by many different
      reinforcers, which is why money works. Satiation on any single backup does not
      undermine it, so its effect survives across sessions and across motivating
      conditions.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        generalized-conditioned-reinforcer,
        conditioned-reinforcer,
        token-economy,
        satiation,
        motivating-operation
      ]
    citations:
      - sourceId: kazdin-1977-token
        useType: fact-reference
    attestation:
