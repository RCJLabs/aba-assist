  - id: rbt-c-generalization-programmed
    credential: RBT
    taskRef: { credential: RBT, code: C.8 }
    type: single-best-answer
    stem: >-
      A learner greets the technician reliably in the therapy room but not at home or
      with other staff. What does the program most likely need to arrange?
    options:
      - id: a
        text: 'More trials in the therapy room'
        isCorrect: false
        rationale: >-
          Additional practice in the setting where the skill already occurs does
          not address the settings where it does not.
      - id: b
        text: 'Teaching across several people, settings and materials'
        isCorrect: true
        rationale: >-
          Generalization is programmed, not assumed. Training with multiple
          exemplars across people and settings is the standard way to produce it.
      - id: c
        text: 'A stronger reinforcer in the therapy room'
        isCorrect: false
        rationale: >-
          A stronger reinforcer in one setting makes responding there more likely,
          which is the opposite of what is needed.
      - id: d
        text: 'Waiting for the skill to transfer on its own'
        isCorrect: false
        rationale: >-
          Skills taught in one narrow context frequently do not transfer without
          being programmed to.
    explanation: >-
      Generalization has to be built into teaching rather than hoped for afterwards.
      Multiple exemplars, varied settings and people, and teaching loosely are the
      usual tactics, and they are written into the programme rather than improvised.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
