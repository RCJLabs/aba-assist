  - id: rbt-c-reinforcer-vs-preferred
    credential: RBT
    taskRef: { credential: RBT, code: C.1 }
    type: single-best-answer
    stem: >-
      A preference assessment identifies a toy as highly preferred. The toy is
      delivered after each correct response for a week, and correct responding does
      not increase. What is the most accurate conclusion?
    options:
      - id: a
        text: 'The toy is not currently functioning as a reinforcer for that response'
        isCorrect: true
        rationale: >-
          A reinforcer is defined by its effect on behaviour. High preference
          predicts reinforcer value but does not guarantee it, and responding is
          the test.
      - id: b
        text: 'The learner is being deliberately uncooperative'
        isCorrect: false
        rationale: >-
          Attributing the result to intent explains nothing and is not something
          the data can show.
      - id: c
        text: 'The preference assessment was run incorrectly'
        isCorrect: false
        rationale: >-
          Possible, but preference and reinforcer effect are different things even
          when the assessment is run perfectly.
      - id: d
        text: 'The response is too easy'
        isCorrect: false
        rationale: >-
          An easy response would be more likely to increase, not less, if the
          consequence were reinforcing it.
    explanation: >-
      Preference assessments predict; they do not define. Something is a reinforcer
      only if delivering it makes the behaviour more likely, and a preferred item that
      does not do so needs a reinforcer assessment rather than another week of trying.
    cognitiveLevel: analysis
    difficulty: 3
