  - id: rbt-c-trial-structure-order
    credential: RBT
    taskRef: { credential: RBT, code: C.3 }
    type: single-best-answer
    stem: >-
      Which sequence describes a discrete trial as programs usually specify it?
    options:
      - id: a
        text: 'Instruction, response, consequence, brief pause before the next trial'
        isCorrect: true
        rationale: >-
          A discrete trial has a clear beginning and end: an antecedent, the
          learner’s response, a programmed consequence, and a short interval
          separating it from the next.
      - id: b
        text: 'Continuous teaching with no separation between opportunities'
        isCorrect: false
        rationale: >-
          That is closer to naturalistic teaching in the flow of activity, not the
          discrete structure the question describes.
      - id: c
        text: 'Consequence, instruction, response'
        isCorrect: false
        rationale: >-
          A consequence follows a response. Delivering it first would make it an
          antecedent event rather than a consequence.
      - id: d
        text: 'Instruction repeated until the learner responds correctly'
        isCorrect: false
        rationale: >-
          Repeating an instruction with no programmed consequence or inter-trial
          interval is not a trial structure, and repeated instructions weaken the
          instruction’s control.
    explanation: >-
      The structure of a discrete trial — antecedent, response, consequence, inter-
      trial interval — is what makes each opportunity countable and each trial
      comparable to the last. The inter-trial interval is a real component, not dead
      time.
    cognitiveLevel: recall
    difficulty: 1
    termRefs:
      [
        discrete-trial-training,
        three-term-contingency,
        discriminative-stimulus,
        naturalistic-teaching
      ]
    citations:
