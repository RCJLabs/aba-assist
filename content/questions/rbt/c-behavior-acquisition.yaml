  - id: rbt-c-shaping-criterion-moves
    credential: RBT
    taskRef: { credential: RBT, code: C.10 }
    type: single-best-answer
    stem: >-
      A learner is being shaped to say a word and currently produces the first sound
      reliably. The program says to reinforce closer approximations. What should the
      technician do next?
    options:
      - id: a
        text: 'Continue reinforcing the first sound until the whole word appears'
        isCorrect: false
        rationale: >-
          Reinforcing the current level indefinitely maintains it rather than
          moving it. Shaping requires the criterion to advance.
      - id: b
        text: 'Reinforce responses closer to the target and stop reinforcing the previous approximation'
        isCorrect: true
        rationale: >-
          Shaping works by differential reinforcement of successive
          approximations: the criterion moves and the earlier form stops being
          reinforced.
      - id: c
        text: 'Reinforce every vocalisation the learner makes'
        isCorrect: false
        rationale: >-
          Reinforcing everything removes the differential part, and the response
          drifts rather than approaching the target.
      - id: d
        text: 'Withhold reinforcement entirely until the full word occurs'
        isCorrect: false
        rationale: >-
          Waiting for the terminal response is not shaping. If the learner could
          produce it, shaping would not be needed.
    explanation: >-
      Shaping is differential reinforcement of successive approximations. Both halves
      matter: reinforcing the closer form and no longer reinforcing the earlier one.
      How quickly the criterion moves is set by the program and by the learner’s
      responding.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [shaping, differential-reinforcement-of-alternative-behavior, extinction, reinforcer]
    citations:
      - sourceId: skinner-1953
        useType: fact-reference
    attestation:
