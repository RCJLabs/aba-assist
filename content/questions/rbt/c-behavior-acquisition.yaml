  - id: rbt-c-chaining-backward
    credential: RBT
    taskRef: { credential: RBT, code: C.5 }
    type: single-best-answer
    stem: >-
      A task analysis for making toast has six steps. The program specifies backward
      chaining. Which step does the learner perform independently first?
    options:
      - id: a
        text: 'The first step'
        isCorrect: false
        rationale: >-
          That is forward chaining, which starts at the beginning of the sequence.
      - id: b
        text: 'The last step'
        isCorrect: true
        rationale: >-
          Backward chaining teaches the final step first, so every trial ends with
          the learner completing the chain and contacting the natural reinforcer.
      - id: c
        text: 'Whichever step is easiest'
        isCorrect: false
        rationale: >-
          That is neither forward nor backward chaining. The order in a chaining
          procedure follows the sequence rather than difficulty.
      - id: d
        text: 'All six steps at once'
        isCorrect: false
        rationale: >-
          That is total-task presentation, a third arrangement the program did not
          specify.
    explanation: >-
      Backward chaining teaches the last step first and works backward, so every trial
      finishes with the learner completing the chain. Forward chaining starts at the
      beginning; total task runs the whole sequence each time with prompting where
      needed.
    cognitiveLevel: recall
    difficulty: 2
    termRefs:
      [backward-chaining, forward-chaining, total-task-chaining, chaining, task-analysis]
    citations:
      - sourceId: cooper-heron-heward-2020
        useType: fact-reference
