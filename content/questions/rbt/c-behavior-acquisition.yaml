  - id: rbt-c-maintenance-schedule-thinning
    credential: RBT
    taskRef: { credential: RBT, code: C.9 }
    type: single-best-answer
    stem: >-
      A skill has just met its mastery criterion under continuous reinforcement. What
      change most supports it holding up outside teaching sessions?
    options:
      - id: a
        text: 'Increase the number of teaching trials per session'
        isCorrect: false
        rationale: >-
          More acquisition trials on a mastered skill adds practice the learner
          does not need and does not address whether it holds up where
          reinforcement is sparse.
      - id: b
        text: 'Thin reinforcement gradually toward the schedule the natural setting provides'
        isCorrect: true
        rationale: >-
          Continuous reinforcement is a teaching arrangement. Ordinary settings
          reinforce intermittently, so thinning is what closes the gap between the
          two.
      - id: c
        text: 'Stop reinforcing the skill immediately'
        isCorrect: false
        rationale: >-
          Abrupt removal is extinction rather than thinning, and responding
          typically falls away rather than persisting.
      - id: d
        text: 'Change the instruction so it is harder to understand'
        isCorrect: false
        rationale: >-
          Making the instruction unclear tests something other than the skill and
          would reduce responding for the wrong reason.
    explanation: >-
      Skills taught under continuous reinforcement often disappear where reinforcement
      is thin, which is most places. Gradual thinning toward a schedule resembling the
      natural environment is the standard approach to maintenance, and it happens
      after mastery rather than during acquisition.
    cognitiveLevel: application
    difficulty: 3
    termRefs:
      [
        maintenance,
        schedule-thinning,
        continuous-reinforcement,
        intermittent-reinforcement,
        generalization
