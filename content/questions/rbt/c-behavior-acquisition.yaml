  - id: rbt-c-net-vs-dtt-choice
    credential: RBT
    taskRef: { credential: RBT, code: C.4 }
    type: single-best-answer
    stem: >-
      A program calls for naturalistic teaching of requesting. The learner reaches
      toward a container they cannot open. What does the arrangement ask the
      technician to do?
    options:
      - id: a
        text: 'Move to a table and run ten massed trials on requesting'
        isCorrect: false
        rationale: >-
          That converts a naturalistic opportunity into a discrete trial
          arrangement the programme did not call for.
      - id: b
        text: 'Use the learner’s own interest in the container as the teaching opportunity'
        isCorrect: true
        rationale: >-
          Naturalistic teaching follows the learner’s motivation and teaches in
          the moment it occurs, which is what makes the reinforcer directly
          relevant.
      - id: c
        text: 'Wait until the learner stops reaching, then present an unrelated instruction'
        isCorrect: false
        rationale: >-
          Waiting out the motivation discards the opportunity the arrangement is
          built around.
      - id: d
        text: 'Give the container to the learner without any teaching'
        isCorrect: false
        rationale: >-
          Delivering the item with no opportunity to respond removes the teaching
          trial entirely.
    explanation: >-
      Naturalistic teaching uses what the learner is already motivated by, so the
      consequence for responding is the thing they wanted rather than an arbitrary
      reinforcer. Which arrangement to use, and when, is specified by the written
      programme.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [naturalistic-teaching, incidental-teaching, motivating-operation, mand]
