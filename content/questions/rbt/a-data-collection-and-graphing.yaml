  - id: rbt-a-permanent-product-suits
    credential: RBT
    taskRef: { credential: RBT, code: A.3 }
    type: single-best-answer
    stem: >-
      Which target is best suited to permanent-product recording?
    options:
      - id: a
        text: 'Number of times the learner looks at a peer'
        isCorrect: false
        rationale: >-
          Looking leaves nothing behind. Once the moment has passed there is no
          lasting result to count, so it has to be observed as it happens.
      - id: b
        text: 'Number of maths problems completed on a worksheet'
        isCorrect: true
        rationale: >-
          The worksheet is the lasting result. It can be counted after the session
          by anyone, which also makes agreement between recorders easy to check.
      - id: c
        text: 'Duration of time spent out of seat'
        isCorrect: false
        rationale: >-
          Duration requires watching and timing. Nothing about it remains
          afterwards to be measured.
      - id: d
        text: 'Latency between an instruction and the first response'
        isCorrect: false
        rationale: >-
          Latency is a time between two events and can only be captured while both
          are happening.
    explanation: >-
      Permanent-product recording measures the lasting result of a behaviour rather
      than the behaviour itself. It is efficient and easy to check, but it only works
      where the behaviour reliably leaves something behind and where nothing else
      could have produced it.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [permanent-product, count, duration, latency]
