  - id: rbt-a-transfer-data-same-day
    credential: RBT
    taskRef: { credential: RBT, code: A.4 }
    type: single-best-answer
    stem: >-
      A technician records trial data on paper during sessions and enters it into the
      clinic system at the end of each week. What is the strongest reason to enter it
      the same day instead?
    options:
      - id: a
        text: 'Paper records may be discarded once entered'
        isCorrect: false
        rationale: >-
          Retention rules are set by the employer and the funder, and usually
          require the original to be kept regardless of when it was entered.
      - id: b
        text: 'It reduces the number of trials that must be run'
        isCorrect: false
        rationale: >-
          Entry timing has no effect on how many teaching trials the program
          specifies.
      - id: c
        text: 'It makes the graph look tidier'
        isCorrect: false
        rationale: >-
          Appearance is not a reason. The graph plots the same values whenever
          they are entered.
      - id: d
        text: 'Decisions get made on data that are days out of date, and detail is lost'
        isCorrect: true
        rationale: >-
          A supervisor reviewing on Tuesday sees last week. Anything needing a
          note from memory — a disruption, an illness, a missed block — has faded
          by Friday.
    explanation: >-
      Data entered late are data nobody can act on. The clinical cost is decisions
      made on a stale picture; the accuracy cost is the contextual detail that only
      exists in somebody’s memory for a few hours. Both are reasons the transfer
      belongs at the end of the session rather than the end of the week.
    cognitiveLevel: analysis
    difficulty: 2
    termRefs: [data-sheet, session-note, treatment-integrity]
    citations:
