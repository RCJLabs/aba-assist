  - id: rbt-a-definition-onset-offset
    credential: RBT
    taskRef: { credential: RBT, code: A.5 }
    type: single-best-answer
    stem: >-
      A definition of "screaming" reads: "any vocalisation above conversational
      volume". A technician finds that some sessions produce wildly different duration
      totals depending on who recorded. What is the definition most clearly missing?
    options:
      - id: a
        text: 'An example from the learner’s history'
        isCorrect: false
        rationale: >-
          An example can help train a recorder, but the disagreement here is
          structural: the definition itself gives no boundary between instances.
      - id: b
        text: 'The name of the person who wrote it'
        isCorrect: false
        rationale: >-
          Authorship is a documentation matter. It has no bearing on whether two
          people applying the definition would record the same thing.
      - id: c
        text: 'A statement of why the behaviour occurs'
        isCorrect: false
        rationale: >-
          Function is established through assessment and is not part of a
          measurement definition. Adding it would not help two recorders agree on
          when to start a timer.
      - id: d
        text: 'A rule for when one instance ends and the next begins'
        isCorrect: true
        rationale: >-
          Without an offset rule and a minimum gap, one recorder scores a two-
          minute episode and another scores nine short ones. That is where the
          duration totals diverge.
    explanation: >-
      A usable definition needs onset and offset criteria. For duration and for count
      alike, the question "when does one instance stop and the next start" has to have
      an answer in the definition, or the same session yields different data depending
      on who held the clipboard.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [operational-definition, duration, interobserver-agreement]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
    attestation:
      originalProse: true
      noVerbatimSource: true
