  - id: rbt-a-trend-in-baseline-limits
    credential: RBT
    taskRef: { credential: RBT, code: A.7 }
    type: single-best-answer
    stem: >-
      A baseline rises steadily from 2 to 9 over nine sessions. Teaching then begins
      and the data continue to rise at about the same rate. What should the technician
      report about what the graph shows?
    options:
      - id: a
        text: 'The teaching had no effect'
        isCorrect: false
        rationale: >-
          The graph does not show that either. It shows a comparison that cannot
          distinguish the two explanations, which is different from showing that
          one of them is false.
      - id: b
        text: 'The baseline was too short'
        isCorrect: false
        rationale: >-
          Length is not the problem — nine sessions is a reasonable baseline. The
          problem is the direction it was already heading when the condition
          changed.
      - id: c
        text: 'The teaching produced a clear increase'
        isCorrect: false
        rationale: >-
          The increase was already happening before teaching began, at the same
          rate. The graph cannot separate teaching from whatever was already
          producing the rise.
      - id: d
        text: 'The learner improved, and this graph cannot show why'
        isCorrect: true
        rationale: >-
          Both statements are true and both matter. Improvement is real;
          attributing it to the teaching is not supported when the baseline was
          already moving that way.
    explanation: >-
      A baseline moving in the direction treatment is meant to produce makes a later
      improvement uninterpretable, because the same result would have occurred anyway.
      Saying so plainly is a finding, not a failure. Decisions about extending a
      baseline belong to the supervising analyst.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [trend, baseline, visual-analysis, functional-relation]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation:
      originalProse: true
