  - id: rbt-a-read-trend-flat-baseline
    credential: RBT
    taskRef: { credential: RBT, code: A.7 }
    type: single-best-answer
    stem: >-
      Across eight baseline sessions a learner’s independent responses are 3, 2, 4, 3,
      2, 3, 4, 3. How should a technician describe this baseline to their supervisor?
    options:
      - id: a
        text: 'A decreasing trend'
        isCorrect: false
        rationale: >-
          A decreasing trend would show the values falling across the condition.
          The last session is the same as the first.
      - id: b
        text: 'An increasing trend'
        isCorrect: false
        rationale: >-
          An increasing trend means the data are moving upward across the
          condition. These values return to the same range every session with no
          direction.
      - id: c
        text: 'Stable, with no trend'
        isCorrect: true
        rationale: >-
          The values vary within a narrow band and end where they started. That is
          what makes a baseline usable as a comparison for whatever comes next.
      - id: d
        text: 'Highly variable'
        isCorrect: false
        rationale: >-
          Variability this small — two to four — is ordinary session-to-session
          noise rather than the kind of swing that makes an average meaningless.
    explanation: >-
      Reading a graph starts with level, trend and variability. Here the level sits
      around three, there is no direction, and the spread is narrow. A flat baseline
      is the condition under which a later change is interpretable, which is why it is
      worth being able to name.
    cognitiveLevel: application
    difficulty: 2
    termRefs: [trend, level, baseline, variability, visual-analysis]
    citations:
      - sourceId: kazdin-2011
        useType: fact-reference
    attestation:
      originalProse: true
      noVerbatimSource: true
