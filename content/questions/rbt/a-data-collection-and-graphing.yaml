  - id: rbt-a-ioa-disagreement-meaning
    credential: RBT
    taskRef: { credential: RBT, code: A.8 }
    type: single-best-answer
    stem: >-
      Two technicians independently record the same session and their counts differ by
      a third. What does this most directly indicate?
    options:
      - id: a
        text: 'One technician should stop collecting data'
        isCorrect: false
        rationale: >-
          The disagreement locates a problem in the system rather than in a
          person, and the fix is normally a clearer definition or more training.
      - id: b
        text: 'The learner behaved inconsistently'
        isCorrect: false
        rationale: >-
          Both observers watched the same session. A difference between their
          records is about the measurement, not about the learner.
      - id: c
        text: 'The measurement system is not producing dependable data yet'
        isCorrect: true
        rationale: >-
          Disagreement of that size usually means the definition, the recording
          procedure or the training is not yet good enough for the numbers to be
          trusted.
      - id: d
        text: 'The intervention is not working'
        isCorrect: false
        rationale: >-
          Nothing here is about the effect of an intervention. It is about whether
          the data describing it can be believed.
    explanation: >-
      Interobserver agreement checks the measurement, not the learner and not the
      intervention. Low agreement means the numbers are not yet dependable, and the
      response is to repair the definition or the training before any conclusion is
      drawn from the data.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [interobserver-agreement, operational-definition, observer-drift, treatment-integrity]
