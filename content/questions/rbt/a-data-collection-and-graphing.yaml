  - id: rbt-a-continuous-matches-program
    credential: RBT
    taskRef: { credential: RBT, code: A.1 }
    type: single-best-answer
    stem: >-
      A program asks for every instance of hand-raising to be recorded across a
      30-minute lesson. Which recording arrangement matches what the program asked
      for?
    options:
      - id: a
        text: 'Record whether it happened at all in each five-minute block'
        isCorrect: false
        rationale: >-
          That is partial-interval recording. It produces a number of intervals,
          not a count of responses, and it usually overestimates duration.
      - id: b
        text: 'Record the first and last occurrence only'
        isCorrect: false
        rationale: >-
          This captures neither a count nor a duration. It says when the behaviour
          bracketed the session, which answers a question nobody asked.
      - id: c
        text: 'Count each occurrence as it happens for the whole 30 minutes'
        isCorrect: true
        rationale: >-
          Recording every instance across the whole observation is continuous
          measurement, which is what "every instance" requires.
      - id: d
        text: 'Check at the end of each minute and record whether it is happening then'
        isCorrect: false
        rationale: >-
          That is momentary time sampling. It estimates the proportion of moments
          rather than counting instances, so it cannot answer "how many".
    explanation: >-
      Continuous measurement records every occurrence; discontinuous measurement
      samples. They answer different questions and are not interchangeable, so the
      arrangement has to match what the written program specified rather than what is
      easiest to run.
    cognitiveLevel: application
    difficulty: 2
    termRefs:
      [
        continuous-measurement,
        discontinuous-measurement,
        count,
        momentary-time-sampling,
        partial-interval-recording
      ]
