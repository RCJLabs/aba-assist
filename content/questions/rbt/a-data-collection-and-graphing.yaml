  - id: rbt-a-observer-drift
    credential: RBT
    taskRef: { credential: RBT, code: A.8 }
    type: single-best-answer
    stem: >-
      A technician has recorded the same target for six months. Agreement with a
      second observer was high at the start and is now poor, although the written
      definition has not changed. What is the most likely explanation?
    options:
      - id: a
        text: 'The experienced technician’s application of the definition has gradually shifted'
        isCorrect: true
        rationale: >-
          Observer drift is exactly this: a definition applied slightly more
          loosely each month until the record no longer matches the written rule.
          It is gradual and invisible from the inside.
      - id: b
        text: 'The data sheet has too many columns'
        isCorrect: false
        rationale: >-
          A cluttered sheet causes errors from the first day rather than a slow
          divergence over six months.
      - id: c
        text: 'The second observer is undertrained'
        isCorrect: false
        rationale: >-
          Possible, but the pattern — good agreement that decays over time with
          the same person — is the signature of drift in the experienced recorder.
      - id: d
        text: 'The learner’s behaviour has changed topography'
        isCorrect: false
        rationale: >-
          Possible, but it would affect both observers similarly. A gap that opens
          between two recorders points at the recording rather than the behaviour.
    explanation: >-
      Observer drift is the slow, unnoticed change in how a definition is applied.
      Periodic agreement checks exist to catch it, because the person drifting is by
      definition unaware of it and their data look exactly as confident as they did
      before.
    cognitiveLevel: analysis
    difficulty: 4
    termRefs: [observer-drift, interobserver-agreement, operational-definition]
    citations:
      - sourceId: johnston-pennypacker-2020
        useType: fact-reference
