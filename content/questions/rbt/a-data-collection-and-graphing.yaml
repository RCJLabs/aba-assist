  - id: rbt-a-permanent-product-limit
    credential: RBT
    taskRef: { credential: RBT, code: A.3 }
    type: single-best-answer
    stem: >-
      A technician records completed worksheets as a permanent product. Which
      circumstance most threatens the accuracy of that measure?
    options:
      - id: a
        text: 'The worksheet has ten problems rather than twenty'
        isCorrect: false
        rationale: >-
          The number of opportunities changes the denominator, which is handled by
          reporting a percentage rather than a raw count.
      - id: b
        text: 'The learner completes it faster than last week'
        isCorrect: false
        rationale: >-
          A change in speed is a result worth noticing, not a threat to the
          accuracy of the count.
      - id: c
        text: 'The worksheets are stored in a folder'
        isCorrect: false
        rationale: >-
          Storage is a documentation matter. It does not change whether the
          product reflects the learner’s behaviour.
      - id: d
        text: 'A parent helps the learner finish the worksheet after the session'
        isCorrect: true
        rationale: >-
          The product is then not a record of the learner’s responding. Permanent
          product only measures the behaviour when nothing else could have
          produced the same result.
    explanation: >-
      The central assumption of permanent-product recording is that the product could
      only have been produced by the behaviour being measured. Anything that breaks
      that assumption — help, sharing, a product carried over from another setting —
      makes the number wrong in a way the number itself does not reveal.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs: [permanent-product, treatment-integrity, reactivity]
    citations:
