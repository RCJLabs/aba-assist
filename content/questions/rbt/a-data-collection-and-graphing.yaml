  - id: rbt-a-whole-interval-bias
    credential: RBT
    taskRef: { credential: RBT, code: A.2 }
    type: single-best-answer
    stem: >-
      A program uses 30-second whole-interval recording for on-task behaviour. The
      learner is on task for most of each interval but glances away briefly in nearly
      all of them. How will the data compare with the true amount of on-task time?
    options:
      - id: a
        text: 'They will be accurate'
        isCorrect: false
        rationale: >-
          Whole-interval data are systematically low whenever the behaviour is
          interrupted, which is the situation described here.
      - id: b
        text: 'They will vary randomly around the true value'
        isCorrect: false
        rationale: >-
          The error is directional rather than random: it always goes the same
          way, which is what makes it a bias rather than noise.
      - id: c
        text: 'They will underestimate it'
        isCorrect: true
        rationale: >-
          Whole interval only scores an interval when the behaviour occupied all
          of it. A brief glance away costs the whole interval, so the score falls
          well below the true proportion.
      - id: d
        text: 'They will overestimate it'
        isCorrect: false
        rationale: >-
          Overestimation is the bias of partial-interval recording, where any
          occurrence scores the entire interval.
    explanation: >-
      Each sampling procedure is wrong in a known direction. Whole interval
      underestimates, partial interval overestimates, and momentary time sampling is
      usually closest. Knowing which direction applies is what stops a technician
      handing a supervisor a number meaning something other than it appears to.
    cognitiveLevel: analysis
    difficulty: 3
    termRefs:
      [
        whole-interval-recording,
        partial-interval-recording,
        momentary-time-sampling,
        discontinuous-measurement
      ]
    citations:
      - sourceId: johnston-pennypacker-2020
