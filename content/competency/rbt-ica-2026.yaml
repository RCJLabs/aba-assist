rules:
  - label: Who oversees it
    value: >-
      A certified analyst or assistant analyst who has completed the eight-hour supervision
      training takes responsibility for the assessment, signs it, and keeps the records.
      Parts of it may be delegated to an assistant assessor holding technician
      certification or higher.
    locator: Qualified Assessor(s) and Relationship Expectations, p. 1
  - label: Who may not assess you
    value: >-
      An assessor may not be related to you, may not be your subordinate, and may not be
      employed by you. Paying somebody for the assessment itself does not count as
      employing them. The person who delivered your forty-hour training may assess you.
    locator: Qualified Assessor(s) and Relationship Expectations, p. 1
  - label: Same organisation
    value: >-
      You, the assessor, and the organisation providing services to the client involved
      must all be connected by employment or contract, for the whole assessment and not
      only the parts involving a client.
    locator: Relationship Expectations, p. 1
  - label: When it happens
    value: >-
      After the forty-hour training is finished, and no more than ninety days before you
      submit your certification application.
    locator: Timing, p. 2
  - label: How it can be run
    value: >-
      Across one sitting or several, in person, live over the internet, or by the assessor
      watching recordings made specifically for the assessment.
    locator: Structure, p. 2
  - label: If a task does not go well
    value: >-
      The assessor may give corrective feedback and assess that task again on another day,
      repeating until you are competent. No corrective feedback is given during the
      assessment of a task that is being counted as the final one.
    locator: Administration, p. 2
  - label: Records
    value: >-
      The assessor initials each task, marks which method was used, and signs the
      attestation once every task is done. The completed form goes in with your
      application, on the official form rather than a copy, and the assessor keeps records
      for at least seven years.
    locator: Documentation, p. 2

