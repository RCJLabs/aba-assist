sourceId: bacb-rbt-ica-2026
countsVerified: true
officialText: null
officialTitle: null
officialUrl: null

ourOverview: >-
  The written examination is only half of what stands between a candidate and the
  credential. Before applying, they have to show an assessor that they can actually do
  nineteen things — most of them performed, some of them explained. It happens after the
  forty-hour training and within ninety days of applying, it can run across several
  sittings, and a task that does not go well can be retaught and assessed again another
  day. This page lists what is asked and points at the material for each, so the
  performance half can be prepared for rather than walked into.

sections:
  - id: measurement
    title: Measurement
    ourDescription: >-
      Taking data while the session is happening, and getting it onto the graph
      afterwards. All three can be shown with a client or acted in a role-play.
    sectionRule: null
    tasks:
      - number: 1
        label: Continuous Measurement
        ourSummary: >-
          Record every occurrence as it happens, using whichever continuous measure the
          programme names — a count, how long it lasted, how long the learner took to
          start, or the gap between one response and the next. What is being judged is
          whether the measure matches the definition and whether you can keep it up while
          also running the session.
        plainSummary: Take data on every occurrence, using the measure the programme asks for.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:A.1']
        termRefs:
          [
            continuous-measurement,
            frequency-and-rate,
            duration,
            latency,
            interresponse-time,
            operational-definition
          ]
        demonstration:
          - >-
            Say which dimension the programme asks for before you start, and set the sheet up
            for that one rather than for whatever is easiest to count.
          - >-
            Start and stop the clock at the points your definition names, not at the point an
            episode becomes obvious.
          - >-
            Record each instance as it happens rather than reconstructing the session from
            memory at the end.
          - >-
            Convert to the summary the programme uses, and label it with its unit.
        commonStops:
          - >-
            Treating a long continuous bout as one instance one session and as several the
            next, because the definition never said where an episode ends.
          - >-
            Leaving the timer running through a break, which inflates duration and is
            invisible afterwards.
          - >-
            Reporting a raw count when sessions vary in length, so the numbers cannot be
            compared with each other.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 2
        label: Discontinuous Measurement
        ourSummary: >-
          Run a sampling procedure — scoring whether the behaviour happened at any point in
          an interval, throughout the whole interval, or at the moment the interval ended.
          These estimate time rather than counting occurrences, and each one is biased in a
          known direction, which is the part an assessor is most likely to ask about.
        plainSummary: Run interval recording, and know which way each method is biased.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:A.2']
        termRefs:
          [
            discontinuous-measurement,
            partial-interval-recording,
            whole-interval-recording,
            momentary-time-sampling
          ]
        demonstration:
          - >-
            Name the system you are running, and what it tends to over- or under-estimate,
            before the first interval.
          - >-
            Use a cue you can hear or feel, and score at the moment the interval ends rather
            than when you next look up.
          - >-
            Score each interval against the written definition rather than against how busy
            the session felt.
          - >-
            Report the result as a percentage of intervals scored, and say so.
        commonStops:
          - >-
            Scoring momentary time sampling as though it were partial interval, by counting
            anything seen during the interval.
          - >-
            Missing intervals while delivering instruction, and filling them in from memory
            afterwards.
          - >-
            Describing the result as the proportion of time the behaviour occurred, which no
            interval system measures.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 3
        label: Data and Graphs
        ourSummary: >-
          Get the session's data into the recording system and bring the learner's graph up
          to date. That means transcribing without introducing errors, summarising as the
          programme asks — a rate, a percentage, an average — and plotting so that the
          phases and the condition changes stay readable.
        plainSummary: Enter the data and update the graph so it stays readable.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:A.4', 'RBT:A.6', 'RBT:A.7']
        termRefs: [data-sheet, line-graph, phase-change-line, percentage, visual-analysis]
        demonstration:
          - >-
            Transcribe the session's raw data without altering it, and check your totals
            against the sheet.
          - >-
            Summarise with the measure the programme names, and label it with its unit.
          - >-
            Plot every session on the correct point of the horizontal axis, including sessions
            with no responding.
          - >-
            Put a phase change line between the sessions where conditions changed, and do not
            join data across it.
        commonStops:
          - >-
            Leaving out a zero session, so a real result reads as a gap in recording.
          - >-
            Connecting data points across a phase change, which makes a condition change look
            like part of a trend.
          - >-
            Changing the vertical scale between updates, so the same data looks like a
            different result.
        officialText: null
        officialTitle: null
        officialUrl: null

  - id: assessment
    title: Assessment
    ourDescription: >-
      The two assessment activities a technician carries out rather than designs. Both can
      be shown with a client or acted.
    sectionRule: null
    tasks:
      - number: 4
        label: Preference Assessments
        ourSummary: >-
          Run a preference assessment in the format the programme names, and record what
          the learner chose. The formats differ in what they tell you and how long they
          take, so knowing which one you are running, and why that one, matters as much as
          running it smoothly.
        plainSummary: Run a preference assessment the way the programme specifies, and record it.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:B.1']
        termRefs:
          [
            preference-assessment,
            paired-stimulus-preference-assessment,
            multiple-stimulus-without-replacement,
            multiple-stimulus-with-replacement,
            free-operant-preference-assessment,
            single-stimulus-preference-assessment
          ]
        demonstration:
          - >-
            Say which format you are running and why that one, before you start.
          - >-
            Present the array the way the format specifies, including what happens to an item
            once it is chosen.
          - >-
            Record each selection as it happens, along with where the items were placed.
          - >-
            Finish with a ranking or an approach record in a form the supervisor can use.
        commonStops:
          - >-
            Letting the learner take a second item before the trial is scored, which loses the
            selection.
          - >-
            Presenting items in the same position every trial, so the record shows a position
            bias rather than a preference.
          - >-
            Calling the top-ranked item a reinforcer without any test of whether it
            strengthens behaviour.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 5
        label: ABC Data
        ourSummary: >-
          Record what came before the behaviour, what the behaviour was, and what followed
          it — in terms another person could have recorded the same way. The common failure
          is writing an interpretation into the antecedent column, which turns the record
          into a conclusion before anybody has analysed anything.
        plainSummary: Write down what came before, what they did, and what came next.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:B.3', 'RBT:A.5']
        termRefs:
          [abc-recording, three-term-contingency, operational-definition, objective-language]
        demonstration:
          - >-
            Record what happened immediately before, what the behaviour was, and what
            followed, for each instance.
          - >-
            Write the antecedent as an observable event rather than as a reason.
          - >-
            Make the entry close in time to the event rather than reconstructing the sequence
            later.
          - >-
            Leave function out of the record: you are recording a sequence, not drawing a
            conclusion from it.
        commonStops:
          - >-
            Writing something like "wanted attention" in the antecedent column, which records
            a conclusion as an observation.
          - >-
            Recording only the memorable episodes, which makes the sample unrepresentative of
            the day.
          - >-
            Merging several instances into one entry because they happened close together.
        officialText: null
        officialTitle: null
        officialUrl: null

  - id: acquisition-and-reduction
    title: Skill Acquisition and Behavior Reduction
    ourDescription: >-
      The teaching and behaviour-change procedures a technician runs. This is the largest
      section and the one with the most demanding evidence requirement.
    sectionRule: >-
      Three of the nine tasks in this section have to be demonstrated with a client rather
      than acted in a role-play. Which three is your choice, so it is worth deciding early
      which procedures your current clients will actually give you the chance to show.
    tasks:
      - number: 6
        label: Discrete-Trial Teaching
        ourSummary: >-
          Run structured teaching trials: a clear instruction, room for the learner to
          respond, the planned consequence, and a gap before the next trial. Pacing and
          consistency are what an assessor watches, because those are what make the data
          from one trial comparable with the next.
        plainSummary: Run teaching trials with a clear instruction, a response and a planned consequence.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.3']
        termRefs:
          [
            discrete-trial-training,
            three-term-contingency,
            error-correction,
            trials-to-criterion
          ]
        demonstration:
          - >-
            Set out the materials and have the learner's attention before the instruction goes
            in.
          - >-
            Deliver the instruction once, in the wording the programme uses.
          - >-
            Wait the response interval the programme allows before prompting or scoring.
          - >-
            Deliver the consequence immediately, and record the trial before setting up the
            next one.
        commonStops:
          - >-
            Repeating the instruction when nothing happens, which teaches the learner to wait
            for the second one.
          - >-
            Delivering the reinforcer a few seconds late, once the learner has already moved
            on to something else.
          - >-
            Scoring a prompted response as independent because the prompt was a small one.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 7
        label: Naturalistic Teaching
        ourSummary: >-
          Teach inside ordinary activity, using what the learner is already interested in
          as the occasion to teach and as the reinforcer. It looks less like teaching than
          a trial does, which is exactly why an assessor will be watching for whether the
          teaching targets are actually being run.
        plainSummary: Teach in the flow of play and routine, using what the learner already wants.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.4']
        termRefs: [naturalistic-teaching, incidental-teaching, mand, motivating-operation]
        demonstration:
          - >-
            Follow what the learner is already interested in and use that as the opportunity.
          - >-
            Wait for, or arrange, a moment where the target response is genuinely useful to
            them.
          - >-
            Deliver the natural consequence — the item, the activity, the help — rather than
            an unrelated reinforcer.
          - >-
            Record the opportunity and the response without stopping the activity to do it.
        commonStops:
          - >-
            Turning it into discrete trials in a play area by running the same instruction
            over and over.
          - >-
            Waiting for a better response until the learner has lost interest in the item
            entirely.
          - >-
            Losing the data because recording was left until the end of the session.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 8
        label: Chaining
        ourSummary: >-
          Teach a multi-step skill from its written step list, linking the steps in the
          direction the programme specifies — forward, backward, or the whole chain each
          time. The task analysis is the programme; following it as written is the skill
          being assessed.
        plainSummary: Teach a multi-step skill from its step list, in the direction specified.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.5']
        termRefs:
          [chaining, task-analysis, forward-chaining, backward-chaining, total-task-chaining]
        demonstration:
          - >-
            Work from the written task analysis, in front of you, rather than from memory.
          - >-
            Use the chaining format the programme names, and be able to say which one it is.
          - >-
            Prompt at the level the programme specifies for the step being taught, not for the
            whole chain.
          - >-
            Score each step on its own rather than scoring the chain as a single response.
        commonStops:
          - >-
            Completing a step for the learner when they hesitate, and then scoring it as
            independent.
          - >-
            Running total task where the programme specifies backward chaining, or the
            reverse.
          - >-
            Dropping a step because the analysis was not in front of you.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 9
        label: Shaping
        ourSummary: >-
          Reinforce successively closer versions of a target response, and move the
          criterion as the learner meets it. Moving too slowly stalls progress and moving
          too quickly loses the response altogether, so the judgement about when to shift
          is the thing being watched.
        plainSummary: Reinforce closer and closer attempts, moving the bar as the learner meets it.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.10']
        termRefs: [shaping, differential-reinforcement-of-alternative-behavior, reinforcer]
        demonstration:
          - >-
            State the current criterion and the target response before you begin.
          - >-
            Reinforce responses that meet the criterion, and not responses below it.
          - >-
            Raise the criterion once responding at the current one is steady, rather than
            after a set number of trials.
          - >-
            Go back a step if responding drops out, and record that you did.
        commonStops:
          - >-
            Reinforcing every attempt, which keeps the current approximation and never reaches
            the target.
          - >-
            Raising the criterion after one good response, and losing the behaviour.
          - >-
            Not being able to say what the current criterion is when you are asked.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 10
        label: Discrimination Training
        ourSummary: >-
          Teach the learner to respond to the right stimulus and not to others, by
          reinforcing in its presence and withholding in its absence. Knowing which
          stimulus is meant to control the response — and noticing when something else has
          quietly taken over — is what separates running this from going through it.
        plainSummary: Teach responding to the right cue and not to others.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.6']
        termRefs: [discrimination-training, discriminative-stimulus, s-delta, stimulus-control]
        demonstration:
          - >-
            Present the stimuli the programme names, with their positions varied across
            trials.
          - >-
            Reinforce responding in the presence of the target stimulus and not in its
            absence.
          - >-
            Run the error-correction procedure the programme specifies, the same way each
            time.
          - >-
            Record which stimulus was presented as well as whether the response was correct.
        commonStops:
          - >-
            Leaving the correct item in the same place, so the learner responds by position
            instead.
          - >-
            Looking at or leaning towards the correct item, which quietly becomes the stimulus
            in control.
          - >-
            Changing the error-correction procedure part-way through because the learner is
            struggling.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 11
        label: Prompting
        ourSummary: >-
          Deliver the prompts the programme names and fade them the way it specifies. Both
          halves are assessed. Prompting reliably is straightforward; fading on schedule is
          where prompt dependence comes from when it is skipped, and it is easy to skip
          without noticing.
        plainSummary: Use the prompts the programme names, and fade them as it says.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.7']
        termRefs:
          [
            prompt,
            prompt-hierarchy,
            prompt-fading,
            least-to-most-prompting,
            most-to-least-prompting,
            time-delay,
            transfer-of-stimulus-control
          ]
        demonstration:
          - >-
            Name the prompt hierarchy the programme uses and where this learner currently sits
            in it.
          - >-
            Deliver the prompt at the level specified, not at the level that guarantees a
            correct response.
          - >-
            Fade as the plan directs, and record the prompt level used on every trial.
          - >-
            Transfer control back to the natural stimulus before scoring anything as
            independent.
        commonStops:
          - >-
            Recording only correct or incorrect, with no prompt level, so nobody can see
            whether fading is happening.
          - >-
            Adding a small verbal cue on top of the specified prompt without noticing you are
            doing it.
          - >-
            Staying at one prompt level for weeks because it reliably produces correct
            responses.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 12
        label: Token Systems
        ourSummary: >-
          Run a points or tokens arrangement as written: what earns a token, what tokens
          buy, and when the exchange happens. Delivering tokens is the easy part; holding
          to the written exchange rules under pressure from the learner is the part that
          gets assessed.
        plainSummary: Run a token system as written — what earns tokens, and what they buy.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:C.11']
        termRefs: [token-economy, conditioned-reinforcer, generalized-conditioned-reinforcer]
        demonstration:
          - >-
            Deliver tokens immediately and contingently, for the behaviour the programme
            names.
          - >-
            Keep to the exchange schedule the programme specifies rather than stretching it
            for convenience.
          - >-
            Let the learner choose from the backup items at exchange.
          - >-
            Record tokens earned and exchanges made, not only the end-of-session total.
        commonStops:
          - >-
            Delaying exchange to the end of the week, which strips the tokens of the value
            they depend on.
          - >-
            Taking back tokens already earned, which is a different procedure with its own
            authorisation requirements.
          - >-
            Running a single backup item, which stops working the moment the learner has had
            enough of it.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 13
        label: Crisis and Emergency Procedures
        ourSummary: >-
          Follow the crisis procedure your employer and the learner's plan set out. This is
          the one task on the list that this app does not prepare you for and will not try
          to: crisis and physical-management procedures are employer-specific, require
          certified hands-on training, and cannot be learned from reading. What you can
          bring here is your own organisation's protocol, the plan itself, and the training
          you were certified in. This task also accepts an interview.
        plainSummary: Follow your employer's crisis protocol. This app does not teach that.
        methods: [with-a-client, role-play, interview]
        taskRefs: ['RBT:D.7']
        termRefs: [behavior-intervention-plan, incident-report, least-restrictive-alternative]
        consultYourPolicy: true
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 14
        label: One of three behaviour-change procedures
        ourSummary: >-
          A single task satisfied by demonstrating any one of three procedures. That makes
          it a choice worth making deliberately rather than preparing all three to the same
          depth — pick the one your current clients and programmes will actually give you a
          clean opportunity to show.
        plainSummary: Show any one of three. You choose which one.
        methods: [with-a-client, role-play]
        taskRefs: ['RBT:D.2', 'RBT:D.3', 'RBT:D.4']
        termRefs: [function-of-behavior]
        alternatives:
          - label: Antecedent Interventions
            ourSummary: >-
              Change what is in place before the behaviour — free access, a changed
              instruction, a warning before a transition — so that the behaviour becomes
              less likely rather than being dealt with after it happens.
            termRefs:
              [
                antecedent-intervention,
                motivating-operation,
                establishing-operation,
                abolishing-operation,
                noncontingent-reinforcement,
                high-probability-request-sequence
              ]
          - label: Differential Reinforcement
            ourSummary: >-
              Reinforce the behaviour the plan names — an alternative, an incompatible one,
              or the absence of the target — while the target behaviour stops producing
              what it used to.
            termRefs:
              [
                differential-reinforcement-of-alternative-behavior,
                differential-reinforcement-of-incompatible-behavior,
                differential-reinforcement-of-other-behavior,
                replacement-behavior
              ]
          - label: Extinction
            ourSummary: >-
              Withhold the consequence that has been maintaining the behaviour, exactly as
              the plan specifies, and keep going through the increase in rate or intensity
              that usually follows.
            termRefs: [extinction, extinction-burst, escape-extinction, sensory-extinction]
        demonstration:
          - >-
            Say which of the three you are demonstrating, and why that one suits this learner
            and this programme.
          - >-
            Run it as the plan specifies, including the parts that are inconvenient.
          - >-
            Keep going through the period where things get worse before they get better, where
            the plan says to.
          - >-
            Record what you did, not only what the learner did.
        commonStops:
          - >-
            Choosing the procedure that is easiest to talk about rather than the one you can
            show cleanly.
          - >-
            Stopping extinction at the first increase in intensity, which reinforces the
            stronger form of the behaviour.
          - >-
            Describing one procedure accurately and then running a different one.
        officialText: null
        officialTitle: null
        officialUrl: null

  - id: professionalism
    title: Professionalism and Requirements
    ourDescription: >-
      Five tasks about how the role is conducted rather than how a procedure is run. Four
      of the five are interviews, which means the preparation is being able to say it
      clearly and give an example — not recognise it in a list.
    sectionRule: null
    tasks:
      - number: 15
        label: Session Notes
        ourSummary: >-
          Write up what happened in a session, factually and within whatever your employer
          and the funder require. The skill being assessed is describing rather than
          concluding, and the checklist and phrasing guide in this app's tools are built
          for exactly this.
        plainSummary: Write a session note that describes what happened rather than what you thought.
        methods: [with-a-client, role-play, interview]
        taskRefs: ['RBT:E.4', 'RBT:A.5']
        termRefs: [session-note, objective-language, operational-definition, permanent-product]
        demonstration:
          - >-
            Include every element your employer's format requires, checked off rather than
            remembered.
          - >-
            Describe behaviour in observable terms with times, rather than in terms of mood or
            intent.
          - >-
            Record what you did as well as what the learner did.
          - >-
            Write it close to the session rather than at the end of the week.
        commonStops:
          - >-
            Writing that the learner had a good day, with nothing measurable behind it.
          - >-
            Recording a conclusion about why a behaviour happened, which is not a technician's
            to record.
          - >-
            Leaving out the start and end times or the service location, which the format
            requires.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 16
        label: Client Dignity
        ourSummary: >-
          Give examples of how you maintain the learner's dignity. An interview task, so
          prepare examples rather than a definition — how you speak about somebody in front
          of them, how a refusal is treated, how private matters stay private, how choice
          is preserved where the plan allows it.
        plainSummary: Have real examples ready of how you treat the learner with respect.
        methods: [interview]
        taskRefs: ['RBT:F.1', 'RBT:F.10']
        termRefs: [dignity, assent, confidentiality, cultural-humility]
        demonstration:
          - >-
            Give a concrete example from your own practice rather than a definition.
          - >-
            Name something you actually changed in how you work because of it.
          - >-
            Put the learner's preferences and choices in the example, not only politeness.
          - >-
            Say what you would do if a colleague's practice fell short of it.
        commonStops:
          - >-
            Answering with a definition of dignity and stopping there.
          - >-
            Giving an example that is really about being pleasant rather than about choice and
            respect.
          - >-
            Having no answer at all for what you would do about somebody else's conduct.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 17
        label: Professional Boundaries
        ourSummary: >-
          Give examples of keeping professional boundaries. Again an interview, so have
          cases ready — gifts, social media, a family you know outside work, a request that
          sits outside your role — and be able to say what you did and why.
        plainSummary: Have real examples ready of where you drew a line at work.
        methods: [interview]
        taskRefs: ['RBT:F.7', 'RBT:F.8', 'RBT:F.6']
        termRefs:
          [dual-relationship, conflict-of-interest, public-statement, scope-of-practice]
        demonstration:
          - >-
            Name specific boundaries: gifts, social contact, second relationships,
            information.
          - >-
            Give a real example of a request you would decline, and the words you would use.
          - >-
            Say who you would tell about it, and how soon.
          - >-
            Separate what you decide yourself from what you take to your supervisor.
        commonStops:
          - >-
            Talking only about social media, which is one boundary among several.
          - >-
            Saying you would decline without being able to say how, which is the part that is
            hard in the moment.
          - >-
            Treating a boundary as a personal judgement call rather than a requirement of the
            code.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 18
        label: Supervision Requirements
        ourSummary: >-
          Describe the supervision standards that apply to you — how much, of what kind,
          with whom, and what happens if a month falls short. These are specific published
          figures rather than a general principle, and this app's supervision tracker is
          built on the same requirements.
        plainSummary: Describe the supervision rules that apply to you, with the actual figures.
        methods: [interview]
        taskRefs: ['RBT:F.3', 'RBT:F.4']
        termRefs: [supervision, competency-assessment, continuity-of-care]
        demonstration:
          - >-
            State the supervision requirement that applies to you in numbers, not in general
            terms.
          - >-
            Say what counts towards it and what does not.
          - >-
            Say what happens if a month falls short, and what you would do about it.
          - >-
            Say where your supervision is documented and who holds that record.
        commonStops:
          - >-
            Knowing supervision is required without knowing the percentage or the contact
            requirement.
          - >-
            Assuming the supervisor tracks it, when meeting the requirement is yours.
          - >-
            Having no answer for a month that has already fallen short.
        officialText: null
        officialTitle: null
        officialUrl: null
      - number: 19
        label: Seeking Clinical Direction
        ourSummary: >-
          Describe at least one situation where you would go to your supervisor for
          clinical direction. The strongest answer is a real one with the reasoning
          attached — what you saw, why it was not yours to decide, and what you did while
          waiting for an answer.
        plainSummary: Describe a situation where you would ask your supervisor, and why.
        methods: [interview]
        taskRefs: ['RBT:E.2', 'RBT:F.2']
        termRefs: [scope-of-practice, supervision, behavior-intervention-plan]
        demonstration:
