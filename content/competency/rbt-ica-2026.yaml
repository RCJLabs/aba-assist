          - >-
            Name the line: implementing and recording is yours, changing the plan is not.
          - >-
            Say how quickly you would raise different kinds of thing, and by what route.
          - >-
            Say what you do in the meantime, while you are waiting for an answer.
        commonStops:
          - >-
            Giving an example where you made the change and told the supervisor afterwards.
          - >-
            Having no answer for what to do while waiting, which is where most of the risk
            sits.
          - >-
            Describing the supervisor as somebody to ask rather than the person responsible
