# Board Certified Behavior Analyst — certification facts.
#
# Read from the BCBA Handbook (version updated 06/2026) on 2026-09-14 and restated in
# our own words. Where the handbook gives both the current rules and the 2027 rules,
# both are listed. The handbook's text is not reproduced.

id: bcba
credential: BCBA
label: Board Certified Behavior Analyst
issuer: BACB
handbookSourceId: bacb-bcba-handbook-2026
handbookVersion: '06/2026'
officialUrl: https://www.bacb.com/bcba/
outlineId: bcba-tco-6

ourOverview: >-
  A graduate-level certification for independent practitioners of behavior analysis.
  It requires a qualifying degree and behavior-analytic content, a long period of
  supervised fieldwork, and a four-hour examination, and it is maintained with
  continuing education on a two-year cycle. Certified analysts may supervise
  technicians, assistant analysts and trainees.

sections:
  - id: pathways
    title: Eligibility pathways
    ourNote: >-
      Every pathway asks for four things: a degree, coursework in the subject, fieldwork
      under supervision, and the examination. Most candidates use pathway 1 or 2. Pathways 3 and 4 are not
      offered under the 2027 requirements.
    items:
      - label: Pathway 1
        value: >-
          A degree from a program accredited or recognized by the field's accrediting
          bodies, which satisfies both the degree and the coursework requirement.
        locator: Pathway 1, p. 7
      - label: Pathway 2
        value: >-
          An acceptable graduate degree plus behavior-analytic graduate coursework —
          within 10 years of applying, passed with a C or better, at an institution with
          a designated program contact who attests to it.
        locator: Pathway 2; Behavior-Analytic Coursework, pp. 8–9
      - label: Pathway 3 (until 2027)
        value: >-
          An acceptable graduate degree plus a faculty record of teaching at least five
          sections of graduate behavior-analytic coursework and research.
        locator: Pathway 3, p. 10
      - label: Pathway 4 (until 2027)
        value: >-
          An acceptable doctoral degree plus ten years of postdoctoral experience, then
          500 hours of supervised fieldwork.
        locator: Pathway 4, p. 12

  - id: fieldwork
    title: Supervised fieldwork
    ourNote: >-
      Hours can only start once you have a qualified supervisor, a signed contract, and
      (for pathways 1 and 2) have begun qualifying coursework. All hours must be
      finished within five continuous years.
    items:
      - label: Total hours
        value: >-
          2,000 hours of Supervised Fieldwork, or 1,500 hours of Concentrated Supervised
          Fieldwork, or a mix (concentrated hours count 1.33 times toward the 2,000 total).
        locator: Hour Requirements, p. 15; Adjusting and Documenting Fieldwork Hours, p. 23
      - label: Per month
        value: >-
          Between 20 and 130 hours in each calendar month (20 to 160 under the 2027
          requirements).
        locator: Accrual of Fieldwork, p. 16; 2027 Eligibility Requirements, p. 28
      - label: Supervision amount
        value: >-
          At least 5% of hours each month for Supervised Fieldwork and 10% for
          Concentrated (7.5% concentrated under the 2027 requirements).
        locator: Overview of Fieldwork Requirements, p. 14
      - label: Contacts and observation
        value: >-
          At least 4 supervisor contacts per month (6 for concentrated) and at least one
          observation of you with a client. The 2027 rules set the observation at 60
          minutes cumulative per month (90 for concentrated).
        locator: Overview of Fieldwork Requirements, pp. 14 and 28
      - label: Individual and unrestricted
        value: >-
          At least half of supervised hours must be individual, and at least 60% of all
          fieldwork must be unrestricted activity — the work an analyst does, not direct
          program delivery.
        locator: Overview of Fieldwork Requirements, p. 14
      - label: Who may supervise
        value: >-
          An active analyst in good standing, certified for at least a year and meeting
          the supervision continuing-education requirement — or certified for under a year
          and taking monthly consultation from someone qualified to act as a consulting
          supervisor.
        locator: Supervisor qualifications, p. 13
      - label: What does not count
        value: >-
          Conferences, coursework and homework, meetings with little behavior-analytic
          content, non-behavioral interventions, administrative work, non-behavioral
          trainings such as crisis management or CPR, podcasts, and role play unrelated
          to a client.
        locator: Unacceptable Activities, p. 17
      - label: Documentation
        value: >-
          Monthly and final verification forms, with an audit log and supervision
          contract available if audited.
        locator: Documentation of Fieldwork, p. 15

  - id: exam
    title: The examination
    items:
      - label: Questions
        value: 185 in total — 175 scored and 10 unscored pilot questions.
        locator: Examination Outline, p. 32
      - label: Time
        value: 4 hours.
        locator: Examination Outline, p. 32
      - label: Format
        value: Multiple choice with four options and one correct answer, all equally weighted.
        locator: Examination Outline, p. 32
      - label: Content outline
        value: >-
          The 6th edition of the BCBA Test Content Outline — 104 tasks in nine content
          areas. The result is based on overall performance, not on each area.
        locator: Examination Outline, p. 32
      - label: Authorization
        value: >-
          Only one active examination authorization at a time; supplementary documents
          are due within 90 days of paying; allow about 45 days for a determination.
        locator: Applying for BCBA Certification, pp. 29–30

  - id: continuing-education
    title: Continuing education
    ourNote: >-
      Units must be earned within the cycle they are applied to, entered before the
      recertification date, and supported by documentation. Repeating an event does
      not count, and nothing carries forward.
    items:
      - label: Requirement
        value: >-
          32 continuing-education units per two-year cycle, including 4 in ethics —
          and 3 in supervision if you supervised technicians, assistant analysts or
          trainees at any point in the cycle.
        locator: Continuing Education, p. 43
      - label: How units are counted
        value: >-
          50 minutes of learning or instruction is 1 unit (25 minutes is 0.5).
        locator: CEU Types, p. 44
      - label: Learning
        value: >-
          Events from authorized continuing-education providers, graduate
          behavior-analysis courses passed with a C or better, and certain board
          activities.
        locator: CEU Types, p. 44
      - label: Teaching
        value: >-
          Instructing an authorized learning event, or teaching university courses in
          behavior analysis at an accredited institution.
        locator: CEU Types, p. 44
      - label: Scholarship
        value: >-
          A peer-reviewed publication is 8 units; a review or decision letter for a
          journal is 1 unit.
        locator: CEU Types, p. 44
      - label: What counts as ethics
        value: >-
          Events on the board's ethics requirements or on cultural and contextual
          responsiveness, tied to practice or applied research, where that content is
          most of the event.
        locator: Ethics CEU, p. 44

  - id: recertification
    title: Recertification
    items:
      - label: Cycle
        value: Every two years, with the application available within 45 days of the date.
        locator: Recertification, p. 49
      - label: Fees
        value: >-
          Application $215 (BCBA) or $290 (BCBA-D); late fee $50.
        locator: Fees, p. 50
      - label: Missed date
        value: >-
          If your units were complete, a 30-day reinstatement period with a late fee.
          Otherwise, or after 30 days, the certification lapses.
        locator: If you do not recertify, pp. 49–50
      - label: Requalifying after a lapse
        value: >-
          Within five years of expiry you may requalify by passing the current
          examination, having earned 16 units per year since expiry. You receive a new
          certification number and are treated as a new certificant for supervision
          training.
        locator: Qualification for Examination via Past Certification, p. 13

  - id: ethics
    title: Ethics and self-reporting
    items:
      - label: Code
        value: >-
          The Ethics Code for Behavior Analysts: four core principles and six sections of
          standards. Supervisors must review it, and the technician code where relevant,
          with the people they supervise.
        locator: Ethics and Self-Reporting, p. 45
      - label: Self-reporting
        value: >-
          Investigations, certain legal and disciplinary events, health conditions that
          affect safe practice, and supervision lapses must be reported to the board
          within 30 days.
        locator: Self-Reporting, pp. 46–48
      - label: Keeping records current
        value: >-
          Name, address and email changes within 30 days; a replacement certificate after
          a name change costs $35.
        locator: Changes to Personal Information, p. 46

# The prose in `sections` and the numbers here say the same thing; a reviewer checking one
# is checking the other. The tracker does arithmetic with these.
#
# No supervision block: an analyst's own certification is not maintained by being
# supervised. The supervision they provide is somebody else's requirement, which is why
# the supervision log lets an analyst record contacts against a supervisee's obligation
# rather than their own.
requirements:
  # The same fieldwork rules as the prose above, in numbers the tracker can check a month
  # against. Both rulesets are modelled: a trainee starting now may be verified under
  # either, and guessing costs months.
  fieldwork:
    totalHours: 2000
    concentratedTotalHours: 1500
    concentratedMultiplier: 1.33
    windowYears: 5
    locator: Hour Requirements, p. 15
    rulesets:
      - id: current
        label: Current requirements
        effectiveFrom: null
        monthlyMinHours: 20
        monthlyMaxHours: 130
        supervisedPercent: 5
        concentratedPercent: 10
        supervisedContacts: 4
        concentratedContacts: 6
        # Null because the current rule is at least one observation with a client, and a
        # count rather than a duration is what has to be met.
        observationMinutes: null
        concentratedObservationMinutes: null
        locator: Overview of Fieldwork Requirements, p. 14; Accrual of Fieldwork, p. 16
      - id: '2027'
        label: 2027 requirements
        effectiveFrom: '2027-01-01'
        monthlyMinHours: 20
        monthlyMaxHours: 160
        supervisedPercent: 5
        concentratedPercent: 7.5
        supervisedContacts: 4
        concentratedContacts: 6
        observationMinutes: 60
        concentratedObservationMinutes: 90
        locator: 2027 Eligibility Requirements, p. 28
    ratios:
      # Both scopes are now settled by the handbook rather than assumed, and they differ.
      # The tracker judges the monthly one month by month and leaves the cumulative one to
      # the running total, because getting this backwards would either call a light month a
      # lost one or let a real shortfall run for years.
      - id: individual-supervision
        label: Individual supervision
        percent: 50
        of: the supervision you received
        scopeVerified: true
        scope: month
        locator: Individual Supervision, p. 20
      - id: unrestricted
        # Stated the other way round in the handbook — restricted activities may be no more
        # than 40% — and it says in as many words that this one is not a monthly test.
        label: Unrestricted activity
        percent: 60
        of: all fieldwork hours
        scopeVerified: true
        scope: total
        locator: Types of Fieldwork Activity, p. 17
    excluded:
      - Conferences, and coursework or homework for a degree
      - Meetings with little behavior-analytic content, and administrative work
      - Non-behavioral interventions, and non-behavioral training such as crisis
        management or CPR
      - Podcasts, and role play that is not about a specific client

  development:
    unitLabel: CEU
    cycleYears: 2
    unitsPerCycle: 32
    ethicsUnits: 4
    supervisionUnits: 3
    supervisionUnitsOnlyIfSupervising: true
    carryOver: false
    effectiveFrom: null
    locator: Continuing Education, p. 43

