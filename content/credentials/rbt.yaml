# Registered Behavior Technician — certification facts.
#
# Every number here was read from the RBT Handbook (version updated 06/2026) on
# 2026-09-14 and restated in our own words. The handbook's text is not reproduced; the
# `locator` on each item says where to check. These requirements change — the 2026
# transition from annual to two-year recertification is happening right now — so the
# handbook version is recorded and shown to readers.

id: rbt
credential: RBT
label: Registered Behavior Technician
issuer: BACB
handbookSourceId: bacb-rbt-handbook-2026
handbookVersion: '06/2026'
officialUrl: https://www.bacb.com/rbt/
outlineId: rbt-tco-3

ourOverview: >-
  A paraprofessional certification. Technicians deliver behavior-analytic services
  under the close, ongoing supervision of a certified supervisor who is responsible for
  their work. Certification requires an application with attestation, a 40-hour
  training, an in-person competency assessment, and a written examination, and it is
  maintained through supervision, ethics obligations and — from 2027 — professional
  development on a two-year cycle.

sections:
  - id: eligibility
    title: Eligibility
    ourNote: >-
      All of these are confirmed by an attesting certificant who may not be related to,
      supervised by, or employed by the applicant. Check the handbook for the exact
      timing rules; the windows below are the ones in force in the 06/2026 version.
    items:
      - label: Minimum age
        value: 18 at the time the application is submitted.
        locator: Eligibility Requirements, p. 3
      - label: Education
        value: A high-school diploma or the equivalent.
        locator: Eligibility Requirements, p. 3
      - label: Background checks
        value: >-
          Two clearances, each no more than 180 days old when the application fee is
          paid: one against criminal records, one against the abuse registry. Fingerprinting is not a board
          requirement, though a state or employer may require it.
        locator: Eligibility Requirements, p. 3
      - label: 40-hour training
        value: >-
          A training that meets the 2026 curriculum outline, completed over at least 5
          days and at most 180 days (start and end dates both count). The board does not
          provide or endorse trainings.
        locator: Eligibility Requirements, p. 3
      - label: Initial competency assessment
        value: >-
          Taken once the 40 hours of training are finished, and within the 90 days that
          precede the application,
          with an assessor who is not related to, supervised by, or employed by the
          applicant.
        locator: Eligibility Requirements, p. 3
      - label: Supervisor on record
        value: >-
          A qualified supervisor or requirements coordinator must list you as a
          supervisee before you begin delivering services.
        locator: Applying to Become an RBT, p. 4

  - id: exam
    title: The examination
    ourNote: >-
      Facts about the format. The content areas and their weights are on the exam
      outline page, which links to the official outline for the task statements.
    items:
      - label: Questions
        value: 85 in total — 75 scored and 10 unscored pilot questions you cannot identify.
        locator: Examination Outline, p. 7
      - label: Time
        value: 90 minutes.
        locator: Examination Outline, p. 7
      - label: Format
        value: Multiple choice with four options and one correct answer.
        locator: Examination Outline, p. 7
      - label: Scoring
        value: >-
          Every scored question counts equally, and the result is based on overall
          performance rather than on each content area separately.
        locator: Examination Outline, p. 7
      - label: Content outline
        value: >-
          The 3rd edition of the RBT Test Content Outline — 43 tasks in six content
          areas. If a new edition takes effect during your authorization window you
          test under the new one.
        locator: Examination, p. 7

  - id: supervision
    title: Ongoing supervision
    ourNote: >-
      Supervision is what keeps the certification active. It is client-focused,
      documented, and separate from professional development — one event cannot count
      for both.
    items:
      - label: Minimum amount
        value: >-
          At least 5% of the hours you spend delivering behavior-analytic services in
          each calendar month, at every organization where you work.
        locator: Ongoing Supervision, p. 16
      - label: Contacts per month
        value: >-
          At least two contacts in real time, with both people present to each other.
          Phone calls and email do not count.
        locator: Ongoing Supervision, p. 17
      - label: Observation
        value: >-
          In at least one monthly contact the supervisor must observe you working with a
          client — in person preferred, live video permitted where lawful. Recorded
          video alone, with no live interaction, may not count.
        locator: Ongoing Supervision, p. 17
      - label: Individual contact
        value: >-
          At least one of the two monthly contacts must be individual. The other may be
          a small group of 2 to 10 technicians.
        locator: Ongoing Supervision, p. 17
      - label: Who may supervise
        value: >-
          An RBT Supervisor (a certified analyst or assistant analyst) or an RBT
          Requirements Coordinator (a certified analyst) with client-specific knowledge
          of your work, who lists you as a supervisee in their portal account.
        locator: RBT Supervisor Requirements, p. 19
      - label: Records
        value: >-
          Records of supervision are kept by both people for seven years or more. Ending
          the supervisory relationship does not end that obligation.
        locator: Supervision Documentation and Audits, p. 21
      - label: If supervision lapses
        value: >-
          Without a supervisor on record you are inactive and may not practice or bill.
          Substantial noncompliance can end the certification, with a six-month bar on
          reapplying. Lapses must be self-reported.
        locator: Non-practicing and Unsupervised RBTs, p. 21

  - id: recertification-through-2026
    title: Recertification through 31 December 2026
    ourNote: >-
      Anyone recertifying during 2026 meets the older annual requirements one last
      time, and their two-year cycle begins after that.
    items:
      - label: Cycle
        value: Annual, on the anniversary of passing the examination.
        locator: Annual Recertification, p. 27
      - label: Competency assessment
        value: >-
          A recertification competency assessment completed no more than 45 days before
          the expiration date, overseen by a qualified supervisor.
        locator: Annual Recertification, p. 27
      - label: Application
        value: >-
          Submitted through your portal account up to 45 days before expiration, with the
          assessment uploaded, a supervision attestation, and the ethics disclosure.
        locator: Submit Your Recertification Application, p. 28
      - label: Fees
        value: >-
          Recertification application $50; late fee $50 during the reinstatement period.
        locator: Fees, p. 29
      - label: Missed date
        value: >-
          A 30-day reinstatement period with a late fee. After that the certification
          expires and you must reapply under current requirements and retake the exam.
        locator: Reinstatement Period; Failure to Recertify, p. 29

  - id: recertification-from-2027
    title: Recertification from 2027
    ourNote: >-
      Applies to anyone certified or recertified in 2026 onward. The annual competency
      assessment is replaced by professional development on a two-year cycle.
    items:
      - label: Cycle
        value: Every two years, with the application available within 45 days of the date.
        locator: Recertification After January 1, 2027, p. 30
      - label: Professional development
        value: >-
          12 hours of professional development units per two-year cycle, all earned
          within that cycle. Missed units cannot be made up afterward and extra units do
          not carry forward.
        locator: Professional Development, p. 30
      - label: What counts
        value: >-
          Behavior-analytic in-service training at your organization led by a certified
          analyst (not client-specific training); events from authorized
          continuing-education providers; and university behavior-analysis courses
          passed with a C or better.
        locator: PDU Types, p. 30
      - label: What does not count
        value: >-
          Ongoing supervision, client-specific training, fieldwork toward an analyst
          credential, and repeating an activity already counted.
        locator: PDU Types, p. 30; Repeating PD Activities, p. 31
      - label: Competency assessment
        value: >-
          No longer part of routine recertification. From 2027 the same assessment,
          renamed the reentry competency assessment, is used to return from inactive
          status.
        locator: Voluntary Inactive Status, p. 32

  - id: inactive-status
    title: Inactive status
    items:
      - label: Voluntary inactive
        value: >-
          Available within your cycle for up to two years ($25). You may not practice or
          bill while inactive. Returning requires a competency assessment within 45 days
          before the request and a $25 fee.
        locator: Voluntary Inactive Status, p. 32
      - label: No supervisor on record
        value: >-
          Automatically inactive until a qualified supervisor lists you again.
        locator: Inactive Due to No Supervisor/Coordinator on Record, p. 31
      - label: Active duty or reserve
        value: >-
          A pause of up to two years for service members called to duty, at no fee.
        locator: Active Duty/Reserve Status Policy, p. 32

  - id: ethics
    title: Ethics and self-reporting
    items:
      - label: Code
        value: >-
          The RBT Ethics Code (2.0): 29 standards in three sections, covering general
          responsibilities, responsibilities in delivering services, and responsibilities
          to the board and your supervisor.
        locator: Ethics and Self-Reporting, p. 23
      - label: Self-reporting
        value: >-
          Certain events about your own conduct, health or legal situation must be
          reported to the board within 30 days of your becoming aware of them. When
          unsure, report.
        locator: Critical Events, p. 23
      - label: Keeping records current
        value: >-
          Name, address and email changes must be updated in your portal account within
          30 days.
        locator: Changes to Personal Information, p. 23

# The prose in `sections` and the numbers here say the same thing; a reviewer checking one
# is checking the other. The tracker does arithmetic with these.
requirements:
  supervision:
    monthlyPercent: 5
    contactsPerMonth: 2
    observedContactsPerMonth: 1
    individualContactsPerMonth: 1
    groupMax: 10
    locator: Ongoing Supervision, pp. 16-17
  development:
    unitLabel: PDU
    cycleYears: 2
    unitsPerCycle: 12
    ethicsUnits: null
    supervisionUnits: null
    supervisionUnitsOnlyIfSupervising: false
    carryOver: false
    effectiveFrom: '2027-01-01'
    locator: Professional Development, p. 30

