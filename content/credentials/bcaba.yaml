# Board Certified Assistant Behavior Analyst — certification facts.
#
# Every number here was read from the BCaBA Handbook (version updated 06/2026) and
# restated in our own words. The handbook's text is not reproduced; the `locator` on each
# item says where to check. Two transitions are live in this document and both are
# recorded rather than smoothed over: the coursework requirements change on
# 31 December 2026, and the ongoing-supervision percentage stops being tiered in 2027.

id: bcaba
credential: BCaBA
label: Board Certified Assistant Behavior Analyst
issuer: BACB
handbookSourceId: bacb-bcaba-handbook-2026
handbookVersion: '06/2026'
officialUrl: https://www.bacb.com/bcaba/
outlineId: bcaba-tco-6

ourOverview: >-
  An undergraduate-level certification. Assistant analysts deliver and supervise
  behavior-analytic services under the ongoing supervision of a BCBA, who remains
  responsible for that work. The certification cannot be practised without a supervisor
  on record: an assistant analyst without one is inactive, and that includes losing the
  ability to supervise technicians or sign their competency assessments.

sections:
  - id: eligibility
    title: Eligibility
    ourNote: >-
      Two pathways, each needing a degree, coursework, supervised fieldwork and a passing
      examination. The coursework requirements change on 31 December 2026, so check the
      handbook for which set applies to your application date.
    items:
      - label: Pathway 1 — accredited degree
        value: >-
          A bachelor's degree or higher obtained in 2015 or later from a program that was
          accredited by the Association for Behavior Analysis International at the time
          the degree was earned.
        locator: Pathway 1, p. 7
      - label: Pathway 2 — coursework
        value: >-
          A bachelor's degree or higher in any field from a qualifying institution, plus
          behavior-analytic coursework at undergraduate level or above, taken within ten
          years of the application year, passed at C or better, at an institution with a
          Pathway 2 Program Contact.
        locator: Pathway 2, p. 8
      - label: Fieldwork
        value: >-
          1,300 hours of Supervised Fieldwork, or 1,000 hours of Concentrated Supervised
          Fieldwork, or a combination — concentrated hours are multiplied by 1.3 and the
          combined total must reach 1,300.
        locator: Fieldwork Requirements, p. 11; Number of Hours by Fieldwork Type, p. 12
      - label: Hours per supervisory period
        value: A minimum of 20 and a maximum of 130 fieldwork hours in a supervisory period.
        locator: Fieldwork Requirements, p. 11
      - label: Supervision during fieldwork
        value: >-
          5% of hours for Supervised Fieldwork, or 10% for Concentrated Supervised
          Fieldwork, with at least half of the supervised hours delivered one-to-one.
        locator: Fieldwork Requirements, p. 11
      - label: Unrestricted activities
        value: >-
          At least 40% of total fieldwork hours must be unrestricted activities — for
          1,300 hours of Supervised Fieldwork that is at least 520 hours.
        locator: Acceptable Activities, p. 14
      - label: Coursework before fieldwork
        value: >-
          Fieldwork may not begin until qualifying coursework has started, and hours only
          count if the course is later passed at C or better.
        locator: Fieldwork Requirements, p. 12

  - id: exam
    title: The examination
    ourNote: >-
      Facts about the format. The content areas and their weights are on the exam outline
      page, which links to the official outline for the task statements.
    items:
      - label: Questions
        value: >-
          175 multiple-choice questions: 150 scored and 25 unscored pilot questions. Each
          has four options and one correct answer.
        locator: Examination Outline, p. 29
      - label: Time
        value: Four hours, which includes the tutorial and the survey.
        locator: Examination Terms and Conditions, p. 34
      - label: Attempts
        value: >-
          Up to eight attempts within the two-year authorisation period that follows the
          first approval to test.
        locator: Retaking Your Examination, p. 32

  - id: maintenance
    title: Staying certified
    ourNote: >-
      Two things run in parallel: continuing education across a two-year cycle, and
      ongoing supervision every month you deliver services. Losing the supervisor makes
      the certification inactive immediately, whatever the CEU position.
    items:
      - label: Cycle
        value: Two years, with 20 continuing education units earned inside it.
        locator: Continuing Education, p. 40
      - label: Ethics units
        value: 4 of the 20 units must be on ethics.
        locator: Continuing Education, p. 40
      - label: Supervision units
        value: >-
          3 of the 20 must be on supervision, for anyone who supervised a technician on
          record at any point in the cycle.
        locator: Supervision CEUs, p. 42
      - label: Nothing carries forward
        value: >-
          Units count only in the cycle they were earned in, and missed units cannot be
          made up during the reinstatement period.
        locator: Continuing Education, p. 40
      - label: Supervisor
        value: >-
          An active BCBA with no current disciplinary sanctions who meets the ongoing
          supervision CEU requirement. Without one on record you are inactive and may not
          practise.
        locator: 2027 Ongoing Supervision Requirements, p. 55
      - label: Amount of supervision — now
        value: >-
          At least 5% of monthly behavior-analytic service hours for the first 1,000 hours
          of post-certification practice, with no less than an hour of supervision every
          two weeks, then at least 2% after that.
        locator: Supervision Requirements, p. 47
      - label: Amount of supervision — from 2027
        value: >-
          A flat 5% of monthly service hours. The handbook states there is no longer a
          difference for the first 1,000 hours.
        locator: 2027 Ongoing Supervision Requirements, p. 55
      - label: Frequency
        value: >-
          You and your supervisor must meet at least once in any month you deliver
          services, and the supervisor must be reachable between meetings.
        locator: Supervision Requirements, p. 47
      - label: Group supervision
        value: >-
          Individual and group may be combined. A group is the supervisor and no more than
          ten supervisees, and there is no cap on how much of the supervision is group.
        locator: 2027 Ongoing Supervision Requirements, p. 55
      - label: Observation with a client
        value: Your supervisor must observe you working with a client once a quarter.
        locator: 2027 Ongoing Supervision Requirements, p. 55
      - label: Reinstatement
        value: >-
          Thirty days after the recertification date to reinstate and pay the late fee.
          After that the certification expires.
        locator: Reinstatement Period, p. 67

requirements:
  supervision:
    # Tiered today, flat from 2027. Both figures are modelled so the tracker can report
    # the hours and say plainly that it cannot tell which tier applies — it has no way to
    # know how much post-certification practice somebody has accrued.
    monthlyPercent: 5
    reducedPercent: 2
    reducedAfterServiceHours: 1000
    contactsPerMonth: 1
    # Observation is quarterly rather than monthly, and a monthly minimum of 1 would
    # report a shortfall three months in four. It is stated in the prose above instead.
    observedContactsPerMonth: 0
    # Group supervision is uncapped for this credential, so there is no one-to-one floor.
    individualContactsPerMonth: 0
    groupMax: 10
    locator: Supervision Requirements, p. 47
  development:
    unitLabel: CEU
    cycleYears: 2
    unitsPerCycle: 20
    ethicsUnits: 4
    supervisionUnits: 3
    supervisionUnitsOnlyIfSupervising: true
    carryOver: false
    effectiveFrom: null
    locator: Continuing Education, p. 40

